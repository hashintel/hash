[package]
name              = "hash-integrations"
description       = "Loads data from external sources into the HASH graph"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies

# Public third-party dependencies

# Private workspace dependencies
error-stack                     = { workspace = true }
hash-integrations-definition    = { workspace = true }
hash-integrations-orchestration = { workspace = true }
hash-telemetry                  = { workspace = true, features = ["clap"] }
type-system                     = { workspace = true }

# Private third-party dependencies
clap           = { workspace = true, features = ["cargo", "derive", "env", "wrap_help"] }
clap_complete  = { workspace = true }
derive_more    = { workspace = true, features = ["display", "error"] }
mimalloc       = { workspace = true }
serde          = { workspace = true, features = ["derive"] }
simple-mermaid = { workspace = true }
uuid           = { workspace = true, features = ["v5"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
