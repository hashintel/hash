[project]
name = "petrinaut-optimization"
version = "0.1.0"
description = "Scenario-parameter optimization for Petrinaut using Optuna"
readme = "README.md"
requires-python = "<3.15,>=3.14"
license = "MIT or Apache-2.0"
dependencies = [
    "fastapi<0.129.0,>=0.128.8",
    "opentelemetry-exporter-otlp-proto-grpc<2.0.0,>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http<2.0.0,>=1.44.0",
    "opentelemetry-instrumentation-fastapi<0.66.0,>=0.65b0",
    "opentelemetry-sdk<2.0.0,>=1.44.0",
    "optuna>=4.9,<5",
    "petrinaut-optimizer-core",
    "petrinaut-python",
    "pydantic<3.0.0,>=2.13.4",
    "python-dotenv<2.0.0,>=1.0.0",
    "uvicorn[standard]<0.40.0,>=0.39.0",
]
authors = [
    { name = "HASH" },
]


[build-system]
requires      = ["uv_build<0.13.0,>=0.12.16"]
build-backend = "uv_build"
[dependency-groups]
dev = [
    "httpx<0.29.0,>=0.28",
    "pytest>=9.1.1,<10",
    "ruff<0.17,>=0.16.8",
    "tach<0.36,>=0.35",
    "ty<0.0.83,>=0.0.82",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
petrinaut-optimizer-core = { workspace = true }
petrinaut-python         = { workspace = true }

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TRY", "DTZ", "PTH"]
ignore = [
    # Error messages name the value that failed: the metric, the seed, the limit.
    # This rule asks for that detail to move into exception subclasses instead.
    "TRY003",
    # Protocol responses are data, and data that does not conform raises
    # ValueError. This rule reads every isinstance check as an argument-type
    # check and asks for TypeError.
    "TRY004",
    # `ruff format` owns line width. What it cannot split is a long string or an
    # `@role` annotation, which the architecture-docs extractor reads as one line.
    "E501",
]
