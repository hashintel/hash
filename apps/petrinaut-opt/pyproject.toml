[project]
name = "petrinaut-optimization"
version = "0.1.0"
description = "Scenario-parameter optimization for Petrinaut using Optuna"
readme = "README.md"
requires-python = "<3.15,>=3.14"
license = "MIT or Apache-2.0"
dependencies = [
    "fastapi<0.142.0,>=0.141.1",
    "opentelemetry-exporter-otlp-proto-grpc<2.0.0,>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http<2.0.0,>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66.0",
    "opentelemetry-sdk<2.0.0,>=1.44.0",
    "optuna>=5.0.0,<6.0.0",
    "petrinaut-optimizer-core",
    "petrinaut-python",
    "pydantic<3.0.0,>=2.13.4",
    "pydantic-settings>=2.15.0,<3.0.0",
    "python-dotenv<2.0.0,>=1.0.0",
    "starlette<2.0.0,>=1.7.0",
    "uvicorn[standard]<0.54.0,>=0.53.0",
]
authors = [
    { name = "HASH" },
]


[build-system]
requires      = ["uv_build<0.13.0,>=0.12.16"]
build-backend = "uv_build"
[dependency-groups]
dev = [
    "deptry<0.26,>=0.25.1",
    "httpx<0.29.0,>=0.28",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff<0.17,>=0.16.8",
    "tach<0.36,>=0.35",
    "ty<0.0.85,>=0.0.84",
]

[tool.uv.sources]
petrinaut-optimizer-core = { workspace = true }
petrinaut-python         = { workspace = true }

[tool.deptry.package_module_name_map]
petrinaut-python = "petrinaut"

[tool.tach]
source_roots                 = ["src"]
exclude                      = []
exact                        = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
root_module                  = "forbid"

[[tool.tach.modules]]
path       = "petrinaut_optimization"
depends_on = []

[tool.tach.rules]
require_ignore_directive_reasons = "error"
unused_ignore_directives         = "error"
