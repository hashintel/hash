[project]
name = "petrinaut-optimization"
version = "0.1.0"
description = "Scenario-parameter optimization for Petrinaut using Optuna"
readme = "README.md"
requires-python = ">=3.10.20"
dependencies = [
    "fastapi>=0.128.8",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "optuna>=4.9,<5",
    "petrinaut-optimizer-core",
    "petrinaut-python",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.39.0",
]

[tool.uv.sources]
petrinaut-optimizer-core = { workspace = true }
petrinaut-python         = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TRY", "DTZ", "PTH"]
ignore = [
    # Error messages name the value that failed: the metric, the seed, the limit.
    # This rule asks for that detail to move into exception subclasses instead.
    "TRY003",
    # Protocol responses are data, and data that does not conform raises
    # ValueError. This rule reads every isinstance check as an argument-type
    # check and asks for TypeError.
    "TRY004",
    # `ruff format` owns line width. What it cannot split is a long string or an
    # `@role` annotation, which the architecture-docs extractor reads as one line.
    "E501",
]
