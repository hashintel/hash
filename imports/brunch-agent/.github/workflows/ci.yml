# The CI smoke (spec §12.5): `vite build` plus the simulation suite — no model
# key, no substrate, no flake. An optional secret-gated real-model `flue run`
# smoke is named in the spec and deliberately absent until a provider key
# exists; the suite asserts that it has not drifted in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Full-SHA pins: org policy refuses tag-pinned actions (the job fails at
      # setup before any step runs). Comments carry the tag each SHA matched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Formatting
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      # Reads the repository tree and the harness contract; touches no model
      # and no substrate. Three suites, with different jobs: boundaries makes
      # the spec §4/§12.2 invariants enforceable rather than aspirational;
      # build-artifact checks what was actually emitted, because a Flue build
      # that silently drops an agent still exits 0; known-gaps keeps the spec
      # §14.5 open items visible and goes red when one closes unremarked.
      #
      # The build gate lives inside this step: build-artifact's beforeAll
      # runs the full build (Flue server environment plus the plain client
      # build that @flue/vite does not do) so that `bun test` alone is a
      # complete signal. A separate Build step would build the app a second
      # time for no additional coverage.
      - name: Test
        run: bun test
