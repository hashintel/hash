[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name              = "hash-integrations-graph-tests"
publish.workspace = true
version.workspace = true

[dev-dependencies]
# Private workspace dependencies
hash-crypto                  = { workspace = true }
hash-graph-api               = { workspace = true }
hash-graph-authorization     = { workspace = true }
hash-graph-postgres-store    = { workspace = true }
hash-graph-store             = { workspace = true }
hash-graph-test-data         = { workspace = true }
hash-graph-type-fetcher      = { workspace = true }
hash-integrations-definition = { workspace = true }
hash-integrations-engine     = { workspace = true }
hash-integrations-ledger     = { workspace = true }
hash-middleware              = { workspace = true }
type-system                  = { workspace = true }

axum                   = { workspace = true }
# Private third-party dependencies
insta                  = { workspace = true, features = ["json"] }
opentelemetry          = { workspace = true, features = ["metrics"] }
pretty_assertions      = { workspace = true }
regex                  = { workspace = true }
reqwest                = { workspace = true }
serde                  = { workspace = true, features = ["derive"] }
serde-saphyr           = { workspace = true }
serde_json             = { workspace = true }
tempfile               = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true, features = ["minio", "postgres"] }
time                   = { workspace = true }
tokio                  = { workspace = true, features = ["macros", "rt-multi-thread"] }
url                    = { workspace = true }

[lints]
workspace = true

[[test]]
name = "aviation"
path = "aviation/mod.rs"

[[test]]
name = "ledger"
path = "ledger/mod.rs"
