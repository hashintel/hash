name: Housekeeping

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      repoCache:
        description: "Reset or disable the cache?"
        type: choice
        default: enabled
        options:
          - enabled
          - disabled
          - reset
      logLevel:
        description: "Override default log level"
        type: choice
        default: info
        options:
          - "debug"
          - "info"
          - "warn"
          - "error"
      overrideSchedule:
        description: "Override all schedules"
        type: boolean
        default: false
      dryRun:
        description: "Dry run mode"
        type: choice
        default: disabled
        options:
          - disabled
          - extract
          - lookup
          - full

# A new run waits for the running one instead of cancelling it, so a Renovate
# run on `main` always finishes.
concurrency:
  group: ${{ github.workflow }}-caller
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Dependencies
    permissions:
      actions: read # Renovate downloads its repository cache artifact
      contents: read
      id-token: write # Vault JWT login that mints the Renovate installation token
    uses: hashintel/actions/.github/workflows/housekeeping-dependencies.yml@731e604877081fb3f3da3bd15ed9e9979a03c6c2 # main
    with:
      repoCache: ${{ inputs.repoCache || 'enabled' }}
      logLevel: ${{ inputs.logLevel || 'info' }}
      overrideSchedule: ${{ inputs.overrideSchedule || false }}
      dryRun: ${{ inputs.dryRun || 'disabled' }}
    secrets:
      # Only in the `Renovate` environment of the called jobs; a called workflow gets only the secrets its caller names.
      # jactionlint ignore=secrets-outside-env
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # Only in the `Renovate` environment of the called jobs; a called workflow gets only the secrets its caller names.
      # jactionlint ignore=secrets-outside-env
      RENOVATE_TOKEN_ENC_KEY: ${{ secrets.RENOVATE_TOKEN_ENC_KEY }}
