name: Debug install-tools

on:
  pull_request:
    paths:
      - .github/workflows/debug-install-tools.yml

jobs:
  debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install tools
        id: install-tools
        continue-on-error: true
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          report() {
            local name=$1
            shift
            local output
            output=$("$@" 2>&1 | tail -n 25 | tr '\n' '|' | cut -c 1-3000) || true
            echo "::warning title=${name}::${output}"
          }
          report "bindgen header" bash -c "echo '#include <stdint.h>' > /tmp/t.h && bindgen /tmp/t.h | head -n 5"
          report "build prefix" .github/actions/install-aws-lc/build-prefix.sh /tmp/dbg-prefix dev 0.45.0 9bff6c3b54fad79a2e60b8102caf565819711497c1f5f092f49508e2f5c31b27
          report "built prefix" ls -R /tmp/dbg-prefix
          report "libclang" bash -c "ls /usr/lib/llvm-*/lib/libclang*.so* /usr/lib/x86_64-linux-gnu/libclang* 2>&1"
