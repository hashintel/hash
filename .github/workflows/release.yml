## Uses a GitHub App installation token so that ‘Version Packages’ PRs trigger
## downstream workflows (GITHUB_TOKEN-created PRs do not).
## https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs

name: Release
on:
  push:
    branches:
      - main
jobs:
  mint-token:
    name: Mint token
    runs-on: ubuntu-latest
    if: github.repository == 'hashintel/hash'
    environment: main
    permissions:
      contents: read
      id-token: write
    outputs:
      token-ciphertext: ${{ steps.encrypt.outputs.token-ciphertext }}

    steps:
      - name: Get token
        id: app-token
        uses: hashintel/.github/.github/actions/github-app-token@b7a5d7f651c1d6a862d5dd97aa6164125bedb6c5 # main
        with:
          vault-address: ${{ vars.VAULT_PROD_ADDR }}
          vault-role: ci-hash-release
          app-id: "4497272"
          transit-key: github-app-hash-release
          repository: ${{ github.repository }}
          cf-access-client-id: ${{ vars.CF_ACCESS_PROD_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_PROD_CLIENT_SECRET }}

      # GitHub drops masked values from job outputs, so only ciphertext can cross.
      - name: Encrypt token
        id: encrypt
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          ENC_KEY: ${{ secrets.RELEASE_TOKEN_ENC_KEY }}
        run: |
          : "${TOKEN:?}" "${ENC_KEY:?}"
          ciphertext=$(printf '%s' "${TOKEN}" | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ENC_KEY -base64 -A)
          echo "token-ciphertext=${ciphertext}" >>"${GITHUB_OUTPUT}"

  release:
    runs-on: ubuntu-latest
    needs: mint-token
    environment: main
    permissions:
      contents: read

    steps:
      # First step, so the plaintext is masked before anything else runs.
      - name: Decrypt token
        id: app-token
        env:
          TOKEN_CIPHERTEXT: ${{ needs.mint-token.outputs.token-ciphertext }}
          ENC_KEY: ${{ secrets.RELEASE_TOKEN_ENC_KEY }}
        run: |
          : "${TOKEN_CIPHERTEXT:?}" "${ENC_KEY:?}"
          token=$(printf '%s' "${TOKEN_CIPHERTEXT}" | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENC_KEY -base64 -A)
          echo "::add-mask::${token}"
          echo "token=${token}" >>"${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The sccache credential fetch from Vault needs `id-token: write`.
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sccache: false

      - name: Warm up repository
        uses: ./.github/actions/warm-up-repo

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: yarn changeset:publish
          version: yarn changeset:version
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
          TURBO_LOG_LEVEL: debug
          TURBO_TELEMETRY_DISABLED: 1
          # Ensure turbo outputs full build logs (not just summaries) so
          # lifecycle script errors are visible in the changesets output.
          TURBO_UI: "false"
          TURBO_LOG_ORDER: stream
          TURBO_LOG_VERBOSITY: 1

      - name: Notify Slack on failure
        uses: rtCamp/action-slack-notify@c58b60ee33df2229ed2d2eed86eeaf7e6c527c5a
        if: ${{ failure() }}
        env:
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: "Error releasing NPM packages <!subteam^S09KH99698T>" # Notifies @devops
          SLACK_TITLE: Package release failed
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: GitHub

      - name: Print npm logs on failure
        if: failure()
        run: |
          echo "🪵 Dumping npm debug logs..."
          find /home/runner/.npm/_logs -type f -exec echo "--- {} ---" \; -exec cat {} \; || echo "No npm logs found."

      - name: Print Turbo logs on failure
        if: failure()
        run: |
          echo "🔍 Searching for turbo logs..."
          find . -type f -name "*.log" -path "*/.turbo/*" -exec echo "--- {} ---" \; -exec cat {} \; || echo "No turbo logs found."
          echo ""
          echo "🔍 Searching for turbo daemon logs..."
          find /tmp -type f -name "*.log" -path "*/turbod-*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "No turbo daemon logs found."

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-debug-logs
          path: |
            /home/runner/.npm/_logs/
            **/.turbo/*.log
