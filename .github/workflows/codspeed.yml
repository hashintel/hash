name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rust: false

      - name: Determine changed packages that have codspeed
        id: packages
        run: |
          PACKAGES_QUERY='query { affectedPackages(base: "HEAD^" filter: {has: {field: "TASK_NAME", value: "build:codspeed"}}) {items {name path}}}'
          PACKAGES=$(turbo query "$PACKAGES_QUERY" \
            | jq --compact-output '.data.affectedPackages.items | [(.[] | select(.name != "//"))] | { name: [.[].name], include: . }')

          echo "packages=$PACKAGES" | tee -a "$GITHUB_OUTPUT"

  sccache-credentials:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      encrypted-credentials: ${{ steps.mint.outputs.encrypted_credentials }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Mint sccache credentials
        id: mint
        uses: $/.github/actions/mint-sccache-credentials
        with:
          vault_address: ${{ vars.VAULT_STAGE_ADDR }}
          cf_access_client_id: ${{ vars.CF_ACCESS_STAGE_CLIENT_ID }}
          cf_access_client_secret: ${{ secrets.CF_ACCESS_STAGE_CLIENT_SECRET }}
          encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

  benchmarks:
    name: Run benchmarks
    needs: [setup, sccache-credentials]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # for OpenID Connect authentication with CodSpeed
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.packages) }}
      fail-fast: false
    if: needs.setup.outputs.packages != '{"name":[],"include":[]}'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Clean up disk
        uses: $/.github/actions/clean-up-disk

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

      - name: Prune repository
        uses: $/.github/actions/prune-repository
        with:
          scope: ${{ matrix.name }}

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      - name: Build the benchmark target
        run: turbo run build:codspeed --filter=${{ matrix.name }}

      - name: Run the benchmark
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4.18.5
        with:
          mode: simulation
          run: turbo run test:codspeed --filter=${{ matrix.name }}
