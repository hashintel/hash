name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions: {}

# Every push to `main` and every dispatch gets a run of its own; a pull request's newer run cancels its older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rust: false

      - name: Determine changed packages that have codspeed
        id: packages
        run: |
          PACKAGES=$(.github/scripts/affected-packages.sh build:codspeed)

          echo "packages=$PACKAGES" | tee -a "$GITHUB_OUTPUT"

  sccache-credentials:
    name: Sccache credentials
    environment:
      name: Sccache
      deployment: false
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Vault JWT login that fetches the sccache credentials
    outputs:
      encrypted-credentials: ${{ steps.mint.outputs.encrypted_credentials }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2

      - name: Mint sccache credentials
        id: mint
        uses: $/.github/actions/mint-sccache-credentials
        with:
          vault_address: ${{ vars.VAULT_ADDR }}
          cf_access_client_id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          cf_access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

  benchmarks:
    name: Run benchmarks
    environment:
      name: Sccache
      deployment: false
    needs: [setup, sccache-credentials]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # for OpenID Connect authentication with CodSpeed
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.packages) }}
      fail-fast: false
    if: ${{ needs.setup.outputs.packages != '{"name":[],"include":[]}' }}
    steps:
      - name: Show selection reason
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: echo "$MATRIX"

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Clean up disk
        uses: hashintel/actions/.github/actions/clean-up-disk@main
        with:
          required-free-gib: 20

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}
          aws_lc_profile: release

      - name: Prune repository
        uses: $/.github/actions/prune-repository
        with:
          scope: ${{ matrix.name }}

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      - name: Build the benchmark target
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run build:codspeed --filter="$PACKAGE_NAME"

      - name: Run the benchmark
        uses: CodSpeedHQ/action@v5.8.0
        with:
          mode: simulation
          run: turbo run test:codspeed --filter=${{ matrix.name }}
