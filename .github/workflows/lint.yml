name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

env:
  TURBO_TEAM: hashintel
  TURBO_CACHE: remote:rw

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rust: false

      - name: Determine changed packages
        id: packages
        run: |
          # The steps gate on the per-task keys — the tasks are independent and
          # can differ in what they consider affected.
          set -o pipefail
          PACKAGES=$(
            .github/scripts/affected-packages.sh codegen lint:eslint lint:oxlint lint:tsc lint:clippy lint:ruff format:ruff check:ty lint:tach lint:deptry |
            jq --compact-output '
              .include |= map(select(.name != "hash-python"))
              | .name = [.include[].name]
            '
          )

          echo "packages=$PACKAGES" | tee -a "$GITHUB_OUTPUT"

  sccache-credentials:
    name: Sccache credentials
    environment:
      name: Sccache
      deployment: false
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Vault JWT login that fetches the sccache credentials
    outputs:
      encrypted-credentials: ${{ steps.mint.outputs.encrypted_credentials }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2

      - name: Mint sccache credentials
        id: mint
        uses: $/.github/actions/mint-sccache-credentials
        with:
          vault_address: ${{ vars.VAULT_ADDR }}
          cf_access_client_id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          cf_access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

  package:
    name: Package
    environment:
      name: Sccache
      deployment: false
    permissions:
      contents: read
      security-events: write # uploads the clippy SARIF to code scanning
    needs: [setup, sccache-credentials]
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.packages) }}
      fail-fast: false
    if: ${{ needs.setup.outputs.packages != '{"name":[],"include":[]}' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Show selection reason
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: echo "$MATRIX"

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Clean up disk
        uses: hashintel/actions/.github/actions/clean-up-disk@main
        with:
          required-free-gib: 20

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

      - name: Prune repository
        uses: $/.github/actions/prune-repository
        with:
          scope: ${{ matrix.name }}

      - name: Find lint steps to run
        id: lints
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          HAS_RUST=$([[ -f "$PACKAGE_PATH/Cargo.toml" || "$PACKAGE_PATH" = "apps/hash-graph" ]] && echo 'true' || echo 'false')
          echo "has-rust=$HAS_RUST" | tee -a "$GITHUB_OUTPUT"

          # Generated files can change without affecting codegen. The drift check needs command discovery rather than affected-task selection.
          set -o pipefail
          HAS_CODEGEN=$(turbo run codegen --filter "$PACKAGE_NAME" --dry=json | jq --arg package "$PACKAGE_NAME" 'any(.tasks[]; .package == $package and .task == "codegen" and .command != "<NONEXISTENT>")')
          echo "has-codegen=$HAS_CODEGEN" | tee -a "$GITHUB_OUTPUT"

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      - name: Install Python workspace for Python lint
        if: ${{ matrix['lint:ruff'] != null || matrix['format:ruff'] != null || matrix['check:ty'] != null || matrix['lint:tach'] != null || matrix['lint:deptry'] != null }}
        run: uv sync --locked --all-packages

      - name: Show disk usage
        run: df -h

      - name: Run codegen
        if: ${{ always() && steps.lints.outputs.has-codegen == 'true' }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          set -o pipefail
          turbo run codegen --force --filter "$PACKAGE_NAME"
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "Checking diff of $PACKAGE_PATH/$line"
              git --no-pager diff --exit-code --color -- "$PACKAGE_PATH/$line"
            fi
          done <<< "$(grep -v '^ *//' "$PACKAGE_PATH/turbo.json" | jq -r '.tasks.codegen.outputs | if . == null then "." else .[] end')"

      - name: Show disk usage
        run: df -h

      - name: Run ESLint
        if: ${{ always() && matrix['lint:eslint'] != null }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run lint:eslint --filter "$PACKAGE_NAME"

      - name: Run Oxlint
        if: ${{ always() && matrix['lint:oxlint'] != null }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run lint:oxlint --filter "$PACKAGE_NAME"

      - name: Run TSC
        if: ${{ always() && matrix['lint:tsc'] != null }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run lint:tsc --filter "$PACKAGE_NAME"

      - name: Run Ruff
        if: ${{ always() && matrix['lint:ruff'] != null }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run lint:ruff --filter "$PACKAGE_NAME"

      - name: Check Ruff formatting
        if: ${{ always() && matrix['format:ruff'] != null }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run format:ruff --filter "$PACKAGE_NAME" -- --check

      - name: Run ty
        if: ${{ always() && matrix['check:ty'] != null }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run check:ty --filter "$PACKAGE_NAME"

      - name: Run Python dependency and architecture checks
        if: ${{ always() && (matrix['lint:tach'] != null || matrix['lint:deptry'] != null) }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: turbo run lint:tach lint:deptry --continue=always --filter "$PACKAGE_NAME"

      - name: Run rustfmt
        if: ${{ always() && steps.lints.outputs.has-rust == 'true' }}
        working-directory: ${{ matrix.path }}
        run: just format --check

      - name: Run clippy
        if: ${{ always() && matrix['lint:clippy'] != null }}
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          pushd "$PACKAGE_PATH"
          CLIPPY_EXIT=0
          turbo run lint:clippy --filter "$PACKAGE_NAME" -- --message-format=json \
            > clippy-output.log || CLIPPY_EXIT=$?
          clippy-sarif < clippy-output.log \
            | jq --arg path "$PACKAGE_PATH" '.runs[].results |= map(select(.locations[].physicalLocation.artifactLocation.uri | startswith($path)))' \
            | jq '.runs[].results |= unique' \
            > clippy.sarif
          popd
          sarif-fmt < "$PACKAGE_PATH/clippy.sarif"

          # The SARIF above keeps only this crate's spanned diagnostics; a failed build also needs
          # errors from dependencies and span-less errors such as "could not compile".
          if [[ $CLIPPY_EXIT -ne 0 ]]; then
            jq -Rr '(fromjson? // .) | if type == "object" then select(.reason == "compiler-message") | .message.rendered else . end' \
              "$PACKAGE_PATH/clippy-output.log"
            exit "$CLIPPY_EXIT"
          fi

          jq -e '.runs[].results == []' "$PACKAGE_PATH/clippy.sarif" > /dev/null

          # Cargo's manifest lints (e.g. `cargo::unused_dependencies`) are plain text, not compiler
          # JSON, so they bypass the SARIF gate above and were consumed by the pipeline. Re-print
          # the human-readable output (dropping JSON) and fail on the package-level lint. The
          # workspace-level variant is ignored: it false-positives in the pruned per-package repo.
          if grep -qF "warning: unused dependency" "$PACKAGE_PATH/clippy-output.log"; then
            grep -vF '{"reason":' "$PACKAGE_PATH/clippy-output.log"
            exit 1
          fi

      - name: Print clippy errors to summary
        if: ${{ failure() && matrix['lint:clippy'] != null }}
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          {
            echo '```'
            sarif-fmt < "$PACKAGE_PATH/clippy.sarif"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.32.2
        if: ${{ always() && matrix['lint:clippy'] != null }}
        with:
          sarif_file: ${{ matrix.path }}/clippy.sarif
          category: ${{ matrix.name }}

      - name: Check public documentation
        if: ${{ always() && steps.lints.outputs.has-rust == 'true' }}
        working-directory: ${{ matrix.path }}
        env:
          RUSTDOCFLAGS: "--check -Z unstable-options -D warnings"
        run: |
          TARGET=$(yq -p toml -r 'select(.package.metadata.ci.skip-docs-target != true) | .package.metadata.docs.rs.targets[0] // ""' Cargo.toml 2>/dev/null || true)
          cargo doc --all-features --no-deps -Zrustdoc-scrape-examples ${TARGET:+--target "$TARGET"}

      - name: Check private documentation
        if: ${{ always() && steps.lints.outputs.has-rust == 'true' }}
        working-directory: ${{ matrix.path }}
        env:
          RUSTDOCFLAGS: "--check -Z unstable-options -D warnings"
        run: |
          TARGET=$(yq -p toml -r 'select(.package.metadata.ci.skip-docs-target != true) | .package.metadata.docs.rs.targets[0] // ""' Cargo.toml 2>/dev/null || true)
          cargo doc --all-features --no-deps -Zrustdoc-scrape-examples --document-private-items ${TARGET:+--target "$TARGET"}

      - name: Show disk usage
        run: df -h

  global:
    name: Global
    environment:
      name: Sccache
      deployment: false
    permissions:
      contents: read
      checks: write # the Annotate step creates a check run with the SQLFluff annotations
    needs: [sccache-credentials]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Clean up disk
        uses: hashintel/actions/.github/actions/clean-up-disk@main
        with:
          required-free-gib: 20

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      - name: Install Python for task resolution
        run: uv python install --no-bin

      - name: Validate Dependency Diagrams
        if: ${{ success() || failure() }}
        run: |
          mise run doc:dependency-diagram
          git add --intent-to-add -- ':(glob)**/docs/**'
          git --no-pager diff --exit-code --color -- ':(glob)**/docs/**'

      - name: Validate Task Dependencies
        if: ${{ success() || failure() }}
        run: |
          turbo run //#doc:task-dependencies
          git add --intent-to-add -- ':(glob)**/docs/task-dependencies.json'
          if ! git --no-pager diff --exit-code --color -- ':(glob)**/docs/task-dependencies.json'; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'The diff above is the task-graph change this branch has not committed yet.'
            echo 'Run "turbo run //#doc:task-dependencies" locally and commit the result.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run yarn lint:constraints
        if: ${{ success() || failure() }}
        run: |
          if ! yarn lint:constraints; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running "yarn fix:constraints" locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run yarn lint:license-in-workspaces
        if: ${{ success() || failure() }}
        env:
          FORCE_COLOR: "1" ## https://www.npmjs.com/package/chalk#supportsColor
        run: |
          if ! yarn lint:license-in-workspaces; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'If you do not see them, try merging target branch into yours.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run yarn lint:markdownlint
        if: ${{ success() || failure() }}
        run: |
          if ! yarn lint:markdownlint; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running "yarn fix:markdownlint" locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run yarn lint:format
        if: ${{ success() || failure() }}
        run: |
          if ! yarn lint:format; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running "yarn fix:format" locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Validate Agent Skills
        if: ${{ success() || failure() }}
        run: |
          yarn lint:skill

      - name: Run yarn lint:tombi
        if: ${{ success() || failure() }}
        run: |
          if ! yarn lint:tombi; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running "yarn fix:tombi" locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run yarn lint:yarn-deduplicate
        if: ${{ success() || failure() }}
        run: |
          if ! yarn lint:yarn-deduplicate; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Some dependencies can be deduplicated, which will make node_modules'
            echo 'lighter and potentially save us from unexplainable bugs.'
            echo 'Please run "yarn fix:yarn-deduplicate" locally and commit yarn.lock.'
            echo 'You may need to run the command 2-3 times in some rare cases.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

        ## yarn --frozen-lockfile does not work for monorepos, so using a workaround:
        ## https://github.com/yarnpkg/yarn/issues/5840#issuecomment-467516207
        ## TODO: Use `yarn install --immutable` after upgrading to Yarn v3+
      - name: Check yarn.lock stability
        if: ${{ success() || failure() }}
        run: |
          git diff yarn.lock
          if ! git diff --exit-code yarn.lock; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Changes were detected in yarn.lock file after running "yarn install".'
            echo 'This makes runtime less stable, so should be avoided.'
            echo 'Please run "yarn install" locally and commit yarn.lock.'
            echo 'You may also want to run "yarn fix:yarn-deduplicate" just in case.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1;
          fi

      - name: Check Cargo.lock stability
        if: ${{ success() || failure() }}
        run: |
          if ! cargo update --workspace --locked; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Changes were detected in Cargo.lock file after running "cargo update --workspace".'
            echo 'This makes runtime less stable, so should be avoided.'
            echo 'Please run "cargo update --workspace" locally and commit Cargo.lock.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1;
          fi

      - name: Run SQL formatter and linter
        if: ${{ success() || failure() }}
        run: |
          if ! sqlfluff lint --warn-unused-ignores; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running "sqlfluff fix" locally to apply autofixes.'
            echo 'Note, that SQLFluff does not come with "yarn install" and you may need to install it yourself.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Create SQLFluff annotations
        if: ${{ failure() && github.event.pull_request.head.repo.full_name == github.repository }}
        run: sqlfluff lint --warn-unused-ignores --format github-annotation --write-output annotations.json --annotation-level failure --nofail

      - name: Annotate
        uses: yuzutech/annotations-action@v0.5.0
        if: ${{ failure() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          title: "SQLFluff Lint"
          input: "annotations.json"

  passed:
    name: Linting passed
    environment:
      name: Slack
      deployment: false
    needs: [setup, sccache-credentials, package, global]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check setup script
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
        run: |
          [[ "$SETUP_RESULT" = success ]]
      - name: Check sccache credentials
        env:
          SCCACHE_CREDENTIALS_RESULT: ${{ needs.sccache-credentials.result }}
        run: |
          [[ "$SCCACHE_CREDENTIALS_RESULT" = success ]]
      - name: Check package results
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          [[ "$PACKAGE_RESULT" =~ success|skipped ]]
      - name: Check global results
        env:
          GLOBAL_RESULT: ${{ needs.global.result }}
        run: |
          [[ "$GLOBAL_RESULT" =~ success|skipped ]]

      - name: Notify Slack on failure
        uses: rtCamp/action-slack-notify@v2.4.0
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: "At least one linting job failed for a Pull Request in the Merge Queue failed <!subteam^S09KH99698T>" # Notifies @devops
          SLACK_TITLE: Linting failed
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: GitHub
          VAULT_ADDR: ""
          VAULT_TOKEN: ""
