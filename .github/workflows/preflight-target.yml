name: Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/preflight-target.yml"
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  dependencies:
    name: Dependencies
    permissions:
      contents: read
      pull-requests: write
    uses: hashintel/actions/.github/workflows/preflight-dependencies.yml@12218f636ffc50085953865e21b360b3ac580f9d # main

  labeler:
    name: Labeler
    if: github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Apply labels
        uses: actions/labeler@v6.0.1
        with:
          sync-labels: true

  pr-title:
    name: PR title
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-pr-title.yml@12218f636ffc50085953865e21b360b3ac580f9d # main
