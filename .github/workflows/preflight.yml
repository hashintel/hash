name: Preflight

on:
  pull_request:
    # `edited` matters: the todo-comments scan derives its ticket IDs from the PR title.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  todo-comments:
    name: Todo comments
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-todo-comments.yml@8ff7be6f2bd6cd402e416a3b462428b156b41498 # main

  lint:
    name: Lint
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-lint.yml@8ff7be6f2bd6cd402e416a3b462428b156b41498 # main
