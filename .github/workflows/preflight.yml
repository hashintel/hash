name: Preflight

on:
  pull_request:
    # `edited` matters: the todo-comments scan derives its ticket IDs from the PR title.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  todo-comments:
    name: Todo comments
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-todo-comments.yml@9fc63f47619ed1486820b29c62a78a3396a7e46f # main

  lint:
    name: Lint
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-lint.yml@9fc63f47619ed1486820b29c62a78a3396a7e46f # main
