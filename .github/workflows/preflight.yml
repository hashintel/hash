name: Preflight

on:
  pull_request:
    # `edited` matters: the todo-comments scan derives its ticket IDs from the PR title.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  todo-comments:
    name: Todo comments
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-todo-comments.yml@64725589943d84fea5ba36a7740e254236a922dc # main

  lint:
    name: Lint
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-actionlint.yml@64725589943d84fea5ba36a7740e254236a922dc # main
