name: Preflight

on:
  pull_request:
    # `edited` matters: the todo-comments scan derives its ticket IDs from the PR title.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  todo-comments:
    name: Todo comments
    permissions:
      contents: read
    uses: hashintel/.github/.github/workflows/preflight-todo-comments.yml@db03b98f807376bafb54963f61090600b85125b9 # main

  lint:
    name: Lint
    permissions:
      contents: read
    uses: hashintel/.github/.github/workflows/preflight-actionlint.yml@db03b98f807376bafb54963f61090600b85125b9 # main
