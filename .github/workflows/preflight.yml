name: Preflight

on:
  pull_request:
    # `edited` matters: the todo-comments scan derives its ticket IDs from the PR title.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  todo-comments:
    name: Todo comments
    permissions:
      contents: read
    uses: hashintel/.github/.github/workflows/preflight-todo-comments.yml@1e18f616b651e2f433895f7ee9791bc22f93942d # main

  lint:
    name: Lint
    permissions:
      contents: read
    uses: hashintel/.github/.github/workflows/preflight-actionlint.yml@1e18f616b651e2f433895f7ee9791bc22f93942d # main
