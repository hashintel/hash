name: Preflight

on:
  pull_request:
    # `edited` matters: the todo-comments scan derives its ticket IDs from the PR title.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  todo-comments:
    name: Todo comments
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-todo-comments.yml@06238755f2364521d75a1eaf0b3b397261f46077 # main

  lint:
    name: Lint
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-lint.yml@06238755f2364521d75a1eaf0b3b397261f46077 # main
