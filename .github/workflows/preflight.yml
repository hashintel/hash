name: Preflight

on:
  pull_request:
    # `edited` matters: the todo-comments scan derives its ticket IDs from the PR title.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  todo-comments:
    name: Todo comments
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-todo-comments.yml@66c812140c0f8f4a215c5f54dce5b40b476337d8 # main

  lint:
    name: Lint
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-actionlint.yml@66c812140c0f8f4a215c5f54dce5b40b476337d8 # main
