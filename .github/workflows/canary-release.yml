name: Canary Release
on: workflow_dispatch

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sccache-credentials:
    name: Sccache credentials
    environment:
      name: Sccache
      deployment: false
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Vault JWT login that fetches the sccache credentials
    outputs:
      encrypted-credentials: ${{ steps.mint.outputs.encrypted_credentials }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Mint sccache credentials
        id: mint
        uses: $/.github/actions/mint-sccache-credentials
        with:
          vault_address: ${{ vars.VAULT_ADDR }}
          cf_access_client_id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          cf_access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

  release:
    name: Release
    environment:
      name: Sccache
      deployment: false
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    needs: [sccache-credentials]
    permissions:
      contents: write # push of the canary version commit and its revert
      pull-requests: read # the changelog formatter in `@local/repo-chores`
      id-token: write # npm trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      # `changeset publish` publishes with `yarn npm publish`, which performs the OIDC
      # trusted-publishing exchange itself. Yarn generates provenance only when asked to,
      # and publishes to `registry.yarnpkg.com` unless told otherwise.
      - name: Publish changesets to npm, with 'canary' tags
        # `changeset version` rewrites the manifests, so the install has to update the lockfile.
        # jactionlint ignore=unlocked-install
        run: |
          yarn changeset version --snapshot canary

          git config user.email "support@hash.ai"
          git config user.name "hashdotai"
          git commit -am "temporarily convert changesets to canary releases"
          git revert "$(git rev-parse HEAD)" --no-edit
          git push
          git checkout "$(git rev-parse HEAD~1)"

          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn
          yarn changeset publish --tag canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_PUBLISH_PROVENANCE: "true"
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
          TURBO_UI: "false"
          TURBO_LOG_ORDER: stream
          TURBO_LOG_VERBOSITY: 1
          TURBO_TELEMETRY_DISABLED: 1
