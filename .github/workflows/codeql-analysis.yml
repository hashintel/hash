name: "CodeQL"

on:
  push:
    branches:
      - main
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: "42 10 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: read # CodeQL reads the workflow run and lists its caches through the Actions API
      contents: read
      security-events: write # uploads the CodeQL results to code scanning

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "rust"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.32.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.32.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.32.2
