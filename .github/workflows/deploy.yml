name: Deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  merge_group:

env:
  TURBO_TEAM: hashintel
  TURBO_CACHE: remote:rw

  AWS_REGION: eu-central-1
  AWS_ECR_ACCOUNT_ID: "469596578827"
  OIDC_HASH_CD_PUSH_ROLE: github-oidc-hash-cd-push

# PR and merge_group runs cancel their previous attempt (cancel-in-progress):
# a new commit or queue reshuffle obsoletes the in-flight build-only validation.
#
# Push and workflow_dispatch get a UNIQUE per-run group (github.run_id) so they
# are NEVER cancelled or evicted at the run level. This is critical: the build
# matrix is computed per-commit (turbo affected vs HEAD^), so if a publishing
# run were dropped, the services that *only* that commit changed would never
# publish. The builds themselves run unserialized — their pushes are immutable
# (GHCR by digest, ECR :sha/:run). Only the mutable :latest tag serializes per
# service via `queue: max` in `manifest`, where the tag-if-newer guard keeps it
# moving only forward. The workflow that `promote` dispatches serializes the
# staging rollouts itself.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  # Only pull request and merge-group runs cancel, and their `sourcemaps` job runs in `Sentry (staging)`, not `Sentry`.
  # jactionlint ignore=concurrency-cancels-release
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Only the top of a stack runs this workflow: it contains every layer below
  # it. The two root jobs carry the condition; every other job needs them.
  setup:
    name: Setup
    if: >-
      ${{ github.event.pull_request.stack == null
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sourcemaps: ${{ steps.packages.outputs.sourcemaps }}
      backend-images: ${{ steps.packages.outputs.backend-images }}
      backend-manifests: ${{ steps.packages.outputs.backend-manifests }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rust: false

      - name: Determine changed packages
        id: packages
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          SKIP_AMD64: ${{ github.event_name == 'pull_request' }}
        run: .github/scripts/deploy-matrices.sh

  sccache-credentials:
    name: Sccache credentials
    environment:
      name: Sccache
      deployment: false
    if: >-
      ${{ github.event.pull_request.stack == null
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Vault JWT login that fetches the sccache credentials
    outputs:
      encrypted-credentials: ${{ steps.mint.outputs.encrypted_credentials }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2

      - name: Mint sccache credentials
        id: mint
        uses: $/.github/actions/mint-sccache-credentials
        with:
          vault_address: ${{ vars.VAULT_ADDR }}
          cf_access_client_id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          cf_access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

  sourcemaps:
    name: Sourcemaps
    needs: [setup, sccache-credentials]
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.sourcemaps) }}
      fail-fast: false
    # Fork-only check applies to PRs — the Vault role for SENTRY_AUTH_TOKEN
    # isn't reachable from forks.
    if: ${{ needs.setup.outputs.sourcemaps != '{"name":[],"include":[]}' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The environment lands in the OIDC token as a claim the Vault role binds,
    # and `Sentry` only accepts the main branch. Picking the tier here is
    # therefore not self-asserted.
    #
    # Keyed on the ref rather than the event, so a workflow_dispatch on main —
    # which this workflow treats as a publishing run elsewhere — gets the same
    # tier as a push, and a dispatch on any other branch does not.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'Sentry' || 'Sentry (staging)' }}
      deployment: false
    permissions:
      id-token: write # vault-action signs in to Vault with the OIDC token
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Show selection reason
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: echo "$MATRIX"

      - name: Authenticate Vault
        id: secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          # Each environment holds the address and Cloudflare Access pair of its
          # own tier's Vault, and the role binds the environment claim, so
          # credentials for one instance never authenticate against the other.
          # Each instance holds only its own tier's token, so the role name and
          # the path carry no tier — the instance is the tier.
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: ci-hashintel-hash-sentry
          extraHeaders: |
            CF-Access-Client-Id: ${{ vars.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          secrets: |
            ci/data/sentry/sourcemaps auth_token | SENTRY_AUTH_TOKEN

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

      - name: Prune repository
        uses: $/.github/actions/prune-repository
        with:
          scope: ${{ matrix.name }}

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      - name: Log in to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ steps.secrets.outputs.SENTRY_AUTH_TOKEN }}
        run: sentry-cli login --auth-token "$SENTRY_AUTH_TOKEN"

      - name: Build sourcemaps
        env:
          SOURCEMAPS_PACKAGE: ${{ matrix.name }}
        run: turbo run sentry:sourcemaps --env-mode=loose --filter "$SOURCEMAPS_PACKAGE"

  build:
    name: Build${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && ' and push' || '' }} ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 120
    needs: [setup]
    if: ${{ fromJSON(needs.setup.outputs.backend-images).include[0] != null }}
    # No concurrency: builds and their immutable pushes (GHCR by digest, ECR
    # :sha/:run) are idempotent, so parallel runs don't race — they run free.
    # Only the mutable :latest tag needs serialization, in the `manifest` job.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.backend-images) }}
    # The ECR push role trusts the OIDC subject of the main branch, which an
    # `environment:` on this job would replace.
    permissions:
      id-token: write # configure-aws-credentials assumes the ECR push role with the OIDC token
      contents: read
      packages: write # docker-build-push pushes the image and the build cache to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Tag-list assembly. The dynamic matrix already filtered the (service,
      # arch) entries to what should build, so this step only decides whether
      # to push and which tags to apply.
      - name: Compute targets
        id: targets
        shell: bash
        env:
          PUSH_LIST: ${{ join(matrix.push, ' ') }}
          ARCH: ${{ matrix.arch }}
          ECR_ARCH: ${{ matrix.ecr_arch }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          GHCR_OWNER: ${{ github.repository_owner }}
          ECR_ACCOUNT: ${{ env.AWS_ECR_ACCOUNT_ID }}
          ECR_REGION: ${{ env.AWS_REGION }}
          ECR_REPO: ${{ github.repository }}
        run: |
          is_push_event=false
          case "$EVENT" in push|workflow_dispatch) is_push_event=true ;; esac
          is_main=false
          [[ "$REF" == refs/heads/main ]] && is_main=true

          push_ecr=false
          if [[ " $PUSH_LIST " == *" ecr "* && "$ARCH" == "$ECR_ARCH" && "$is_main" == true && "$is_push_event" == true ]]; then
            push_ecr=true
          fi
          push_ghcr=false
          if [[ " $PUSH_LIST " == *" ghcr "* && "$is_push_event" == true ]]; then
            push_ghcr=true
          fi

          push=false
          if $push_ecr || $push_ghcr; then
            push=true
          fi

          ecr_host="$ECR_ACCOUNT.dkr.ecr.$ECR_REGION.amazonaws.com"

          {
            echo "push_ecr=$push_ecr"
            echo "push_ghcr=$push_ghcr"
            echo "push=$push"

            # ECR is single-arch (the entry's ecr_arch), tag-based. Only
            # immutable tags here (:sha / :run); the staging promotion finds
            # this run's images by them and moves the mutable :staging tag.
            echo "ecr_tags<<EOF"
            if $push_ecr; then
              echo "$ecr_host/$ECR_REPO/$SERVICE:sha-$SHA"
              echo "$ecr_host/$ECR_REPO/$SERVICE:run-$RUN_ID"
            fi
            echo EOF

            # GHCR is pushed by digest (no per-arch tags); the manifest job
            # assembles :sha-<sha> and advances :latest from the collected digests.
            if $push_ghcr; then
              echo "ghcr_image=ghcr.io/$GHCR_OWNER/hash/$SERVICE"
            else
              echo "ghcr_image="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (ECR push)
        if: ${{ steps.targets.outputs.push_ecr == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ECR_ACCOUNT_ID }}:role/${{ env.OIDC_HASH_CD_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build${{ steps.targets.outputs.push == 'true' && ' and push' || '' }} ${{ matrix.service }} (${{ matrix.arch }})
        id: build
        uses: $/.github/actions/docker-build-push
        with:
          CONTEXT_PATH: ${{ github.workspace }}/${{ matrix.context }}
          DOCKERFILE_LOCATION: ${{ github.workspace }}/${{ matrix.dockerfile }}
          PLATFORM: linux/${{ matrix.arch }}
          CACHE_REF: ghcr.io/${{ github.repository_owner }}/hash/${{ matrix.service }}/cache:${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
          PUSH: ${{ steps.targets.outputs.push }}
          BUILD_ARGS: ${{ matrix.build_args }}
          ECR_TAGS: ${{ steps.targets.outputs.ecr_tags }}
          GHCR_IMAGE: ${{ steps.targets.outputs.ghcr_image }}

      # GHCR was pushed by digest; stash the digest so the manifest job can
      # assemble the multi-arch tags from the exact images this run built.
      - name: Export GHCR digest
        if: ${{ steps.targets.outputs.push_ghcr == 'true' }}
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.ghcr-digest }}
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/${SERVICE}-${ARCH}"

      - name: Upload GHCR digest
        if: ${{ steps.targets.outputs.push_ghcr == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch manifest (${{ matrix.service }})
    runs-on: ubuntu-26.04
    # Leaves room for a retry after a hung attempt of one of the retried steps.
    timeout-minutes: 10
    needs: [setup, build]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON(needs.setup.outputs.backend-manifests).service[0] != null }}
    # Serialize the `:latest` multi-arch manifest per service so a newer push's
    # manifest never interleaves with an older one. `queue: max` => no drops.
    concurrency:
      group: ${{ github.workflow }}-manifest-${{ matrix.service }}
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.backend-manifests) }}
    permissions:
      contents: read
      packages: write # the manifest and the `latest` tag are pushed to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          # tag-if-newer (the :latest guard) needs full history.
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Download per-arch digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true

      # Assemble the immutable :sha-<sha> multi-arch manifest from the exact
      # per-arch digests this run pushed — no tag readback, so no Frankenstein
      # manifest even if a parallel run is mid-push.
      - name: Assemble :sha-<sha> manifest
        uses: nick-fields/retry@v3.0.2
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/hash/${{ matrix.service }}
          SHA: ${{ github.sha }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            cd "$RUNNER_TEMP/digests"
            refs="$(cat ./* 2>/dev/null | sed "s|^|$IMAGE@|")"
            [ -n "$refs" ] || { echo "::error ::no digests collected for $IMAGE"; exit 1; }
            docker buildx imagetools create --tag "$IMAGE:sha-$SHA" $refs

      # :latest is mutable -> advance onto :sha-<sha> only if this commit is newer
      # than the one :latest currently points at. main-only: a feature-branch
      # dispatch would otherwise move :latest onto a commit no later main push
      # descends from, permanently blocking the guard from ever advancing it again.
      - name: Advance :latest if newer
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: $/.github/actions/tag-if-newer
        with:
          image: ghcr.io/${{ github.repository_owner }}/hash/${{ matrix.service }}
          mutable-tag: latest
          source-tag: sha-${{ github.sha }}
          candidate-sha: ${{ github.sha }}

  # Staging is rolled out by the promote workflow of the infrastructure
  # repository: it takes `main` as of this commit from the :run tags pushed
  # above, moves :staging and redeploys the services. This job only starts that
  # run, which reports its own outcome.
  promote:
    name: Promote to staging
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [setup, build]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && fromJSON(needs.setup.outputs.backend-images).include[0] != null }}
    # The Vault role binds this environment, which accepts only the main branch.
    environment:
      name: Deploy
      deployment: false
    permissions:
      id-token: write # dispatch-promotion signs in to Vault with the OIDC token
    steps:
      - name: Dispatch the staging promotion
        uses: hashintel/actions/.github/actions/dispatch-promotion@main
        with:
          project: hash
          target-environment: staging
          vault-address: ${{ vars.VAULT_ADDR }}
          vault-role: ci-hashintel-hash-deploy
          app-id: "5695957"
          transit-key: github-app-hash-deploy
          cf-access-client-id: ${{ vars.CF_ACCESS_CLIENT_ID }}
          cf-access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  # Single gate suitable as a Required status check in branch protection. The
  # underlying matrix jobs change as services are added/removed; this job's
  # name is stable. It is also the one place failures are announced to Slack:
  # the Check steps cover every pipeline job, so a step-level `failure()`
  # fires whenever any of setup/sourcemaps/build/manifest/promote fails —
  # including the case where `build` fails and `promote` is skipped (which a
  # `needs: promote` notifier would miss, since a skipped job is not a failure).
  passed:
    name: Deployments passed
    environment:
      name: Slack
      deployment: false
    needs: [setup, sccache-credentials, sourcemaps, build, manifest, promote]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check setup
        env:
          JOB_RESULT: ${{ needs.setup.result }}
        run: |
          [[ "$JOB_RESULT" =~ success|skipped ]]
      - name: Check sccache credentials
        env:
          JOB_RESULT: ${{ needs.sccache-credentials.result }}
        run: |
          [[ "$JOB_RESULT" =~ success|skipped ]]
      - name: Check sourcemaps
        env:
          JOB_RESULT: ${{ needs.sourcemaps.result }}
        run: |
          [[ "$JOB_RESULT" =~ success|skipped ]]
      - name: Check build
        env:
          JOB_RESULT: ${{ needs.build.result }}
        run: |
          [[ "$JOB_RESULT" =~ success|skipped ]]
      - name: Check manifest
        env:
          JOB_RESULT: ${{ needs.manifest.result }}
        run: |
          [[ "$JOB_RESULT" =~ success|skipped ]]
      - name: Check promote
        env:
          JOB_RESULT: ${{ needs.promote.result }}
        run: |
          [[ "$JOB_RESULT" =~ success|skipped ]]

      - name: Notify Slack on main failure
        uses: rtCamp/action-slack-notify@v2.4.0
        if: ${{ failure() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: "A job in the HASH backend Deploy workflow failed on `main` <!subteam^S09KH99698T>" # Notifies @infra
          SLACK_TITLE: Backend deployment failed
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: GitHub
          VAULT_ADDR: ""
          VAULT_TOKEN: ""

      - name: Notify Slack on merge-queue failure
        uses: rtCamp/action-slack-notify@v2.4.0
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: "At least one deployment job for a Pull Request in the Merge Queue failed <!subteam^S09KH99698T>" # Notifies @devops
          SLACK_TITLE: Deployment failed
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: GitHub
          VAULT_ADDR: ""
          VAULT_TOKEN: ""
