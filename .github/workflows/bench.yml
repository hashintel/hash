name: Bench

on:
  pull_request:
  push:
    branches:
      - main

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: hashintel
  TURBO_CACHE: remote:rw
  # The legacy Vault, still holding `aws/creds/dev-deploy`. Inline rather than a
  # variable because it goes away once those credentials move; `vars.VAULT_ADDR`
  # is the per-environment one and would resolve to the wrong instance here.
  VAULT_ADDR: https://vault.blockprotocol.org

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Only the top of a stack runs this workflow: it contains every layer below
  # it. The two root jobs carry the condition; every other job needs them.
  setup:
    if: >-
      github.event.pull_request.stack == null
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      unit: ${{ steps.packages.outputs.unit }}
      integration: ${{ steps.packages.outputs.integration }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rust: false

      - name: Determine changed packages
        id: packages
        run: |
          UNIT_BENCH_PACKAGES=$(.github/scripts/affected-packages.sh bench:unit)
          INTEGRATION_BENCH_PACKAGES=$(.github/scripts/affected-packages.sh bench:integration)

          # Only a Rust crate's benches write the Criterion results that the
          # analysis and upload steps read. The base run exists to give Criterion
          # a baseline, so any other package runs its head benches alone.
          CRATES=$(jq --raw-output '.include[].path' <<< "$UNIT_BENCH_PACKAGES" \
            | while read -r path; do if [[ -f "$path/Cargo.toml" ]]; then echo "$path"; fi; done \
            | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          UNIT_BENCH_PACKAGES=$(jq --compact-output --argjson crates "$CRATES" \
            '.include |= map(. + { criterion: (.path | IN($crates[])) })' <<< "$UNIT_BENCH_PACKAGES")

          echo "unit=$UNIT_BENCH_PACKAGES" | tee -a "$GITHUB_OUTPUT"
          echo "integration=$INTEGRATION_BENCH_PACKAGES" | tee -a "$GITHUB_OUTPUT"

  sccache-credentials:
    if: >-
      github.event.pull_request.stack == null
      || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      encrypted-credentials: ${{ steps.mint.outputs.encrypted_credentials }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2

      - name: Mint sccache credentials
        id: mint
        uses: $/.github/actions/mint-sccache-credentials
        with:
          vault_address: ${{ vars.VAULT_STAGE_ADDR }}
          cf_access_client_id: ${{ vars.CF_ACCESS_STAGE_CLIENT_ID }}
          cf_access_client_secret: ${{ secrets.CF_ACCESS_STAGE_CLIENT_SECRET }}
          encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}

  unit-benches:
    name: Unit
    needs: [setup, sccache-credentials]
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.unit) }}
      fail-fast: false
    if: needs.setup.outputs.unit != '{"name":[],"include":[]}'
    runs-on: ubuntu-24.04
    steps:
      - name: Show selection reason
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: echo "$MATRIX"

      - name: Checkout base branch
        if: github.event_name == 'pull_request' && matrix.criterion
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Clean up disk
        if: github.event_name == 'pull_request' && matrix.criterion
        uses: $/.github/actions/clean-up-disk

      - name: Install tools
        if: github.event_name == 'pull_request' && matrix.criterion
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}
          aws_lc_profile: release

      - name: Prune repository
        if: github.event_name == 'pull_request' && matrix.criterion
        uses: $/.github/actions/prune-repository
        with:
          scope: |
            ${{ matrix.name }}
            hash-repo-chores

      - name: Warm up repository
        if: github.event_name == 'pull_request' && matrix.criterion
        uses: $/.github/actions/warm-up-repo

      - name: Run base benches
        if: github.event_name == 'pull_request' && matrix.criterion
        run: turbo run bench:unit --filter "${{ matrix.name }}"

      - name: Checkout head branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6.0.2
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6.0.2

      - name: Clean up disk
        if: github.event_name != 'pull_request'
        uses: $/.github/actions/clean-up-disk

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}
          aws_lc_profile: release

      - name: Prune repository
        uses: $/.github/actions/prune-repository
        with:
          scope: |
            ${{ matrix.name }}
            hash-repo-chores

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      - name: Run head benches
        run: turbo run bench:unit --filter "${{ matrix.name }}"

      - name: Analyze benchmarks
        if: github.event_name == 'pull_request' && matrix.criterion
        run: |
          TRIMMED_PACKAGE_NAME=$(echo "${{ matrix.name }}" | sed 's|@||g' | sed 's|/|.|g')
          echo "TRIMMED_PACKAGE_NAME=$TRIMMED_PACKAGE_NAME" >> "$GITHUB_ENV"
          echo '<details><summary><h2>${{ matrix.name }} – Units</h2></summary>' > "/tmp/$TRIMMED_PACKAGE_NAME.md"
          echo >> "/tmp/$TRIMMED_PACKAGE_NAME.md"
          turbo run analyze-benchmarks -- --output "/tmp/benches.md" --artifacts-path "$(pwd)/${{ matrix.path }}/out" --enforce-flame-graph
          cat "/tmp/benches.md" >> "/tmp/$TRIMMED_PACKAGE_NAME.md"
          echo '</details>' >> "/tmp/$TRIMMED_PACKAGE_NAME.md"

      - name: Authenticate Vault
        id: secrets
        if: github.event.pull_request.head.repo.full_name == github.repository && matrix.criterion
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: dev
          secrets: |
            aws/creds/dev-deploy access_key | AWS_ACCESS_KEY_ID;
            aws/creds/dev-deploy secret_key | AWS_SECRET_ACCESS_KEY;
            aws/creds/dev-deploy security_token | AWS_SESSION_TOKEN;

      - name: Upload benchmark results
        if: github.event.pull_request.head.repo.full_name == github.repository && matrix.criterion
        run: turbo run upload-benchmarks --env-mode=loose -- --artifacts-path "$(pwd)/${{ matrix.path }}/out" --enforce-flame-graph

      - name: Upload benchmark summary
        if: github.event_name == 'pull_request' && matrix.criterion
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.TRIMMED_PACKAGE_NAME }}_${{ github.job }}
          path: /tmp/${{ env.TRIMMED_PACKAGE_NAME }}.md

  integration-benches:
    name: Integration
    needs: [setup, sccache-credentials]
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.integration) }}
      fail-fast: false
    if: needs.setup.outputs.integration != '{"name":[],"include":[]}'
    runs-on: ubuntu-24.04
    steps:
      - name: Show selection reason
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: echo "$MATRIX"

      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Clean up disk
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/clean-up-disk

      - name: Install tools
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          encrypted_sccache_credentials: ${{ needs.sccache-credentials.outputs.encrypted-credentials }}
          sccache_encryption_key: ${{ secrets.SCCACHE_ENC_KEY }}
          aws_lc_profile: release

      - name: Prune repository
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/prune-repository
        with:
          scope: |
            ${{ matrix.name }}
            hash-repo-chores

      - name: Warm up repository
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/warm-up-repo

      - name: Create temp files and folders
        run: mkdir -p var/logs

      - name: Launch external services
        if: github.event_name == 'pull_request'
        # Retried because BuildKit occasionally fails with transient rpc errors on
        # individual runners (e.g. "failed to receive status: rpc error: code =
        # Unavailable desc = error reading from server: EOF"), failing the job
        # before any test runs. See https://linear.app/hash/issue/SRE-803
        uses: nick-fields/retry@v3.0.2
        with:
          max_attempts: 3
          timeout_minutes: 15
          retry_wait_seconds: 15
          shell: bash
          command: cd infra/compose && docker compose --profile dev up -d

      - name: Start background tasks
        if: github.event_name == 'pull_request'
        id: base-background-tasks
        env:
          # Set terminal logging to WARN level and enable verbose file logging for CI
          HASH_GRAPH_LOG_CONSOLE_LEVEL: warn
          HASH_GRAPH_LOG_FILE_ENABLED: true
          HASH_GRAPH_LOG_FILE_LEVEL: info
          HASH_GRAPH_LOG_FOLDER: ${{ github.workspace }}/var/logs
        run: |
          # Optimistically compile background tasks.
          turbo run compile:release --env-mode=loose
          mkdir -p logs
          turbo run start --filter hash-graph --env-mode=loose --log-order stream >var/logs/base-background-task.log 2>&1 &
          PID=$!
          echo "pid=$PID" | tee -a "$GITHUB_OUTPUT"

          turbo run start:healthcheck --filter hash-graph --env-mode=loose

      - name: Run base benches
        if: github.event_name == 'pull_request'
        run: turbo run bench:integration --filter "${{ matrix.name }}"

      - name: Show background tasks logs
        if: always() && github.event_name == 'pull_request'
        run: |
          kill -15 ${{ steps.base-background-tasks.outputs.pid }} || true
          # `kill` only signals the `turbo` wrapper; the spawned Graph server
          # survives it and keeps its ports (REST API and type fetcher) bound,
          # so the head-branch server would fail to bind while the healthcheck
          # is still answered by the stale base server and the head benches
          # silently talk to the base binary. Terminate the server itself and
          # wait for it to exit before the head run starts.
          pkill -TERM -x hash-graph || true
          for _ in $(seq 1 30); do
            pgrep -x hash-graph >/dev/null || break
            sleep 1
          done
          pkill -KILL -x hash-graph || true
          cat var/logs/base-background-task.log

      - name: Tear down external services
        if: github.event_name == 'pull_request'
        working-directory: infra/compose
        run: docker compose --profile dev down

      - name: Checkout head branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6.0.2
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6.0.2

      - name: Clean up disk
        if: github.event_name != 'pull_request'
        uses: $/.github/actions/clean-up-disk

      - name: Install tools
        uses: $/.github/actions/install-tools
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sccache: false # sccache is already running in the background
          aws_lc_profile: release

      - name: Prune repository
        uses: $/.github/actions/prune-repository
        with:
          scope: |
            ${{ matrix.name }}
            hash-repo-chores

      - name: Warm up repository
        uses: $/.github/actions/warm-up-repo

      - name: Create temp files and folders
        run: mkdir -p var/logs

      - name: Launch external services
        # Retried because BuildKit occasionally fails with transient rpc errors on
        # individual runners (e.g. "failed to receive status: rpc error: code =
        # Unavailable desc = error reading from server: EOF"), failing the job
        # before any test runs. See https://linear.app/hash/issue/SRE-803
        uses: nick-fields/retry@v3.0.2
        with:
          max_attempts: 3
          timeout_minutes: 15
          retry_wait_seconds: 15
          shell: bash
          command: cd infra/compose && docker compose --profile dev up -d

      - name: Start background tasks
        id: head-background-tasks
        env:
          # Set terminal logging to WARN level and enable verbose file logging for CI
          HASH_GRAPH_LOG_CONSOLE_LEVEL: warn
          HASH_GRAPH_LOG_FILE_ENABLED: true
          HASH_GRAPH_LOG_FILE_LEVEL: info
          HASH_GRAPH_LOG_FOLDER: ${{ github.workspace }}/var/logs
        run: |
          # Optimistically compile background tasks.
          turbo run compile:release --env-mode=loose
          mkdir -p logs
          turbo run start --filter hash-graph --env-mode=loose --log-order stream >var/logs/head-background-task.log 2>&1 &
          PID=$!
          echo "pid=$PID" | tee -a "$GITHUB_OUTPUT"

          turbo run start:healthcheck --filter hash-graph --env-mode=loose

      - name: Run head benches
        run: turbo run bench:integration --filter "${{ matrix.name }}"

      - name: Show background tasks logs
        if: always()
        run: |
          kill -15 ${{ steps.head-background-tasks.outputs.pid }} || true
          cat var/logs/head-background-task.log

      - name: Analyze benchmarks
        if: github.event_name == 'pull_request'
        run: |
          TRIMMED_PACKAGE_NAME=$(echo "${{ matrix.name }}" | sed 's|@||g' | sed 's|/|.|g')
          echo "TRIMMED_PACKAGE_NAME=$TRIMMED_PACKAGE_NAME" >> "$GITHUB_ENV"
          echo '<details><summary><h2>${{ matrix.name }} – Integrations</h2></summary>' > "/tmp/$TRIMMED_PACKAGE_NAME.md"
          echo >> "/tmp/$TRIMMED_PACKAGE_NAME.md"
          turbo run analyze-benchmarks -- --output "/tmp/benches.md" --artifacts-path "$(pwd)/${{ matrix.path }}/out" --enforce-flame-graph
          cat "/tmp/benches.md" >> "/tmp/$TRIMMED_PACKAGE_NAME.md"
          echo '</details>' >> "/tmp/$TRIMMED_PACKAGE_NAME.md"

      - name: Authenticate Vault
        id: secrets
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: dev
          secrets: |
            aws/creds/dev-deploy access_key | AWS_ACCESS_KEY_ID;
            aws/creds/dev-deploy secret_key | AWS_SECRET_ACCESS_KEY;
            aws/creds/dev-deploy security_token | AWS_SESSION_TOKEN;

      - name: Upload benchmark results
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: turbo run upload-benchmarks --env-mode=loose -- --artifacts-path "$(pwd)/${{ matrix.path }}/out" --enforce-flame-graph

      - name: Upload benchmark summary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.TRIMMED_PACKAGE_NAME }}_${{ github.job }}
          path: /tmp/${{ env.TRIMMED_PACKAGE_NAME }}.md

      - name: Show container logs
        if: ${{ success() || failure() }}
        working-directory: infra/compose
        run: docker compose --profile dev logs --timestamps

      - name: Upload background tasks logs
        uses: actions/upload-artifact@v4.6.2
        if: success() || failure()
        with:
          name: ${{ env.TRIMMED_PACKAGE_NAME }}_logs
          path: |
            var/logs

  passed:
    name: Benches passed
    needs: [setup, sccache-credentials, unit-benches, integration-benches]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check setup script
        run: |
          [[ ${{ needs.setup.result }} =~ success|skipped ]]
      - name: Check sccache credentials
        run: |
          [[ ${{ needs.sccache-credentials.result }} =~ success|skipped ]]
      - name: Check unit benches
        run: |
          [[ ${{ needs.unit-benches.result }} =~ success|skipped ]]
      - name: Check integration benches
        run: |
          [[ ${{ needs.integration-benches.result }} =~ success|skipped ]]

      - name: Notify Slack on failure
        uses: rtCamp/action-slack-notify@v2.4.0
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          SLACK_LINK_NAMES: true
          SLACK_MESSAGE: "At least one bench job for a Pull Request in the Merge Queue failed <!subteam^S09KH99698T>" # Notifies @devops
          SLACK_TITLE: Tests failed
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: GitHub
          VAULT_ADDR: ""
          VAULT_TOKEN: ""

      - name: Checkout
        if: github.event_name == 'pull_request' && needs.integration-benches.result == 'success'
        uses: actions/checkout@v6.0.2

      - name: Download reports' artifacts
        if: github.event_name == 'pull_request' && needs.integration-benches.result == 'success'
        uses: actions/download-artifact@v5.0.0
        with:
          path: downloads

      - name: Create comment
        if: github.event_name == 'pull_request' && needs.integration-benches.result == 'success'
        run: |
          echo "## Benchmark results" > /tmp/summary.md
          cat downloads/*/*.md >> /tmp/summary.md
          cat /tmp/summary.md

      - name: Post comment
        uses: mshick/add-pr-comment@v2.8.2
        if: github.event_name == 'pull_request' && needs.integration-benches.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          message-path: /tmp/summary.md
          message-id: benchmark-results
          refresh-message-position: true
