name: Install sccache
description: Setup sccache for Rust project caching
inputs:
  encrypted_credentials:
    description: Encrypted credential bundle from mint-sccache-credentials.
    required: true
  encryption_key:
    description: The symmetric key decrypting `encrypted_credentials`.
    required: true

runs:
  using: composite
  steps:
    - name: Decrypt credentials
      id: decrypt
      uses: $/.github/actions/decrypt-secret
      with:
        encrypted_value: ${{ inputs.encrypted_credentials }}
        encryption_key: ${{ inputs.encryption_key }}

    - name: Export credentials
      shell: bash
      env:
        CREDENTIALS: ${{ steps.decrypt.outputs.value }}
      run: |
        account_id=$(jq --raw-output --exit-status '.account_id' <<<"${CREDENTIALS}")
        bucket=$(jq --raw-output --exit-status '.bucket' <<<"${CREDENTIALS}")
        access_key_id=$(jq --raw-output --exit-status '.access_key_id' <<<"${CREDENTIALS}")
        secret_access_key=$(jq --raw-output --exit-status '.secret_access_key' <<<"${CREDENTIALS}")
        for value in "${account_id}" "${bucket}" "${access_key_id}" "${secret_access_key}"; do
          echo "::add-mask::${value}"
        done
        {
          echo "SCCACHE_ACCOUNT_ID=${account_id}"
          echo "SCCACHE_BUCKET=${bucket}"
          echo "SCCACHE_AWS_ACCESS_KEY_ID=${access_key_id}"
          echo "SCCACHE_AWS_SECRET_ACCESS_KEY=${secret_access_key}"
        } >>"${GITHUB_ENV}"

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

    - name: Start sccache server
      env:
        SCCACHE_BUCKET: ${{ env.SCCACHE_BUCKET }}
        SCCACHE_ENDPOINT: https://${{ env.SCCACHE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        SCCACHE_REGION: auto
        SCCACHE_LOG: debug
        SCCACHE_ERROR_LOG: /tmp/sccache.log
        SCCACHE_S3_USE_SSL: "true"
        SCCACHE_S3_KEY_PREFIX: "hashintel/hash/"
        SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "false"
        SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: "false"
        SCCACHE_IDLE_TIMEOUT: "0" # the default idle timeout is 600s (10 minutes) which is too short for our benches, `0` disables the timeout
        AWS_ACCESS_KEY_ID: ${{ env.SCCACHE_AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.SCCACHE_AWS_SECRET_ACCESS_KEY }}
        AWS_EC2_METADATA_DISABLED: "true"
      shell: bash
      run: ${{ github.action_path }}/start-sccache.sh

    - name: Inject sccache variables into environment
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=${SCCACHE_PATH}" >> $GITHUB_ENV
        # sccache does not work with incremental builds, we do not need incremental builds in CI anyway,
        # because we only compile the library once. Therefore not compiling at all when there are no changes
        # is beneficial as it will lead to less compilation time and faster builds in CI.
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
