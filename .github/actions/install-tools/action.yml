name: Install Tools
description: Installs Node, Rust, and WASM tools

inputs:
  token:
    description: GitHub token for authentication
    required: true
  encrypted_sccache_credentials:
    description: Encrypted sccache credential bundle from mint-sccache-credentials. Empty on fork pull requests, which is what skips sccache there.
    default: ""
  sccache_encryption_key:
    description: The symmetric key decrypting `encrypted_sccache_credentials`.
    default: ""
  rust:
    description: Should Rust be installed? Can either be `"true"` or `true`
    default: "true"
  sccache:
    description: Should sccache be installed? Can either be `"true"` or `true`
    default: "true"

runs:
  using: composite

  steps:
    # `mise install` builds the Rust toolchain by shelling out to `rustup`, so mise's own
    # `http_retries` does not cover that download. Non-fatal here, retried below.
    - name: Run `mise install` with `ci` environment
      id: mise-install
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      continue-on-error: true
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.7.14
        install_args: --env ci --jobs 1 --locked
      env:
        MISE_VERBOSE: 1
        GITHUB_TOKEN: ${{ inputs.token }}

    # Without `mise` on `PATH` there is no install to retry, only five minutes of `not found`.
    - name: Fail fast if `mise` itself is missing
      if: ${{ steps.mise-install.outcome != 'success' }}
      shell: bash
      run: |
        command -v mise > /dev/null || {
          echo "::error::mise is not on PATH: jdx/mise-action failed during its own setup, so there is no install to retry"
          exit 1
        }

    # Skipped on the happy path; `!= 'success'` so an unresolved `outcome` retries too.
    - name: Retry `mise install` if it failed
      if: ${{ steps.mise-install.outcome != 'success' }}
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 20
        max_attempts: 5
        retry_wait_seconds: 60
        command: mise install --env ci --jobs 1 --locked
      env:
        MISE_VERBOSE: 1
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install package manager via corepack
      uses: $/.github/actions/install-corepack

    - name: Setup environment
      shell: bash
      run: |
        echo MISE_ENV=ci >> $GITHUB_ENV
        echo PROTOC="$(mise which protoc)" >> $GITHUB_ENV
        mise ls

    - name: "Install Rust"
      if: ${{ inputs.rust == true || inputs.rust == 'true' }}
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 20
        max_attempts: 5
        retry_wait_seconds: 60
        command: ${{ github.action_path }}/install-rust.sh

    - name: "Install sccache"
      if: ${{ (inputs.rust == true || inputs.rust == 'true') && (inputs.sccache == true || inputs.sccache == 'true') && inputs.encrypted_sccache_credentials != '' }}
      continue-on-error: true
      uses: $/.github/actions/install-sccache
      with:
        encrypted_credentials: ${{ inputs.encrypted_sccache_credentials }}
        encryption_key: ${{ inputs.sccache_encryption_key }}
