name: Decrypt secret
description: Decrypts a ciphertext produced by encrypt-secret, masking every plaintext line before it is output.
inputs:
  encrypted_value:
    description: The encrypted value, base64-encoded.
    required: true
  encryption_key:
    description: The symmetric key decrypting the value.
    required: true
outputs:
  value:
    description: The decrypted value.
    value: ${{ steps.decrypt.outputs.value }}

runs:
  using: composite
  steps:
    - name: Decrypt value
      id: decrypt
      shell: bash
      env:
        ENCRYPTED_VALUE: ${{ inputs.encrypted_value }}
        ENC_KEY: ${{ inputs.encryption_key }}
      run: |
        : "${ENCRYPTED_VALUE:?}" "${ENC_KEY:?}"
        value=$(printf '%s' "${ENCRYPTED_VALUE}" | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENC_KEY -base64 -A)
        while IFS= read -r line; do
          if [[ -n "${line}" ]]; then
            echo "::add-mask::${line}"
          fi
        done <<<"${value}"
        {
          echo "value<<__VALUE_EOF__"
          printf '%s\n' "${value}"
          echo "__VALUE_EOF__"
        } >>"${GITHUB_OUTPUT}"
