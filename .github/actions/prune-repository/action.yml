name: Prune repository
description: "Prunes the repository to only the files required for the given scope"
inputs:
  scope:
    description: "Scope to prune to"
    required: true

runs:
  using: "composite"
  steps:
    - name: Prune repository
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      run: |
        read -r -a scopes <<< "${SCOPE//$'\n'/ }"
        turbo prune "${scopes[@]}"

    # `turbo prune` copies the workspace directories and the root manifests; paths a package
    # reads from outside any workspace are copied here.
    - name: Copy paths outside the workspaces
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      run: |
        copy() { mkdir -p "out/$(dirname "$1")" && cp -R "$1" "out/$1"; }
        read -r -a scopes <<< "${SCOPE//$'\n'/ }"
        for scope in "${scopes[@]}"; do
          case "$scope" in
            # The app's product tests execute evaluation runners and inspect committed evidence.
            @apps/brunch-agent)
              copy libs/@hashintel/brunch-agent/docs
              copy libs/@hashintel/brunch-agent/evaluations
              ;;
          esac
        done

    - name: Copy required files
      shell: bash
      run: |
        cp -R oxfmt.config.ts infra/ out/

        # Every dot-file except `.git`, merged into what `turbo prune` already wrote there (the
        # pruned `.cargo/config.toml`, the `.claude/hooks` workspace), which stays as it is.
        shopt -s dotglob nullglob
        for entry in .[!.]*; do
          [ "$entry" = .git ] && continue
          rsync --archive --ignore-existing "$entry" out/
        done

    - name: Remove old repository files
      shell: bash
      run: |
        git ls-files -z | xargs -0 rm -f
        git ls-tree --name-only -d -r -z HEAD | sort -rz | xargs -0 rm -rf

    - name: Restore `out` directory
      shell: bash
      run: |
        shopt -s dotglob
        mv out/* .
        rmdir out
