name: Warm-up repo
description: Prepares Node and Yarn dependencies

runs:
  using: composite

  steps:
    - name: Install yarn dependencies
      uses: nick-fields/retry@v3.0.2
      env:
        LEFTHOOK: 0
      with:
        max_attempts: 3
        timeout_minutes: 10
        shell: bash
        # we disable hardened mode (https://yarnpkg.com/features/security), as it significantly slows down the installation
        # immutable installs are still enforced in CI
        command: |
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=true
          export YARN_ENABLE_HARDENED_MODE=0
          yarn install --immutable

    - name: Read the OpenAPI Generator version and storage directory
      id: openapi-generator
      if: hashFiles('libs/@local/graph/client/typescript/openapitools.json') != ''
      shell: bash
      env:
        CONFIG: libs/@local/graph/client/typescript/openapitools.json
      run: |
        {
          echo "version=$(yq -r '.["generator-cli"].version' "$CONFIG")"
          echo "storage-dir=$(yq -r '.["generator-cli"].storageDir // ""' "$CONFIG")"
        } >>"$GITHUB_OUTPUT"

    - name: Restore OpenAPI Generator
      id: openapi-generator-restore
      if: steps.openapi-generator.outputs.storage-dir != ''
      uses: actions/cache/restore@v4.3.0
      with:
        path: ${{ steps.openapi-generator.outputs.storage-dir }}
        key: openapi-generator-cli-${{ steps.openapi-generator.outputs.version }}

    # On failure, codegen downloads the generator itself.
    - name: Download OpenAPI Generator
      id: openapi-generator-download
      if: steps.openapi-generator.outputs.storage-dir != '' && steps.openapi-generator-restore.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      working-directory: libs/@local/graph/client/typescript
      run: yarn openapi-generator-cli version

    - name: Save OpenAPI Generator
      if: steps.openapi-generator-download.outcome == 'success'
      uses: actions/cache/save@v4.3.0
      with:
        path: ${{ steps.openapi-generator.outputs.storage-dir }}
        key: openapi-generator-cli-${{ steps.openapi-generator.outputs.version }}
