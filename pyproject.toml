[project]
name            = "hash"
version         = "0.1.0"
description     = "HASH Monorepo"
readme          = "README.md"
requires-python = ">=3.14,<3.15"
dependencies    = []
authors         = [
    { name = "HASH" },
]

[build-system]
requires      = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1,<0.26", # external dependency declarations; Tach checks internal boundaries
    "pytest>=9.1.1,<10",
    "ruff>=0.16.8,<0.17",
    "tach>=0.35,<0.36",
    "ty<0.0.85,>=0.0.84",
]

[tool.uv]
preview                 = true
add-bounds              = "major"                              # require cargo-style bounded ranges (>=1.2.3, <2.0.0)
exclude-newer           = "7 days"                             # mirrors npm release age
package                 = false
# Admit the certifi security release without relaxing other packages' age limit.
# Remove this ceiling after 2026-10-27T02:24:17Z and regenerate the lockfile.
exclude-newer-package   = { certifi = "2026-10-20T02:24:17Z" }
constraint-dependencies = [
    "deptry<0.26,>=0.25.1",
    "optuna<6.0.0,>=5.0.0",
    "pytest<10,>=9.1.1",
    "pytest-asyncio<2,>=1.4",
    "ruff<0.17,>=0.16.8",
    "tach<0.36,>=0.35",
    "ty<0.0.85,>=0.0.84",
    "uv-build<0.13.0,>=0.12.16",
]

[tool.uv.workspace]
members = [
    "libs/@local/petrinaut-optimizer-core/python",
]

[tool.pytest.ini_options]
addopts    = "-q --import-mode=importlib"
testpaths  = [
    "libs/@local/petrinaut-optimizer-core/python/tests",
]
pythonpath = [
    "libs/@local/petrinaut-optimizer-core/python/src",
]

[tool.ruff]
line-length    = 100
preview        = true
target-version = "py314"
src            = [
    "libs/@local/petrinaut-optimizer-core/python/src",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with the formatter.
    "W191",
    "E111",
    "E114",
    "E117",
    "E501",
    "D203",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
    "ISC001",
    # This repository has no copyright-header convention.
    "CPY001",
    # Put summaries on the first line, without a blank before class docstrings.
    "D203",
    "D213",
    # Self-explanatory APIs need no docstring that restates the signature.
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "DOC201",
    "DOC402",
    "DOC501",
    # Keep informative exception messages at their call sites.
    "EM101",
    "EM102",
    "TRY003",
    # Limit positional arguments rather than keyword arguments.
    "PLR0913",
    # Python 3.14 evaluates annotations lazily.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14 evaluates annotations lazily (PEP 649). The future import changes annotation semantics and can break tooling such as Pydantic."
"typing.Any".msg             = "Use object for pass-through values, a TypeVar for generic code, or pydantic's JsonValue for opaque JSON."

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "SLF001", "PLC2701", "D100", "S603", "INP001"]
"**/cli/**"   = ["PLC0415", "T201"]
"**/cli.py"   = ["PLC0415", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pylint]
max-positional-args = 3

[tool.turbo]
name = "hash-python"

[tool.ty.environment]
python = "./.venv"

[tool.ty.rules]
blanket-ignore-comment        = "error"
missing-override-decorator    = "error"
missing-type-argument         = "error"
unused-ignore-comment         = "error"
division-by-zero              = "error"
possibly-missing-attribute    = "error"
possibly-missing-import       = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base      = "error"

[tool.ty.terminal]
error-on-warning = true
