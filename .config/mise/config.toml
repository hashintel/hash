# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.11.9"

[env]
TURBO_GLOBAL_WARNING_DISABLED = 1
_.file                        = [".env", ".env.local"]
# Yarn's node-modules linker loses bin registrations for workspaces whose peer-virtualized
# instance of a tool (e.g. vite) isn't the copy hoisted to the root — triggered by petrinaut-docs' hoistingLimits.
# Yarn's script shell falls back to PATH, so exposing the root bins fixes this.
_.path                        = ["{{config_root}}/node_modules/.bin"]

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile                            = true
minimum_release_age                 = "7d"

[tools]
# Basic tools
node        = { version = "22.23.5", postinstall = "corepack enable" }
"npm:turbo" = "2.11.12"

# Helper to install tools
cargo-binstall = "1.27.0"
uv             = "0.13.9"

# Tools to compile the project
# binaryen provides `wasm-opt` prebuilt from its GitHub release assets — compiling the
# wasm-opt crate from source added ~7 minutes to every install that needed it.
"github:WebAssembly/binaryen"   = "version_133"
"github:wasm-bindgen/wasm-pack" = "0.15.1"
protoc                          = "36.2"

# CLI tools
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
"aqua:taiki-e/cargo-llvm-cov"           = "0.9.1"
"cargo:cargo-codspeed"                  = "6.0.0"
"cargo:cargo-hack"                      = "0.6.46"
"cargo:cargo-insta"                     = "1.49.0"
just                                    = "1.59.0"
markdownlint-cli2                       = "0.24.1"
oxfmt                                   = "0.79.0"
"pipx:sqlfluff"                         = "4.5.0"
sentry-cli                              = "3.8.2"
tombi                                   = "1.11.3"
typst                                   = "0.15.1"
"ubi:terrastruct/d2"                    = "0.9.0"
yq                                      = "4.54.3"
