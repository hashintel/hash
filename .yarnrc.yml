approvedGitRepositories: []

defaultSemverRangePrefix: ""

enableConstraintsChecks: true

enableScripts: false

enableTransparentWorkspaces: false

nmMode: hardlinks-local

# PnP doesn't work with Zed and pnpm would be preferred but doesn't work with due to: https://github.com/yarnpkg/yarn/issues/8734, https://github.com/yarnpkg/berry/issues/3972 etc.
# This seems to be an allocation error with ZipFS.
# node-modules is slower during the linking step but works.
nodeLinker: node-modules

npmMinimalAgeGate: 7d

# Durable agents spike (`apps/durable-agents`): Pi Durable 1.5.0 and the releases it pins.
# These releases clear the seven-day gate after 2026-11-09T11:01Z; remove then.
npmPreapprovedPackages:
  - "@earendil-works/chord@1.5.0"
  - "@earendil-works/pi-ai@1.5.0"
  - "@earendil-works/pi-codemode@1.5.0"
  - "@earendil-works/pi-durable@1.5.0"
  - "@earendil-works/pi-schema@1.5.0"
  - "@earendil-works/pi-telemetry@1.5.0"

packageExtensions:
  # Dependency analysis and its public types require the JavaScript compiler API.
  "dependency-cruiser@18.0.0":
    dependencies:
      typescript: "6.0.3"
  # The docgen patches use the JavaScript compiler API without replacing TS7.
  "@joshwooding/vite-plugin-react-docgen-typescript@0.7.0":
    dependencies:
      "@typescript/typescript6": "6.0.2"
  "react-docgen-typescript@2.2.2":
    dependencies:
      "@typescript/typescript6": "6.0.2"
  # Native tool input public declarations in the pinned local runtime patch.
  # Patch manifest edits alone do not add dependencies during Yarn resolution.
  "@flue/runtime@2.3.0":
    dependencies:
      "@standard-schema/spec": "1.1.0"

catalog:
  tsx: "4.20.6"
  typescript: "7.0.2"
  "@typescript/typescript6": "6.0.2"
  rolldown: "1.2.15"
  vite: "8.3.5"
  vitest: "5.0.5"
  "@vitest/coverage-istanbul": "5.0.5"
  "@fast-check/vitest": "0.5.0"
  "@tsconfig/bases": "1.0.28"
  "@types/node": "22.18.13"

catalogs:
  beta:
    typescript: "7.1.0-beta"
  typescript6:
    typescript: "6.0.3"
