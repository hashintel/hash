approvedGitRepositories: []

defaultSemverRangePrefix: ""

enableConstraintsChecks: true

enableScripts: false

enableTransparentWorkspaces: false

nmMode: hardlinks-local

# PnP doesn't work with Zed and pnpm would be preferred but doesn't work with due to: https://github.com/yarnpkg/yarn/issues/8734, https://github.com/yarnpkg/berry/issues/3972 etc.
# This seems to be an allocation error with ZipFS.
# node-modules is slower during the linking step but works.
nodeLinker: node-modules

npmMinimalAgeGate: 7d

packageExtensions:
  # Pass the checker's compiler through to Volar instead of resolving native TS7.
  "@astrojs/language-server@2.16.13":
    peerDependencies:
      typescript: "^5.0.0 || ^6.0.0"
  # Dependency analysis and its public types require the JavaScript compiler API.
  "dependency-cruiser@18.0.0":
    dependencies:
      typescript: "6.0.3"
  # Native tool input public declarations in the pinned local runtime patch.
  # Patch manifest edits alone do not add dependencies during Yarn resolution.
  "@flue/runtime@2.0.3":
    dependencies:
      "@standard-schema/spec": "1.1.0"

catalog:
  tsx: "4.20.6"
  typescript: "7.0.2"
  "@typescript/typescript6": "6.0.2"
  vite: "8.2.2"
  vitest: "5.0.2"
  "@vitest/browser-playwright": "5.0.2"
  "@vitest/coverage-istanbul": "5.0.2"
  "@fast-check/vitest": "0.5.0"
  "@tsconfig/bases": "1.0.28"
  "@types/node": "22.18.13"

catalogs:
  typescript6:
    typescript: "6.0.3"
