    expected_ir_homes: [unknowns, quantities, policies, inputs]
    traps:
      [
        copying Alder's parameters to Bracken,
        inventing values from the phrase much more slowly,
      ]

  - id: corven-replenishment-parameters
    importance: useful
    epistemic_character: relevant-absence
    discoverability: tension-probe
    expert_can_answer: not-established
    truth: >-
      The pack establishes Corven's product, approximate draw, journey, and tanker compatibility,
      but not its vessel capacity, initial or current level, boil-off rate, reorder level, normal
      load size, or open-load limit.
    expected_ir_homes: [unknowns, quantities, policies, inputs]
    traps:
      [
        copying Alder's parameters to Corven,
        treating oxygen demand as a complete replenishment policy,
      ]
