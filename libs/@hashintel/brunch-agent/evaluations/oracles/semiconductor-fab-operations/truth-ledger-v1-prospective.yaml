  - id: objective-furnace-batch-waiting
    importance: load-bearing
    epistemic_character: explicit-decision-question
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: >-
      Test whether waiting for full four-lot furnace batches remains worthwhile when due dates are
