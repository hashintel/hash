version: 1-prospective
case: aster-vale-foundry-operations
source: evaluations/cases/semiconductor-fab-operations/situation-pack.md
provenance:
  authored_after_historical_runs: false
  calibrated_against_historical_runs: false
  frozen_before_prospective_runs: true
use: prospective baseline and variant grading only
warning: >-
  This greenfield ledger is sourced only from the completed situation pack and the frozen
  evaluation design and ruler. It has not been informed by or calibrated against runs of this
  case. Freeze the case, prompts, model configuration, protocol, and this ledger together before
  prospective grading.
importance_weights:
  load-bearing: 3
  useful: 2
  incidental: 1

calibration_rules:
  transcript_precedence: >-
    Grade what the simulated expert actually disclosed. Ledger truth may identify a distinction,
    but it does not erase hedges, narrower examples, corrections, or nondisclosure in the transcript.
  interviewer_proposals: >-
    A value or interpretation appearing only in an interviewer question is not user evidence unless
    the expert explicitly adopts it.
  relevant_absences: >-
    Entries whose epistemic_character is relevant-absence describe a relation the pack does not
    settle. Credit elicitation that identifies the gap; do not expect the expert or IR to fill it.
  hard_stop: >-
    When the expert ends elicitation, distinguish unanswered suitable questions from earlier missed
    opportunities. Do not convert turn-budget truncation into an ordinary acquisition miss.
  partial_disclosure: >-
    A concrete example inside a ledger range is partial evidence, not simulator failure by itself.
    Penalize only unsupported generalization beyond the disclosed example.

facts:
  - id: objective-good-lots-per-week
    importance: load-bearing
    epistemic_character: explicit-goal
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: Sustain 18 good lots per week without flooding the floor.
    expected_ir_homes: [purpose, goals, measures, validation]
    traps: [treating starts or completed-but-rejected lots as good lots]

  - id: objective-due-date-service
    importance: load-bearing
    epistemic_character: explicit-goal
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: >-
      Keep at least 92 percent of lots on or before committed due dates, with expedited logic lots
      receiving especially close attention from customer planning.
    expected_ir_homes: [purpose, goals, measures, validation]
    traps:
      [treating every family and urgency class as commercially interchangeable]

  - id: objective-wip-band-and-ceiling
    importance: load-bearing
    epistemic_character: explicit-goal
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: >-
      Keep total WIP below the hard ceiling of 50 lots and preferably in the 42 to 47 lot band so
      there is room for an urgent release or a held lot returning to route.
    expected_ir_homes: [goals, measures, constraints, validation]
    traps: [turning the preferred band into a hard feasibility constraint]

  - id: objective-final-inspection-yield
    importance: load-bearing
    epistemic_character: explicit-goal
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: Hold final-inspection yield at or above 94 percent.
    expected_ir_homes: [purpose, goals, measures, validation]
    traps: [substituting mid-flow inspection results for final-inspection yield]

  - id: objective-maintenance-capacity-tradeoff
    importance: load-bearing
    epistemic_character: explicit-decision-question
