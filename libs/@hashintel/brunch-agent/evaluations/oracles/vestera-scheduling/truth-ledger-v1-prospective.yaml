version: 1-prospective
case: vestera-coatings-baseline
source: evaluations/cases/vestera-scheduling/situation-pack.md
provenance:
  authored_after_historical_runs: true
  calibrated_against_historical_runs: true
  frozen_before_prospective_runs: true
use: prospective baseline and variant grading only
warning: >-
  This ledger was informed by the two historical Mission 3 runs, so it must not turn those runs
  into a baseline distribution. It is frozen before future runs and may grade those prospective
  runs when the case, prompts, model configuration, and protocol are frozen with it.
importance_weights:
  load-bearing: 3
  useful: 2
  incidental: 1

calibration_rules:
  transcript_precedence: >-
    Grade what the simulated expert actually disclosed. Ledger truth may identify a distinction,
    but it does not erase hedges, narrower examples, corrections, or nondisclosure in the transcript.
  interviewer_proposals: >-
    A value or interpretation appearing only in an interviewer question is not user evidence unless
    the expert explicitly adopts it.
  relevant_absences: >-
    Entries whose epistemic_character is relevant-absence describe a relation the pack does not
    settle. Credit elicitation that identifies the gap; do not expect the expert or IR to fill it.
  hard_stop: >-
    When the expert ends elicitation, distinguish unanswered suitable questions from earlier missed
    opportunities. Do not convert turn-budget truncation into an ordinary acquisition miss.
  partial_disclosure: >-
    A concrete example inside a ledger range is partial evidence, not simulator failure by itself.
    Penalize only unsupported generalization beyond the disclosed example.

facts:
  - id: objective-weekly-scheduling
    importance: load-bearing
    epistemic_character: explicit-goal
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: Decide line assignment, order sequence, and run size for a weekly demand book.
    expected_ir_homes: [purpose, goals, validation]
    traps: [reducing the objective to the physical production flow]

  - id: objective-priority-order
    importance: load-bearing
    epistemic_character: explicit-preference
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: Avoid late orders first, reduce changeover hours second, improve utilization third.
    expected_ir_homes: [goals, measures]
    traps:
      [
        treating the three objectives as equally weighted,
        inventing numerical weights,
      ]

  - id: objective-idle-versus-washdown
    importance: load-bearing
    epistemic_character: explicit-decision-question
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: Test when holding a line idle for a same-family order beats switching and later washing back.
    expected_ir_homes: [purpose, policies, validation, situation-notes]
    traps: [hard-coding a decision rule the expert wants the model to test]

  - id: objective-line-down-replanning
    importance: load-bearing
    epistemic_character: explicit-decision-question
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: Test how to reshuffle the week when a line goes down before the 07:30 huddle.
    expected_ir_homes: [purpose, failures, validation]
    traps:
      [
        inventing failure distributions,
        omitting the objective because statistics are unknown,
      ]

  - id: objective-buffer-argument
    importance: useful
    epistemic_character: tacit-goal
    discoverability: tacit
    expert_can_answer: true
    reveal_when: asked about hidden bottlenecks, blocking, or what the scheduler wants evidence to settle
    truth: Marta suspects Line 1's mill-to-fill tank is too small; engineering disputes it.
    expected_ir_homes: [purpose, conflicts, situation-notes]
    traps: [recording Marta's belief as established capacity analysis]

  - id: horizon-week-hours-shifts
    importance: load-bearing
    epistemic_character: explicit-fact
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: The planning horizon is Monday through Friday; hour/shift resolution matters.
    expected_ir_homes: [posture, boundary, time]
    traps: [using only daily granularity]

  - id: demand-book-shape
    importance: load-bearing
    epistemic_character: explicit-fact
    discoverability: direct-if-asked
    expert_can_answer: true
    truth: ERP supplies roughly 30–60 weekly orders; each has SKU, quantity, and due date.
    expected_ir_homes: [boundary, triggers, quantities]
    traps: [inventing a stochastic arrival process instead of the weekly book]

  - id: demand-priority-attribute
    importance: load-bearing
    epistemic_character: relevant-absence
    discoverability: tension-probe
    expert_can_answer: not-established
    truth: >-
      The pack does not say which demand-book field identifies Meridian, distributor, or small-account
      priority, even though customer class changes lateness policy.
    expected_ir_homes: [triggers, inputs, unknowns]
    traps: [assuming customer priority can be recovered from SKU or due date]

  - id: due-date-completion-event
    importance: load-bearing
    epistemic_character: relevant-absence
    discoverability: direct-if-asked
    expert_can_answer: not-established
    truth: >-
      The pack does not establish whether an order meets its due date at production completion, QA
      release, ready-to-ship state, or shipment.
    expected_ir_homes: [goals, boundary, validation, unknowns]
    traps:
      [
        silently choosing QA release or shipment while excluding shipping from the boundary,
      ]

  - id: process-four-stages
