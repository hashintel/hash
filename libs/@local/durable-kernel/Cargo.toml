[package]
name              = "durable-kernel"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Exposes the simulation tools for tests
test-util = []

[dependencies]
# Public workspace dependencies
error-stack = { workspace = true, public = true, features = ["std"] }

# Public third-party dependencies
# `opendata_common` and `opendata_log` rename the upstream libraries named `common` and `log`.
bytes           = { workspace = true, public = true }
futures-core    = { workspace = true, public = true }
opendata_common = { workspace = true, public = true }
serde           = { workspace = true, public = true, features = ["derive", "std"] }
serde_core      = { workspace = true, public = true }
serde_json      = { workspace = true, public = true, features = ["preserve_order", "raw_value"] }
time            = { workspace = true, public = true, features = ["formatting", "parsing", "serde", "std"] }
tokio           = { workspace = true, public = true, features = ["macros", "rt", "sync", "time"] }

# Private workspace dependencies

# Private third-party dependencies
derive_more    = { workspace = true, features = ["display", "error"] }
futures-util   = { workspace = true }
hex            = { workspace = true, features = ["std"] }
opendata_log   = { workspace = true }
sha2           = { workspace = true }
simple-mermaid = { workspace = true }
slatedb        = { workspace = true }
tokio-util     = { workspace = true, features = ["rt"] }
tracing        = { workspace = true, features = ["attributes", "std"] }

[dev-dependencies]
proptest = { workspace = true, features = ["fork", "timeout", "bit-set"] }
tempfile = { workspace = true }

[lints]
workspace = true
