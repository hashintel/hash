openapi: 3.1.0

info:
  title: HASH Atlas API
  version: 0.0.0
  summary: Read-only HTTP surface for verified Atlas (SALT) serving state.
  description: |
    The Atlas API serves the currently active, fully verified SALT generation.
    It is implemented as an Axum 0.8 router in the `hash-graph-atlas` crate
    (`src/api/mod.rs`) and is exposed through the `hash-graph atlas`
    subcommand.

    ## Trust model

    Every response is sourced from an active generation that has passed
    signature, manifest, artifact, and checkpoint verification against
    Ed25519 authorities pinned in the serving configuration
    (`AtlasApiConfiguration`). Evidence-deferred generations require an
    explicit serving opt-in. This is not a key-discovery endpoint: the
    configured authorities must match those embedded in the generation.

    ## Reload semantics

    Each request compares the on-disk `active.json` pointer with the cached
    generation. A changed pointer is re-opened once under a single-flight
    mutex and replaces the cache only after complete re-verification;
    in-flight requests keep serving the previous immutable generation.

    ## Caching

    Tile, overlay, and lookup routes bind both generation and variant in the
    path, so their payloads are immutable and are served with
    `Cache-Control: public, max-age=31536000, immutable` and an exact
    content-hash `ETag`. The `current` and `manifest` routes describe mutable
    state ("whatever is active right now") and must not be cached; the
    lookup subgraph route reads the live store and must not be cached
    either.

    ## Security

    This API performs **no request authentication, tenant authorization, rate
    limiting, or TLS termination**. Bind it to loopback or a trusted internal
    network and add those controls in the surrounding application before
    exposing it to untrusted clients.

    ## Errors

    Handler-level errors use the JSON error envelope
    (`{"error": "<detail>"}`). Malformed path parameters that fail Axum's
    typed extraction (for example a non-numeric `variant`) are rejected by
    the framework with a plain-text `400` before a handler runs.
  license:
    name: See repository license
    identifier: AGPL-3.0

servers:
  - url: http://127.0.0.1:4003
    description: |
      Default standalone binding of the `hash-graph atlas` subcommand
      (`HASH_ATLAS_HOST`, default `127.0.0.1`; `HASH_ATLAS_PORT`, default
      `4003`). The router may also be nested into a larger application under
      a different base path.

tags:
  - name: health
    description: Process liveness.
  - name: atlas
    description: Verified active-generation metadata and binary map payloads.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: |
        Returns `204 No Content` when the process is responsive. Does **not**
        assert that an Atlas generation is active; use
        `GET /v1/atlas/current` for that.
      responses:
        "204":
          description: The process is responsive.

  /v1/atlas/current:
    get:
      operationId: getCurrentAtlas
      tags: [atlas]
      summary: Active generation identity and artifact metadata
      description: |
        Returns release identity, revision counters, content hashes, the
        assurance mode, and a summary of every artifact of the verified
        active generation.
      responses:
        "200":
          description: The verified active generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAtlas"
        "404":
          $ref: "#/components/responses/NoActiveGeneration"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/atlas/current/manifest:
    get:
      operationId: getCurrentAtlasManifest
      tags: [atlas]
      summary: Active generation manifest
      description: |
        Returns the complete generation manifest of the verified active
        generation: input snapshot bounds, embedding / semantic-graph /
        landmark / projector / relation configuration, published variants,
        storage layout, artifact hashes, serving contract, and
        reproducibility metadata. The authoritative field-level definition is
        `GenerationManifest` in
        `libs/@local/graph/atlas/src/salt/manifest/model.rs`.
      responses:
        "200":
          description: The generation manifest.
          headers:
            ETag:
              $ref: "#/components/headers/ContentHashETag"
            Cache-Control:
              description: Always `no-cache`; the active generation can change at any time.
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationManifest"
        "404":
          $ref: "#/components/responses/NoActiveGeneration"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/atlas/tile/{generation}/{variant}/{z}/{x}/{y}:
    get:
      operationId: getAtlasTile
      tags: [atlas]
      summary: Binary tile-wire-v4 quadrant
      description: |
        Returns one bounded spatial quadrant of the active generation as a
        binary tile-wire-v4 payload, in delivery-priority order.

        Coordinates address a Morton (Z-order) quadtree over 16-bit quantized
        world axes: `z` selects the depth (`0..=16`) and `x`/`y` the quadrant
        at that depth (`x, y < 2^z`). The response identifies the complete
        visible spatial subtree and the delivered prefix; when the server's
        point budget truncates delivery, the delivered set is spatially
        stratified (fair truncation, van der Corput progressive order) so any
        client-side prefix is renderable without spatial bias.

        Because generation and variant are bound in the path, a successful
        response is immutable. See
        `libs/@local/graph/atlas/docs/tile-wire-v4.md` for the byte-level
        format.
      parameters:
        - $ref: "#/components/parameters/Generation"
        - $ref: "#/components/parameters/Variant"
        - name: z
          in: path
          required: true
          description: Quadtree zoom depth.
          schema:
            type: integer
            minimum: 0
            maximum: 16
        - name: x
          in: path
          required: true
          description: Quadrant column at depth `z`; must be below `2^z`.
          schema:
            type: integer
            minimum: 0
            maximum: 65535
        - name: y
          in: path
          required: true
          description: Quadrant row at depth `z`; must be below `2^z`.
          schema:
            type: integer
            minimum: 0
            maximum: 65535
      responses:
        "200":
          description: Immutable binary tile payload.
          headers:
            ETag:
              $ref: "#/components/headers/ContentHashETag"
            Cache-Control:
              $ref: "#/components/headers/ImmutableCacheControl"
            x-atlas-visible-subtree-count:
              description: >-
                Total point count of the complete visible spatial subtree for
                this quadrant, computed even when delivery is truncated.
              schema:
                type: integer
                minimum: 0
            x-atlas-delivered-count:
              description: >-
                Number of point records actually delivered in this response
                (bounded by the server's tile point budget).
              schema:
                type: integer
                minimum: 0
          content:
            application/vnd.hash.atlas.tile-v4:
              schema:
                type: string
                format: binary
                description: >-
                  Tile wire v4. Little-endian; starts with ASCII magic
                  `ATLTILE4` and a fixed header embedding the generation,
                  store-snapshot, manifest, and release-report identities.
        "400":
          description: >-
            The tile request is invalid: `z` exceeds 16 or `(x, y)` lies
            outside the `2^z` by `2^z` grid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No generation is active, the requested generation is not the
            active one, the variant is not published, or the variant has no
            materialized tile artifact (only the canonical variant is
            materialized).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/atlas/contours/{generation}/{variant}:
    get:
      operationId: getAtlasContours
      tags: [atlas]
      summary: Binary nested density contours overlay
      description: |
        Returns the whole-map nested density-contour overlay for the active
        generation as a binary contour-wire-v1 payload. Encoded at serve time
        from the generation's canonical analytics and base artifacts; vertex
        coordinates land directly in tile world coordinates.

        Immutable per (generation, variant). See
        `libs/@local/graph/atlas/docs/overlay-wires-v1.md` for the byte-level
        format.
      parameters:
        - $ref: "#/components/parameters/Generation"
        - $ref: "#/components/parameters/Variant"
      responses:
        "200":
          description: Immutable binary contour overlay.
          headers:
            ETag:
              $ref: "#/components/headers/ContentHashETag"
            Cache-Control:
              $ref: "#/components/headers/ImmutableCacheControl"
          content:
            application/vnd.hash.atlas.contours-v1:
              schema:
                type: string
                format: binary
                description: >-
                  Contour wire v1. Little-endian; starts with ASCII magic
                  `ATLCONT1` and the shared 160-byte overlay header whose
                  four identity hashes sit at the same offsets as the tile
                  wire.
        "404":
          $ref: "#/components/responses/OverlayNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/atlas/flows/{generation}/{variant}:
    get:
      operationId: getAtlasFlows
      tags: [atlas]
      summary: Binary region-flow overlay
      description: |
        Returns the whole-map region-flow overlay for the active generation
        as a binary flow-wire-v1 payload. Encoded at serve time from the
        generation's canonical analytics, semantic-graph, and base artifacts.

        Immutable per (generation, variant). See
        `libs/@local/graph/atlas/docs/overlay-wires-v1.md` for the byte-level
        format.
      parameters:
        - $ref: "#/components/parameters/Generation"
        - $ref: "#/components/parameters/Variant"
      responses:
        "200":
          description: Immutable binary region-flow overlay.
          headers:
            ETag:
              $ref: "#/components/headers/ContentHashETag"
            Cache-Control:
              $ref: "#/components/headers/ImmutableCacheControl"
          content:
            application/vnd.hash.atlas.flows-v1:
              schema:
                type: string
                format: binary
                description: >-
                  Flow wire v1. Little-endian; starts with ASCII magic
                  `ATLFLOW1` and the shared 160-byte overlay header whose
                  four identity hashes sit at the same offsets as the tile
                  wire.
        "404":
          $ref: "#/components/responses/OverlayNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/atlas/lookup/{generation}/{variant}:
    get:
      operationId: getAtlasLookup
      tags: [atlas]
      summary: Reverse spatial lookup of entity identities
      description: |
        Resolves quantized grid coordinates to the entities at that point.
        Coordinates use the tile wire's 16-bit axis space (`[0, 65536)` per
        axis, one unit per quantization cell), so a canvas client can pass
        tile-record coordinates through unchanged.

        Without `radius`, the response holds the `limit` (default 1) nearest
        points; with `radius`, the up to `limit` (default 32) nearest points
        inside it. Hits are ordered nearest first and carry the durable
        entity ID, the generation row (matching tile-wire records), grid and
        canonical coordinates, distance, and importance rung.

        Because generation and variant are bound in the path and the index
        derives from the immutable canonical base, a successful response is
        immutable.
      parameters:
        - $ref: "#/components/parameters/Generation"
        - $ref: "#/components/parameters/Variant"
        - name: x
          in: query
          required: true
          description: Quantized grid x in `[0, 65536)`.
          schema:
            type: number
            minimum: 0
            exclusiveMaximum: 65536
        - name: y
          in: query
          required: true
          description: Quantized grid y in `[0, 65536)`.
          schema:
            type: number
            minimum: 0
            exclusiveMaximum: 65536
        - name: radius
          in: query
          required: false
          description: >-
            Search radius in grid units. Absent means nearest-neighbour
            lookup.
          schema:
            type: number
            exclusiveMinimum: 0
        - name: limit
          in: query
          required: false
          description: >-
            Maximum hits (1 to 4096). Defaults to 1 without a radius and 32
            with one.
          schema:
            type: integer
            minimum: 1
            maximum: 4096
      responses:
        "200":
          description: Immutable nearest-first hit list.
          headers:
            ETag:
              $ref: "#/components/headers/ContentHashETag"
            Cache-Control:
              $ref: "#/components/headers/ImmutableCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResponse"
        "400":
          description: >-
            The lookup request is invalid: a coordinate lies outside the
            grid, the radius is not a positive length, or the limit exceeds
            its maximum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/OverlayNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/atlas/lookup/{generation}/{variant}/subgraph:
    post:
      operationId: postAtlasLookupSubgraph
      tags: [atlas]
      summary: Spatial lookup hydrated with a live-store subgraph
      description: |
        Runs the same spatial lookup as `GET /v1/atlas/lookup/...`, then
        hydrates the hit entities from the live HASH Graph store in the same
        round trip: full entity payloads plus the requested graph
        neighbourhood, serialized as the Graph REST API's keyed subgraph
        (`roots`, `vertices`, `edges`, `temporalAxes`; edges carry
        `kind`/`reversed`/`rightEndpoint` traversal structure).

        The traversal shape uses the Graph API's `SubgraphTraversalParams`
        form. When omitted, the default requests one link hop in both
        directions plus every reached entity's type.

        **This route is an unauthenticated proof of concept.** The optional
        `actorId` is trusted as-is (mirroring the Graph API's
        `X-Authenticated-User-Actor-Id` gateway contract) and defaults to
        the configured serving actor; policy filtering still applies to that
        actor, but nothing verifies the caller's identity. Responses read
        live mutable state and are not cacheable.
      parameters:
        - $ref: "#/components/parameters/Generation"
        - $ref: "#/components/parameters/Variant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupSubgraphRequest"
      responses:
        "200":
          description: Hit list plus hydrated subgraph. Not cacheable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupSubgraphResponse"
        "400":
          description: >-
            The lookup parameters are invalid or the traversal exceeds the
            Graph API's depth and path limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/OverlayNotFound"
        "503":
          description: No HASH Graph store is configured for hydration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    Generation:
      name: generation
      in: path
      required: true
      description: >-
        Generation ID; must equal the active generation's ID (as reported by
        `GET /v1/atlas/current`), otherwise the route responds `404`.
      schema:
        $ref: "#/components/schemas/ContentHash"
    Variant:
      name: variant
      in: path
      required: true
      description: >-
        Published variant ID. Currently only the canonical variant has
        materialized artifacts; other published variants respond `404`.
      schema:
        type: integer
        minimum: 0
        maximum: 65535

  headers:
    ContentHashETag:
      description: >-
        Quoted lowercase-hex SHA-256 of the exact response bytes (for the
        manifest route, the manifest content hash).
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    ImmutableCacheControl:
      description: >-
        The payload is immutable because generation and variant are bound in
        the path.
      schema:
        type: string
        const: public, max-age=31536000, immutable

  responses:
    NoActiveGeneration:
      description: No Atlas generation is active.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: no Atlas generation is active
    OverlayNotFound:
      description: >-
        No generation is active, the requested generation is not the active
        one, the variant is not published, or the variant has no materialized
        overlay artifacts (only the canonical variant is materialized).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >-
        Verification, artifact access, or encoding failed while serving the
        request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ContentHash:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: >-
        SHA-256 content identity as 64 lowercase hexadecimal characters.
        Uppercase and noncanonical lengths are rejected.

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable failure detail.

    CurrentAtlas:
      type: object
      description: Identity and artifact metadata of the verified active generation.
      required:
        - generation
        - base_revision
        - delta_revision
        - manifest_hash
        - release_report_hash
        - assurance_mode
        - created_at
        - artifacts
      additionalProperties: false
      properties:
        generation:
          $ref: "#/components/schemas/ContentHash"
          description: Active generation ID.
        base_revision:
          type: integer
          minimum: 1
          description: Base data revision the generation was built from.
        delta_revision:
          type: integer
          minimum: 1
          description: Delta data revision the generation was built from.
        manifest_hash:
          $ref: "#/components/schemas/ContentHash"
          description: Content hash of the generation manifest.
        release_report_hash:
          $ref: "#/components/schemas/ContentHash"
          description: Content hash of the signed release report.
        assurance_mode:
          $ref: "#/components/schemas/AssuranceMode"
        created_at:
          type: string
          format: date-time
          description: RFC 3339 creation timestamp of the generation.
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactSummary"

    AssuranceMode:
      type: string
      description: >-
        How the generation's release gates were verified.
        `independent_authorities`: every externally owned gate carries
        evidence signed by its independent authority.
        `evidence_deferred_local`: local attestations were accepted while
        evidence suites remain deferred (requires an explicit serving
        opt-in).
      enum:
        - independent_authorities
        - evidence_deferred_local

    ArtifactSummary:
      type: object
      required: [role, relative_path, content_hash, byte_length]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/ArtifactRole"
        relative_path:
          type: string
          description: Artifact path relative to the generation directory.
        content_hash:
          $ref: "#/components/schemas/ContentHash"
        byte_length:
          type: integer
          minimum: 0

    ArtifactRole:
      type: string
      description: Role of an artifact within a generation.
      enum:
        - representations
        - relation-classifier
        - strength-head
        - semantic-graph
        - relation-indexes
        - landmark-skeleton
        - landmark-reference-persistence
        - projector-checkpoint
        - canonical-base
        - canonical-analytics
        - representation-report
        - semantic-fidelity-report
        - relation-policy-report
        - merge-tree-persistence-report
        - subgroup-behavior-report
        - authorization-noninterference-report
        - security-approval-report
        - companion-pin-report
        - legacy-layout
        - legacy-identities
        - legacy-export-manifest

    EntityId:
      type: string
      description: >-
        Durable graph entity identity in the canonical
        `webId~entityUuid[~draftId]` tilde-delimited UUID form.
      pattern: "^[0-9a-f-]{36}~[0-9a-f-]{36}(~[0-9a-f-]{36})?$"

    LookupHit:
      type: object
      description: One resolved point, nearest first within its response.
      required:
        - entityId
        - row
        - x
        - y
        - canonicalX
        - canonicalY
        - distance
        - bucket
      additionalProperties: false
      properties:
        entityId:
          $ref: "#/components/schemas/EntityId"
        row:
          type: integer
          minimum: 0
          description: >-
            Generation-stable row identity, matching tile-wire point
            records.
        x:
          type: number
          description: Quantized grid x of the hit.
        y:
          type: number
          description: Quantized grid y of the hit.
        canonicalX:
          type: number
          description: Canonical generation x of the hit.
        canonicalY:
          type: number
          description: Canonical generation y of the hit.
        distance:
          type: number
          minimum: 0
          description: Euclidean distance from the query point in grid units.
        bucket:
          type: integer
          minimum: 0
          description: Importance rung of the hit's delivery bucket.

    LookupResponse:
      type: object
      required: [generation, variant, hits]
      additionalProperties: false
      properties:
        generation:
          $ref: "#/components/schemas/ContentHash"
        variant:
          type: integer
          minimum: 0
          maximum: 65535
        hits:
          type: array
          items:
            $ref: "#/components/schemas/LookupHit"

    LookupSubgraphRequest:
      type: object
      required: [x, y]
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
          exclusiveMaximum: 65536
          description: Quantized grid x in `[0, 65536)`.
        y:
          type: number
          minimum: 0
          exclusiveMaximum: 65536
          description: Quantized grid y in `[0, 65536)`.
        radius:
          type: number
          exclusiveMinimum: 0
          description: >-
            Search radius in grid units. Absent means nearest-neighbour
            lookup.
        limit:
          type: integer
          minimum: 1
          maximum: 4096
          description: >-
            Maximum hits. Defaults to 1 without a radius and 32 with one.
        traversal:
          type: object
          description: >-
            Graph API `SubgraphTraversalParams`: either
            `{traversalPaths: [...], graphResolveDepths: {...}}` (entity
            traversal paths plus ontology resolve depths) or
            `{traversalPaths: [...]}` (full traversal paths). Absent means
            one link hop in both directions plus entity types.
        actorId:
          type: string
          format: uuid
          description: >-
            Acting actor for the store query, trusted as-is (proof of
            concept). Absent uses the configured serving actor; the nil
            UUID is the public actor.
        includeDrafts:
          type: boolean
          default: false
          description: Whether draft entities participate in hydration.

    LookupSubgraphResponse:
      type: object
      required: [generation, variant, hits, subgraph]
      additionalProperties: false
      properties:
        generation:
          $ref: "#/components/schemas/ContentHash"
        variant:
          type: integer
          minimum: 0
          maximum: 65535
        hits:
          type: array
          items:
            $ref: "#/components/schemas/LookupHit"
        subgraph:
          type: object
          description: >-
            Keyed subgraph in the Graph REST API wire shape: `roots` (vertex
            IDs), `vertices` (entity ID or base URL, then revision, to
            vertex), `edges` (same key space to outward edges carrying
            `kind`, `reversed`, and `rightEndpoint`), and `temporalAxes`.
          required: [roots, vertices, edges, temporalAxes]

    GenerationManifest:
      type: object
      description: >-
        Complete immutable inputs and artifacts for one Atlas generation.
        Only the top-level shape is described here; the authoritative
        field-level definition is `GenerationManifest` in
        `libs/@local/graph/atlas/src/salt/manifest/model.rs`, which rejects
        unknown fields on both ends.
      required:
        - format_version
        - generation_id
        - created_at
        - assurance_mode
        - input_snapshot
        - embedding
        - semantic_graph
        - landmarks
        - projector
        - relations
        - variants
        - storage
        - artifacts
        - serving
        - reproducibility
      properties:
        format_version:
          type: integer
          minimum: 0
        generation_id:
          $ref: "#/components/schemas/ContentHash"
        created_at:
          type: string
          format: date-time
        assurance_mode:
          $ref: "#/components/schemas/AssuranceMode"
        input_snapshot:
          type: object
          description: Bitemporal bounds and source identities frozen before generation.
        embedding:
          type: object
          description: Embedding model and dimensionality contract.
        semantic_graph:
          type: object
          description: Semantic-graph construction parameters.
        landmarks:
          type: object
          description: Landmark skeleton and persistence configuration.
        projector:
          type: object
          description: Projector model and checkpoint contract.
        relations:
          type: object
          description: Relation classifier and index configuration.
        variants:
          type: object
          description: Published variants, including the canonical variant ID.
        storage:
          type: object
          description: On-disk storage layout.
        artifacts:
          type: array
          description: Content hash, role, path, and byte length of every artifact.
          items:
            type: object
        serving:
          type: object
          description: Serving contract for this generation.
        reproducibility:
          type: object
          description: Execution contract (compute backend, device ordinal, seeds).
