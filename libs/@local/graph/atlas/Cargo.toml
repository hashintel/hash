[package]
name              = "hash-graph-atlas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies
type-system = { workspace = true, public = true }

# Public third-party dependencies
axum           = { workspace = true, public = true }
camino         = { workspace = true, public = true }
futures-sink   = { workspace = true, public = true }
rand           = { workspace = true, public = true }
rand_core      = { workspace = true, public = true }
schemars       = { workspace = true, public = true }
sprs           = { workspace = true, public = true }
tokio          = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"], public = true }
tokio-postgres = { workspace = true, features = ["with-uuid-1"], public = true }
uuid           = { workspace = true, public = true, features = ["std", "v7"] }
zerocopy       = { workspace = true, features = ["derive"], public = true }

# Private workspace dependencies
error-stack                    = { workspace = true }
hash-graph-embeddings          = { workspace = true, public = true }
hash-graph-temporal-versioning = { workspace = true, features = ["postgres"] }
hash-graph-types               = { workspace = true }
hashql-core                    = { workspace = true }

# Private third-party dependencies
aide                 = { workspace = true, features = ["axum", "axum-json", "macros", "scalar"] }
burn                 = { workspace = true, features = ["autodiff", "ndarray"] }
chacha20poly1305     = { workspace = true }
clap                 = { workspace = true, features = ["derive", "env"] }
futures              = { workspace = true }
hannoy               = { workspace = true }
heed                 = { workspace = true }
hkdf                 = { workspace = true }
kiddo                = { workspace = true, features = ["rkyv_08"] }
memchr               = { workspace = true }
memmap2              = { workspace = true }
pin-project-lite     = { workspace = true }
rand_core_06         = { workspace = true }
rand_xoshiro         = { workspace = true }
ratatui              = { workspace = true, optional = true }
rayon                = { workspace = true }
regex                = { workspace = true }
rkyv                 = { workspace = true }
roaring              = { workspace = true, features = ["std"] }
serde                = { workspace = true, features = ["derive"] }
serde_json           = { workspace = true, features = ["float_roundtrip"] }
sha2                 = { workspace = true }
simple-mermaid       = { workspace = true }
siphasher            = { workspace = true }
smallvec             = { workspace = true }
tiktoken-rs          = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true, optional = true, features = ["ansi", "env-filter", "fmt", "std"] }
unicode-segmentation = { workspace = true }
unidecode            = { workspace = true }
zeroize              = { workspace = true, features = ["alloc"] }

[dev-dependencies]
codspeed-criterion-compat = { workspace = true }
darwin-kperf-criterion    = { workspace = true, features = ["codspeed"] }
darwin-kperf-events       = { workspace = true }
proptest                  = { workspace = true, features = ["attr-macro"] }
tokio                     = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower                     = { workspace = true, features = ["util"] }
tracing-subscriber        = { workspace = true, features = ["ansi", "env-filter", "fmt", "std"] }
uuid                      = { workspace = true, features = ["v5"] }

[features]
# Exposes `hash_graph_atlas::bench`, the measurement seams the
# `[[bench]]` and `[[example]]` targets consume; not API for consumers
# of the crate.
bench = []
# Trains the projector placement on the Metal GPU backend instead of
# the CPU, and - combined with `bench` - adds the Metal-backed flavor
# to the measurement seams (burn's CubeCL wgpu runtime compiling to
# MSL). Compiles anywhere; running on it requires an Apple GPU, so
# the GPU-flavored tests are ignored by default.
gpu = ["burn/metal"]
# The operator commands (`cli` module) and the read-API routes (`api`
# module) build unconditionally: the `hash-graph` binary consumes them
# feature-free. This feature gates only the standalone operator
# binary's shell (`src/main.rs` and `cli::main`) and the dependencies
# exclusive to it.
cli = ["dep:ratatui", "dep:tracing-subscriber"]

[[bin]]
name              = "hash-graph-atlas"
path              = "src/main.rs"
required-features = ["cli"]

[[example]]
name              = "clump_sweep"
required-features = ["bench"]

[[example]]
name              = "knn_brute"
required-features = ["bench"]

[[example]]
name              = "knn_descent"
required-features = ["bench"]

[[example]]
name              = "knn_sweep"
required-features = ["bench"]

[[example]]
name              = "quality_live"
required-features = ["bench"]

[[bench]]
name              = "backfill_walk"
harness           = false
required-features = ["bench"]

[[bench]]
name              = "math_kernels"
harness           = false
required-features = ["bench"]

[[bench]]
name              = "miner_index"
harness           = false
required-features = ["bench"]

[[bench]]
name              = "projector_backend"
harness           = false
required-features = ["bench"]

[[bench]]
name              = "relation_build"
harness           = false
required-features = ["bench"]

[lints]
workspace = true
