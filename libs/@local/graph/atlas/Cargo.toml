[package]
name              = "hash-graph-atlas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies
hash-graph-embeddings = { workspace = true, public = true }
type-system           = { workspace = true, public = true }

# Public third-party dependencies
# candle 0.10.x to match `burn-candle` 0.21 (`candle-core ^0.10.2`), so burn's candle
# backend and our direct candle usage share a single candle build.
burn = { version = "0.21.0", features = ["std", "tui", "train", "wgpu", "fusion", "candle"], public = true }
# The burn facade re-exports these; the types appearing in our public API are
# defined in the sub-crates, so the public-dependency contract names them too.
burn-backend = { version = "0.21.0", default-features = false, public = true }
burn-core    = { version = "0.21.0", default-features = false, public = true }
burn-tensor  = { version = "0.21.0", default-features = false, public = true }
burn-train   = { version = "0.21.0", default-features = false, public = true }
bytes        = { workspace = true, public = true }
camino       = { workspace = true, public = true }
# Error sources surfaced through public error enums.
cxx            = { version = "1.0.194", public = true }
tempfile       = { version = "3.27.0", public = true }
tokio          = { workspace = true, public = true }
tokio-postgres = { workspace = true, public = true }

# Private workspace dependencies

# Private third-party dependencies
candle-core                         = { version = "0.10.2" }
candle-nn                           = { version = "0.10.2" }
error-stack.workspace               = true
faer                                = "0.24.4"
futures.workspace                   = true
hash-graph-postgres-store.workspace = true
hash-graph-store.workspace          = true
hash-graph-types.workspace          = true
levenberg-marquardt                 = "0.15.0"
memmap2                             = "0.9.11"
nalgebra                            = "0.34.1"
pin-project-lite.workspace          = true
rand                                = { workspace = true }
rand_xoshiro                        = { workspace = true }
rayon                               = { workspace = true }
serde                               = { workspace = true, features = ["derive"] }
serde_json                          = { workspace = true }
sha2                                = { workspace = true }
simple-mermaid                      = { workspace = true }
sprs                                = { version = "0.11.4", default-features = false }
tokio-util.workspace                = true
tracing                             = { workspace = true }
usearch                             = "2.25.3"
uuid.workspace                      = true
zerocopy                            = "0.8.54"

[dev-dependencies]
burn                  = { version = "0.21.0", features = ["candle"] }
camino                = { workspace = true }
futures               = { workspace = true }
hash-graph-embeddings = { workspace = true }
npyz                  = "0.9.1"
tempfile              = "3.27.0"
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres        = { workspace = true }
tracing-subscriber    = { workspace = true }
uuid                  = { workspace = true, features = ["v4"] }

# Opt-in only: these need the CUDA toolkit (nvcc) at build time, so they must not be
# enabled by default or via `--all-features` runs on machines without it.
# [features]
# cuda  = ["burn/cuda", "burn/candle-cuda", "candle-nn/cuda"]
# cudnn = ["cuda", "candle-nn/cudnn"]
# mkl   = ["candle-nn/mkl"]

# Apple-only backends: always available on macOS, never elsewhere.
# `metal` implies `wgpu` and compiles kernels via MSL; `candle-metal` puts the
# burn-candle backend on Metal; `accelerate` uses Apple's BLAS for CPU paths.
[target.'cfg(target_os = "macos")'.dependencies]
burn      = { version = "0.21.0", features = ["metal", "accelerate", "candle-metal"] }
candle-nn = { version = "0.10.2", features = ["metal", "accelerate"] }

# Everywhere else the wgpu backend compiles kernels via SPIR-V/Vulkan.
# No vendor toolchain needed at build time (unlike CUDA).
[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.21.0", features = ["vulkan"] }

[lints]
workspace = true
