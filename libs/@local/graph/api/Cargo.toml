[package]
name              = "hash-graph-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description       = "HASH Graph API"

[[bin]]
name = "openapi-spec-generator"
path = "src/bin/openapi-spec-generator.rs"

[dependencies]
# Public workspace dependencies
harpc-client              = { workspace = true, public = true }
harpc-server              = { workspace = true, public = true }
hash-graph-authentication = { workspace = true, public = true }
hash-graph-authorization  = { workspace = true, public = true }
hash-graph-embeddings     = { workspace = true, public = true }
hash-graph-postgres-store = { workspace = true, public = true, features = ["utoipa"] }
hash-graph-type-fetcher   = { workspace = true, public = true }
hash-graph-types          = { workspace = true, public = true, features = ["utoipa"] }
hash-middleware           = { workspace = true, public = true, features = ["aide"] }
hash-status               = { workspace = true, public = true }
hash-temporal-client      = { workspace = true, public = true }

# Public third-party dependencies
axum            = { workspace = true, public = true }
axum-core       = { workspace = true, public = true }
futures-channel = { workspace = true, public = true }
hashql-core     = { workspace = true, public = true }
http            = { workspace = true, public = true }
jsonwebtoken    = { workspace = true, public = true, features = ["aws_lc_rs"] }
opentelemetry   = { workspace = true, public = true, features = ["metrics"] }
tower-http      = { workspace = true, public = true }
tracing         = { workspace = true, public = true }

# Private workspace dependencies
harpc-codec                    = { workspace = true }
harpc-system                   = { workspace = true }
harpc-tower                    = { workspace = true }
harpc-types                    = { workspace = true }
hash-codec                     = { workspace = true, features = ["numeric", "utoipa"] }
hash-graph-store               = { workspace = true, features = ["utoipa"] }
hash-graph-temporal-versioning = { workspace = true }
hash-graph-validation          = { workspace = true }
hashql-ast                     = { workspace = true }
hashql-diagnostics             = { workspace = true, features = ["serde", "render"] }
hashql-eval                    = { workspace = true }
hashql-hir                     = { workspace = true }
hashql-mir                     = { workspace = true }
hashql-syntax-jexpr            = { workspace = true }
problematic                    = { workspace = true, features = ["aide", "axum"] }
type-system                    = { workspace = true, features = ["schemars", "utoipa"] }

# Private third-party dependencies
aide                 = { workspace = true, features = ["axum", "axum-json", "axum-query"] }
base16ct             = { workspace = true }
bytes                = { workspace = true }
clap                 = { workspace = true, optional = true, features = ["derive", "env"] }
convert_case         = { workspace = true }
derive-where         = { workspace = true }
derive_more          = { workspace = true, features = ["display", "error"] }
error-stack          = { workspace = true, features = ["futures", "spantrace", "unstable"] }
frunk                = { workspace = true }
futures              = { workspace = true }
hyper                = { workspace = true }
include_dir          = { workspace = true }
indexmap             = { workspace = true }
md-5                 = { workspace = true }
mime                 = { workspace = true }
reqwest              = { workspace = true }
scalar_api_reference = { workspace = true }
schemars             = { workspace = true, features = ["uuid1"] }
sentry               = { workspace = true }
serde                = { workspace = true, features = ['derive'] }
serde_json           = { workspace = true, features = ["raw_value"] }
simple-mermaid       = { workspace = true }
time                 = { workspace = true }
tokio                = { workspace = true, features = ["rt", "time"] }
tokio-util           = { workspace = true, features = ["codec", "io"] }
tower                = { workspace = true }
utoipa               = { workspace = true }
uuid                 = { workspace = true }

[dev-dependencies]
hash-graph-authentication = { workspace = true, features = ["test-utils"] }
hash-middleware           = { workspace = true, features = ["test-utils"] }
insta                     = { workspace = true }
tokio                     = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower                     = { workspace = true, features = ["util"] }
uuid                      = { workspace = true, features = ["v4"] }

[features]
clap                 = ["dep:clap", "hash-middleware/clap"]
unsafe-dev-endpoints = []

[lints]
workspace = true
