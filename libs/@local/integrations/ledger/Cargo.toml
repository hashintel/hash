[package]
name              = "hash-integrations-ledger"
description       = "Keeps the state of an integration's ledger pipeline in S3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies
error-stack                  = { workspace = true, public = true, features = ["std"] }
hash-crypto                  = { workspace = true, public = true }
hash-integrations-definition = { workspace = true, public = true }
type-system                  = { workspace = true, public = true }

# Public third-party dependencies
time = { workspace = true, public = true, features = ["formatting", "macros", "parsing", "serde"] }
url  = { workspace = true, public = true }
uuid = { workspace = true, public = true, features = ["serde", "v4", "v5"] }

# Private workspace dependencies
hash-codec      = { workspace = true, features = ["numeric"] }
hash-middleware = { workspace = true }

# Private third-party dependencies
buoyant_kernel        = { workspace = true }
buoyant_kernel_engine = { workspace = true, features = ["arrow-60", "rustls"] }
bytes                 = { workspace = true }
deltalake-core        = { workspace = true, features = ["rustls"] }
derive_more           = { workspace = true, features = ["display", "error", "from", "into"] }
duckdb                = { workspace = true, features = ["bundled", "json", "parquet"] }
futures-util          = { workspace = true }
hex                   = { workspace = true, features = ["alloc"] }
object_store          = { workspace = true, features = ["aws"] }
parquet               = { workspace = true, features = ["arrow"] }
reqwest               = { workspace = true }
serde                 = { workspace = true, features = ["alloc", "derive"] }
serde_arrow           = { workspace = true, features = ["arrow-60"] }
serde_json            = { workspace = true, features = ["float_roundtrip", "raw_value"] }
simple-mermaid        = { workspace = true }
tempfile              = { workspace = true }
tokio                 = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tracing               = { workspace = true, features = ["attributes"] }

[dev-dependencies]
hash-graph-store = { workspace = true }

# Writes Delta tables with their change data feed on in tests; the ledger itself only reads them.
deltalake-core = { workspace = true, features = ["datafusion", "rustls"] }

arrow-array            = { workspace = true }
axum                   = { workspace = true, features = ["http1", "tokio"] }
insta                  = { workspace = true }
pretty_assertions      = { workspace = true }
proptest               = { workspace = true, features = ["attr-macro", "std"] }
rstest                 = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true, features = ["minio"] }
tokio                  = { workspace = true, features = ["macros", "net", "rt"] }

[lints]
workspace = true
