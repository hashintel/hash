[package]
name              = "hash-integrations-engine"
description       = "Runs integration pipelines in DuckDB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies
error-stack                  = { workspace = true, public = true, features = ["std"] }
hash-crypto                  = { workspace = true, public = true }
hash-integrations-definition = { workspace = true, public = true }
type-system                  = { workspace = true, public = true }

# Public third-party dependencies
duckdb   = { workspace = true, public = true, features = ["appender-arrow", "bundled", "json"] }
serde    = { workspace = true, public = true, features = ["derive"] }
tempfile = { workspace = true, public = true }
uuid     = { workspace = true, public = true, features = ["v4", "v5"] }

# Private workspace dependencies
hash-graph-store = { workspace = true }
hash-middleware  = { workspace = true }

# Private third-party dependencies
arrow-array    = { workspace = true }
backon         = { workspace = true, features = ["std", "tokio-sleep"] }
bytes          = { workspace = true }
derive_more    = { workspace = true, features = ["display", "error"] }
futures-util   = { workspace = true }
object_store   = { workspace = true, features = ["aws", "fs"] }
opentelemetry  = { workspace = true, features = ["metrics"] }
parquet        = { workspace = true, features = ["arrow", "snap"] }
reqwest        = { workspace = true }
serde_json     = { workspace = true, features = ["raw_value"] }
simple-mermaid = { workspace = true }
time           = { workspace = true, features = ["parsing"] }
tokio          = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tracing        = { workspace = true, features = ["attributes"] }
url            = { workspace = true }
zeroize        = { workspace = true }

[dev-dependencies]
hash-graph-temporal-versioning = { workspace = true }

axum                   = { workspace = true, features = ["http1", "tokio"] }
opentelemetry_sdk      = { workspace = true, features = ["metrics", "testing"] }
pretty_assertions      = { workspace = true }
proptest               = { workspace = true, features = ["attr-macro", "std"] }
rstest                 = { workspace = true }
serde                  = { workspace = true, features = ["derive"] }
tempfile               = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true, features = ["minio", "postgres"] }
tokio                  = { workspace = true, features = ["io-util", "macros", "rt", "test-util", "time"] }

[lints]
workspace = true
