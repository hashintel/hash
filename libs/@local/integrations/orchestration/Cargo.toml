[package]
name              = "hash-integrations-orchestration"
description       = "Runs integrations as sequences of durable steps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies
error-stack = { workspace = true, public = true, features = ["std"] }

# Public third-party dependencies
serde      = { workspace = true, public = true, features = ["derive"] }
serde_core = { workspace = true, public = true }
serde_json = { workspace = true, public = true, features = ["raw_value"] }
time       = { workspace = true, public = true }
tokio-util = { workspace = true, public = true }

# Private workspace dependencies

# Private third-party dependencies
backon         = { workspace = true }
dbos           = { workspace = true, optional = true }
derive_more    = { workspace = true, features = ["as_ref", "display", "error"] }
reqwest        = { workspace = true, optional = true }
restate-sdk    = { workspace = true, optional = true, features = ["http_server"] }
simple-mermaid = { workspace = true }
tokio          = { workspace = true, optional = true, features = ["rt"] }
tokio-postgres = { workspace = true, optional = true, features = ["runtime"] }
tracing        = { workspace = true, optional = true }
uuid           = { workspace = true, optional = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
proptest          = { workspace = true, features = ["attr-macro", "std"] }
proptest-derive   = { workspace = true }
reqwest           = { workspace = true }
rstest            = { workspace = true }
time              = { workspace = true, features = ["macros"] }
tokio             = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid              = { workspace = true, features = ["std", "v4"] }

[features]
dbos    = ["dep:dbos", "dep:tokio", "dep:tokio-postgres", "dep:tracing", "dep:uuid"]
restate = ["dep:reqwest", "dep:restate-sdk", "dep:tokio", "dep:tracing", "tokio/macros", "tokio/net", "tokio/sync"]

[lints]
workspace = true

[[test]]
name              = "dbos"
required-features = ["dbos"]

[[test]]
name              = "restate"
required-features = ["restate"]
