[project]
name            = "hash-integrations-collect"
version         = "0.1.0"
description     = "Collects the tables of an integration's source with dlt into the Delta tables the ledger captures from"
readme          = "README.md"
requires-python = "<3.15,>=3.14.10"
license         = "AGPL-3.0-only"
dependencies    = [
    "dlt[deltalake,filesystem,s3]>=1.30.0,<2",
]
authors         = [
    { name = "HASH" },
]

[project.scripts]
hash-integrations-collect = "hash_integrations_collect.cli:main"

[build-system]
requires      = ["uv_build<0.13.0,>=0.12.16"]
build-backend = "uv_build"

[dependency-groups]
dev = ["deptry<0.26,>=0.25.1", "pytest>=9.1.1,<10", "ruff<0.17,>=0.16.8", "tach<0.36,>=0.35", "ty<0.0.85,>=0.0.84"]

[tool.tach]
source_roots                 = ["src"]
exclude                      = []
exact                        = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
root_module                  = "forbid"

[[tool.tach.modules]]
path       = "hash_integrations_collect"
depends_on = []

[tool.tach.rules]
require_ignore_directive_reasons = "error"
unused_ignore_directives         = "error"
