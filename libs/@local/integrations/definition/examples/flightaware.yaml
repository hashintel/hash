# Loads FlightAware AeroAPI arrivals at Heathrow into flights, airports and airlines, and links
# each flight to the airports it takes off from and lands at and to the airline that operates it.
connector: flightaware

vars:
  HASH: https://hash.ai/@h/types
  BLOCKPROTOCOL: https://blockprotocol.org/@blockprotocol/types

sources:
  arrivals:
    primaryKey: [fa_flight_id]
    coverage: partial
    sql: |
      SELECT * FROM (VALUES
        (
          'BAW115-1715000000-schedule-0001', 'BA115', 'BAW115', 'Airline',
          '{"code_icao": "KJFK", "name": "John F Kennedy Intl", "code_iata": "JFK", "timezone": "America/New_York", "city": "New York"}'::JSON,
          '{"code_icao": "EGLL", "name": "Heathrow", "code_iata": "LHR", "timezone": "Europe/London", "city": "London"}'::JSON,
          'BAW', 'BA', 'British Airways',
          false, false,
          'A10', 'T5', 'A10', NULL,
          '2024-05-06T22:00:00Z', '2024-05-06T22:05:00Z', '2024-05-06T22:10:00Z', '2024-05-06T22:15:00Z',
          'B22', 'T5', 'B22', '5',
          120, -300,
          '2024-05-07T06:00:00Z', '2024-05-07T05:55:00Z', '2024-05-07T06:05:00Z', '2024-05-07T06:00:00Z'
        ),
        (
          'DLH901-1715000000-schedule-0002', 'LH901', 'DLH901', 'Airline',
          '{"code_icao": "EDDF", "name": "Frankfurt am Main", "code_iata": "FRA", "timezone": "Europe/Berlin", "city": "Frankfurt"}'::JSON,
          '{"code_icao": "EGLL", "name": "Heathrow", "code_iata": "LHR", "timezone": "Europe/London", "city": "London"}'::JSON,
          'DLH', 'LH', 'Lufthansa',
          false, false,
          NULL, 'T1', NULL, NULL,
          '2024-05-07T07:00:00Z', '2024-05-07T07:10:00Z', '2024-05-07T07:15:00Z', NULL,
          'C15', 'T2', NULL, '7',
          NULL, 600,
          '2024-05-07T08:30:00Z', '2024-05-07T08:40:00Z', '2024-05-07T08:35:00Z', NULL
        ),
        (
          'UAE5-1715000000-schedule-0003', 'EK5', 'UAE5', 'Airline',
          '{"code_icao": "OMDB", "name": "Dubai Intl", "code_iata": "DXB", "timezone": "Asia/Dubai", "city": "Dubai"}'::JSON,
          '{"code_icao": "EGLL", "name": "Heathrow", "code_iata": "LHR", "timezone": "Europe/London", "city": "London"}'::JSON,
          'UAE', 'EK', 'Emirates',
          true, false,
          NULL, NULL, NULL, NULL,
          '2024-05-07T09:00:00Z', NULL, NULL, NULL,
          NULL, NULL, NULL, NULL,
          NULL, NULL,
          '2024-05-07T14:00:00Z', NULL, NULL, NULL
        )
      ) AS t(
        fa_flight_id, ident_iata, ident_icao, type,
        origin, destination,
        operator_icao, operator_iata, operator,
        cancelled, diverted,
        gate_origin, terminal_origin, actual_runway_off, departure_delay,
        scheduled_out, actual_out, scheduled_off, actual_off,
        gate_destination, terminal_destination, actual_runway_on, baggage_claim,
        arrival_delay, departure_delay_secs,
        scheduled_in, actual_in, scheduled_on, actual_on
      )

pipelines:
  entities:
    - source: arrivals
      steps:
        - id: cleanup
          sql: >
            SELECT * FROM input WHERE ident_iata IS NOT NULL AND fa_flight_id IS NOT NULL

        - id: extract
          branches:
            - - id: norm-airports
                sql: |
                  SELECT DISTINCT ON (icaoCode)
                    _op, _key, icaoCode, name, iataCode, timezone, city
                  FROM (
                    SELECT _op, _key,
                      origin->>'code_icao' AS icaoCode,
                      origin->>'name' AS name,
                      origin->>'code_iata' AS iataCode,
                      origin->>'timezone' AS timezone,
                      origin->>'city' AS city
                    FROM input WHERE origin->>'code_icao' IS NOT NULL
                    UNION ALL
                    SELECT _op, _key,
                      destination->>'code_icao' AS icaoCode,
                      destination->>'name' AS name,
                      destination->>'code_iata' AS iataCode,
                      destination->>'timezone' AS timezone,
                      destination->>'city' AS city
                    FROM input WHERE destination->>'code_icao' IS NOT NULL
                  ) airports

              - id: write-airports
                sink:
                  entityType: ${HASH}/entity-type/airport/v/1
                  entityId: icaoCode
                  properties:
                    ${BLOCKPROTOCOL}/property-type/name/v/1: name
                    ${HASH}/property-type/icao-code/v/1: icaoCode
                    ${HASH}/property-type/iata-code/v/1: iataCode
                    ${HASH}/property-type/timezone/v/1: timezone
                    ${HASH}/property-type/city/v/1: city

            - - id: norm-airlines
                sql: |
                  SELECT DISTINCT ON (icaoCode) _op, _key, icaoCode, iataCode, name
                  FROM (
                    SELECT _op, _key,
                      operator_icao AS icaoCode,
                      operator_iata AS iataCode,
                      COALESCE(operator, operator_icao, operator_iata) AS name
                    FROM input WHERE operator_icao IS NOT NULL
                  ) airlines

              - id: write-airlines
                sink:
                  entityType: ${HASH}/entity-type/airline/v/1
                  entityId: icaoCode
                  properties:
                    ${BLOCKPROTOCOL}/property-type/name/v/1: name
                    ${HASH}/property-type/icao-code/v/1: icaoCode
                    ${HASH}/property-type/iata-code/v/1: iataCode

            - - id: norm-flights
                sql: |
                  SELECT
                    _op, _key,
                    fa_flight_id AS flightId,
                    ident_iata AS flightNumber,
                    ident_icao AS icaoCode,
                    ident_iata AS iataCode,
                    type AS flightType,
                    CASE
                      WHEN cancelled THEN 'Cancelled'
                      WHEN diverted THEN 'Diverted'
                      WHEN actual_on IS NOT NULL THEN 'Landed'
                      WHEN actual_off IS NOT NULL OR actual_out IS NOT NULL THEN 'Active'
                      ELSE 'Scheduled'
                    END AS flightStatus,
                    COALESCE(
                      scheduled_out, scheduled_off,
                      actual_out, actual_off, scheduled_in, scheduled_on
                    )::DATE::VARCHAR AS flightDate,
                    origin->>'code_icao' AS originIcao,
                    destination->>'code_icao' AS destIcao,
                    operator_icao AS airlineIcao,
                    gate_origin AS departGate,
                    terminal_origin AS departTerminal,
                    actual_runway_off AS departRunway,
                    departure_delay AS departDelay,
                    scheduled_out AS departSchedGate,
                    actual_out AS departActGate,
                    scheduled_off AS departSchedRunway,
                    actual_off AS departActRunway,
                    gate_destination AS arriveGate,
                    terminal_destination AS arriveTerminal,
                    actual_runway_on AS arriveRunway,
                    baggage_claim AS arriveBaggage,
                    arrival_delay AS arriveDelay,
                    scheduled_in AS arriveSchedGate,
                    actual_in AS arriveActGate,
                    scheduled_on AS arriveSchedRunway,
                    actual_on AS arriveActRunway
                  FROM input

              - id: write-flights
                sink:
                  entityType: ${HASH}/entity-type/flight/v/1
                  entityId: flightId
                  properties:
                    ${HASH}/property-type/flight-number/v/1: flightNumber
                    ${HASH}/property-type/icao-code/v/1: icaoCode
                    ${HASH}/property-type/iata-code/v/1: iataCode
                    ${HASH}/property-type/flight-type/v/1: flightType
                    ${HASH}/property-type/flight-status/v/1: flightStatus
                    ${HASH}/property-type/flight-date/v/1: flightDate

              - id: save-flights
                checkpoint: flightaware/flights

  links:
    - id: flight-takes-off-from
      checkpoint: flightaware/flights
      steps:
        - id: with-origin
          sql: SELECT * FROM input WHERE originIcao IS NOT NULL
      from: { entityType: "${HASH}/entity-type/flight/v/1", column: flightId }
      to: { entityType: "${HASH}/entity-type/airport/v/1", column: originIcao }
      linkType: ${HASH}/entity-type/takes-off-from/v/1
      properties:
        ${HASH}/property-type/gate/v/1: departGate
        ${HASH}/property-type/terminal/v/1: departTerminal
        ${HASH}/property-type/runway/v/1: departRunway
        ${HASH}/property-type/delay-in-seconds/v/1: departDelay
        ${HASH}/property-type/scheduled-gate-time/v/1: departSchedGate
        ${HASH}/property-type/actual-gate-time/v/1: departActGate
        ${HASH}/property-type/scheduled-runway-time/v/1: departSchedRunway
        ${HASH}/property-type/actual-runway-time/v/1: departActRunway

    - id: flight-lands-at
      checkpoint: flightaware/flights
      steps:
        - id: with-destination
          sql: SELECT * FROM input WHERE destIcao IS NOT NULL
      from: { entityType: "${HASH}/entity-type/flight/v/1", column: flightId }
      to: { entityType: "${HASH}/entity-type/airport/v/1", column: destIcao }
      linkType: ${HASH}/entity-type/lands-at/v/1
      properties:
        ${HASH}/property-type/gate/v/1: arriveGate
        ${HASH}/property-type/terminal/v/1: arriveTerminal
        ${HASH}/property-type/runway/v/1: arriveRunway
        ${HASH}/property-type/baggage-claim/v/1: arriveBaggage
        ${HASH}/property-type/delay-in-seconds/v/1: arriveDelay
        ${HASH}/property-type/scheduled-gate-time/v/1: arriveSchedGate
        ${HASH}/property-type/actual-gate-time/v/1: arriveActGate
        ${HASH}/property-type/scheduled-runway-time/v/1: arriveSchedRunway
        ${HASH}/property-type/actual-runway-time/v/1: arriveActRunway

    - id: flight-operated-by
      checkpoint: flightaware/flights
      steps:
        - id: with-airline
          sql: SELECT * FROM input WHERE airlineIcao IS NOT NULL
      from: { entityType: "${HASH}/entity-type/flight/v/1", column: flightId }
      to: { entityType: "${HASH}/entity-type/airline/v/1", column: airlineIcao }
      linkType: ${HASH}/entity-type/operated-by/v/1
