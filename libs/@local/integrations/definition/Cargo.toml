[package]
name              = "hash-integrations-definition"
description       = "The checked model of an integration definition"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies
error-stack = { workspace = true, public = true, features = ["unstable"] }
type-system = { workspace = true, public = true }

# Public third-party dependencies
url  = { workspace = true, public = true, features = ["serde"] }
uuid = { workspace = true, public = true, features = ["serde"] }

# Private workspace dependencies

# Private third-party dependencies
derive_more    = { workspace = true, features = ["as_ref", "display", "error"] }
serde          = { workspace = true, features = ["alloc", "derive"] }
serde-saphyr   = { workspace = true }
simple-mermaid = { workspace = true }

[dev-dependencies]
insta           = { workspace = true, features = ["glob"] }
proptest        = { workspace = true, features = ["attr-macro", "std"] }
proptest-derive = { workspace = true }

[lints]
workspace = true
