connector: demo
vars:
  HOST: warehouse.example.org
  DATABASE: postgresql://database.example.org/demo
  API: https://api.example.org/items
sources:
  local:
    local: data/items.parquet
    primaryKey: [id]
  warehouse:
    redshift:
      connection: postgresql://${HOST}:5439/demo?sslmode=require
      schema: public
      table: items
      credentials:
        secretEntityUuid: 22222222-2222-4222-8222-222222222222
    primaryKey: [id]
  database:
    postgres:
      connection: ${DATABASE}
      schema: public
      table: items
      credentials:
        secretEntityUuid: 22222222-2222-4222-8222-222222222222
    primaryKey: [id]
  api:
    rest:
      url: ${API}
      resultsField: data.items
      pagination:
        type: next-link
        field: pagination.next
      auth:
        type: bearer
        secretEntityUuid: 22222222-2222-4222-8222-222222222222
      rateLimitMs: 100
      maxPages: 50
    primaryKey: [id]
pipelines:
  entities:
    - source: local
      steps: []
    - source: database
      steps: []
    - source: warehouse
      steps: []
    - source: api
      steps: []
