[package]
name              = "hash-integrations-pipeline"
description       = "Runs checkpointed integration ingestion pipelines"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
# Public workspace dependencies
error-stack                  = { workspace = true, public = true, features = ["std"] }
hash-crypto                  = { workspace = true, public = true }
hash-integrations-definition = { workspace = true, public = true }
type-system                  = { workspace = true, public = true }

# Public third-party dependencies
duckdb   = { workspace = true, public = true, features = ["appender-arrow", "bundled", "json"] }
serde    = { workspace = true, public = true, features = ["derive"] }
time     = { workspace = true, public = true, features = ["std", "formatting", "macros", "parsing", "serde"] }
uuid     = { workspace = true, public = true, features = ["v4", "v5", "serde"] }

# Private workspace dependencies

# Private third-party dependencies
arrow-array    = { workspace = true }
bytes          = { workspace = true }
derive_more    = { workspace = true, features = ["display", "error", "from", "into"] }
futures-util   = { workspace = true }
hex            = { workspace = true, features = ["alloc", "serde"] }
object_store   = { workspace = true, features = ["aws", "fs"] }
opentelemetry  = { workspace = true, features = ["metrics"] }
parquet        = { workspace = true, features = ["arrow", "snap"] }
tempfile       = { workspace = true }
serde_json     = { workspace = true, features = ["raw_value"] }
tokio          = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tracing        = { workspace = true, features = ["attributes"] }

[dev-dependencies]

opentelemetry_sdk      = { workspace = true, features = ["metrics", "testing"] }
pretty_assertions      = { workspace = true }
similar-asserts         = { workspace = true }
proptest               = { workspace = true, features = ["attr-macro", "std"] }
rstest                 = { workspace = true }
serde                  = { workspace = true, features = ["derive"] }
tempfile               = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true, features = ["minio"] }
tokio                  = { workspace = true, features = ["io-util", "macros", "rt", "test-util", "time"] }

[lints]
workspace = true
