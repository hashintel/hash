[project]
name = "petrinaut-python"
version = "0.1.0"
description = "Python bindings for the Petrinaut CLI: run simulations and optimization studies from Python"
readme = "README.md"
requires-python = "<3.15,>=3.14"
license = "MIT or Apache-2.0"
dependencies = [
    "pydantic<3.0.0,>=2.13.4",
]
authors = [
    { name = "HASH" },
]

[project.optional-dependencies]
sympy = [
    "sympy<2.0.0,>=1.13",
]


[build-system]
requires      = ["uv_build<0.13.0,>=0.12.16"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator<0.83.0,>=0.82.0",
    "deptry<0.26,>=0.25.1",
    "pytest>=9.1.1,<10",
    "ruff<0.17,>=0.16.8",
    "sympy<2.0.0,>=1.13",
    "tach<0.36,>=0.35",
    "ty<0.0.85,>=0.0.84",
]

[tool.uv.build-backend]
module-name = "petrinaut"

[tool.tach]
source_roots                 = ["src"]
exclude                      = []
exact                        = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
root_module                  = "forbid"

[[tool.tach.modules]]
path       = "petrinaut"
depends_on = []

[tool.tach.rules]
require_ignore_directive_reasons = "error"
unused_ignore_directives         = "error"
