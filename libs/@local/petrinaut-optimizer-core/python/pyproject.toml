[project]
name = "petrinaut-optimizer-core"
version = "0.1.0"
description = "Optuna study construction, suggestion and ask/tell loop for the Petrinaut optimizer service, written to load under Pyodide"
readme = "README.md"
requires-python = "<3.15,>=3.14"
license = "MIT or Apache-2.0"
dependencies = [
    "optuna>=4.9,<5",
]
authors = [
    { name = "HASH" },
]


[build-system]
requires      = ["uv_build<0.13.0,>=0.12.16"]
build-backend = "uv_build"
[dependency-groups]
dev = ["deptry<0.26,>=0.25.1", "pytest>=9.1.1,<10", "pytest-asyncio>=1.4,<2", "ruff<0.17,>=0.16.8", "tach<0.36,>=0.35", "ty<0.0.83,>=0.0.82"]


[tool.tach]
source_roots                 = ["src"]
exclude                      = []
exact                        = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
root_module                  = "forbid"

[[tool.tach.modules]]
path       = "petrinaut_optimizer_core"
depends_on = []

[tool.tach.rules]
require_ignore_directive_reasons = "error"
unused_ignore_directives         = "error"
