[project]
name = "repo-chores"
version = "0.1.0"
description = "Check and repair Python workspace policies"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "HASH" },
]
requires-python = "<3.15,>=3.14"
dependencies = [
    "json-five==1.1.2",
    "license-expression>=30.4.4,<31.0.0",
    "packaging>=26.3,<27.0",
    "rich>=15.0.0,<16.0.0",
    "ruff>=0.16.8,<0.17",
    "tomlkit>=0.15.1,<0.16.0",
]

[project.scripts]
repo-chores = "repo_chores.__main__:main"

[build-system]
requires      = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["deptry<0.26,>=0.25.1", "pytest<10,>=9.1.1", "ruff<0.17,>=0.16.8", "tach<0.36,>=0.35", "ty<0.0.83,>=0.0.82"]

[tool.ruff]
extend = "../../../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
# Native TOML adapters preserve comments and entry identity through tomlkit internals.
"src/repo_chores/constraints/_engine/document.py"        = ["import-private-name", "private-member-access"]
"src/repo_chores/constraints/_engine/document_native.py" = ["import-private-name", "private-member-access"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.tach]
source_roots                 = ["src"]
exclude                      = []
exact                        = true
forbid_circular_dependencies = true
ignore_type_checking_imports = false
root_module                  = "forbid"

[[tool.tach.modules]]
path       = "repo_chores"
depends_on = ["repo_chores.constraints"]

[[tool.tach.modules]]
path       = "repo_chores.constraints"
depends_on = ["repo_chores.constraints._engine"]

[[tool.tach.modules]]
path       = "repo_chores.constraints._engine"
depends_on = []

[tool.tach.rules]
require_ignore_directive_reasons = "error"
unused_ignore_directives         = "error"
