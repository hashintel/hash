[project]
name            = "hash-repo-chores"
version         = "0.0.0"
description     = "Keeps the boring parts of the Python workspace correct: membership, version bounds, and turbo wiring"
requires-python = ">=3.14,<3.15"
dependencies = [
    "packaging>=25",
    "tomlkit>=0.13",
]

[project.scripts]
repo-chores = "repo_chores.cli:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo_chores"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.21",
]
