[package]
authors.workspace = true
description       = "Problem details (RFC 9457) for the errors of an HTTP API, with the public and the internal errors of every endpoint kept apart by the compiler"
documentation     = "https://docs.rs/problematic"
edition.workspace = true
exclude           = ["turbo.json", "docs/task-dependencies.json"]
license           = "MIT OR Apache-2.0"
name              = "problematic"
repository        = "https://github.com/hashintel/hash/tree/main/libs/problematic/rust"
version           = "0.0.0"

[dependencies]
# Public workspace dependencies

# Public third-party dependencies
http       = { workspace = true, public = true }
schemars   = { workspace = true, public = true }
serde_core = { workspace = true, public = true }

# Public third-party dependencies (optional)
aide      = { workspace = true, public = true, optional = true }
axum-core = { workspace = true, public = true, optional = true }

# Private workspace dependencies

# Private third-party dependencies
erased-serde = { workspace = true, features = ["alloc"] }
serde        = { workspace = true, features = ["alloc", "derive"] }
serde_json   = { workspace = true, features = ["alloc"] }
tracing      = { workspace = true }

[dev-dependencies]
aide        = { workspace = true, features = ["axum"] }
axum        = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
insta       = { workspace = true, features = ["json"] }
serde_json  = { workspace = true, features = ["arbitrary_precision"] }

[[test]]
name              = "aide"
required-features = ["aide"]

[features]
aide = ["dep:aide"]
axum = ["dep:axum-core"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
cargo-args   = ["-Z", "unstable-options", "-Z", "rustdoc-scrape-examples"]
targets      = ["x86_64-unknown-linux-gnu"]
