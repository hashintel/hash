$schema: https://json.schemastore.org/lefthook.json

ai:
  claude:
    Stop: format
  codex:
    Stop: format
  cursor:
    stop: format

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    markdownlint: &markdownlint
      tags: [frontend, style]
      glob: "*.md"
      run: markdownlint-cli2 --fix --no-globs {staged_files} || true
      stage_fixed: true
    oxfmt: &oxfmt
      tags: [frontend, style]
      glob: "*.{cjs,css,js,json,md,mdx,mjs,scss,ts,tsx,yml}"
      run: oxfmt --write {staged_files} || true
      stage_fixed: true
    yarn:
      tags: [frontend, style]
      glob: "{*/package.json, package.json}"
      run: yarn fix:constraints && yarn fix:yarn-deduplicate
      stage_fixed: true
    task-dependencies:
      tags: [backend]
      glob: "{turbo.json,**/turbo.json,package.json,**/package.json,Cargo.toml,**/Cargo.toml}"
      # The documents are not among the staged files the command is given, so `stage_fixed` would not pick them up.
      run: turbo run //#doc:task-dependencies && git add -- ':(glob)**/docs/task-dependencies.json'
    sqlfluff:
      tags: [backend, style]
      glob: "*.sql"
      run: sqlfluff fix {staged_files} || true
      stage_fixed: true
    rust: &rust
      tags: [backend, style]
      glob: "*.rs"
      run: rustfmt {staged_files} || true
      stage_fixed: true
    toml: &toml
      tags: [backend, style]
      glob: "*.toml"
      run: taplo format {staged_files} || true
      stage_fixed: true

# Opt out with `format: {skip: true}` in `lefthook-local.yml`; pre-commit keeps running.
format:
  # Avoids markdownlint and oxfmt writing the same Markdown file at once.
  parallel: false
  skip:
    - merge
    - rebase
  # Agent edits are not staged, so `{staged_files}` would miss them.
  files: git diff --name-only --diff-filter=d HEAD && git ls-files --others --exclude-standard
  commands:
    markdownlint:
      <<: *markdownlint
      run: markdownlint-cli2 --fix --no-globs {files} || true
    oxfmt:
      <<: *oxfmt
      run: oxfmt --write {files} || true
    rust:
      <<: *rust
      run: rustfmt {files} || true
    toml:
      <<: *toml
      run: taplo format {files} || true
