$schema: https://json.schemastore.org/lefthook.json

ai:
  claude:
    Stop: format
  codex:
    Stop: format
  cursor:
    stop: format

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    markdownlint:
      tags: [frontend, style, format]
      glob: "*.md"
      run: markdownlint-cli2 --fix --no-globs {staged_files} || true
      stage_fixed: true
    oxfmt:
      tags: [frontend, style, format]
      glob: "*.{cjs,css,js,json,md,mdx,mjs,scss,ts,tsx,yml}"
      run: oxfmt --write {staged_files} || true
      stage_fixed: true
    yarn:
      tags: [frontend, style]
      glob: "{*/package.json, package.json}"
      run: yarn fix:constraints && yarn fix:yarn-deduplicate
      stage_fixed: true
    task-dependencies:
      tags: [backend]
      glob: "{turbo.json,**/turbo.json,package.json,**/package.json,Cargo.toml,**/Cargo.toml}"
      # The documents are not among the staged files the command is given, so `stage_fixed` would not pick them up.
      run: turbo run //#doc:task-dependencies && git add -- ':(glob)**/docs/task-dependencies.json'
    sqlfluff:
      tags: [backend, style]
      glob: "*.sql"
      run: sqlfluff fix {staged_files} || true
      stage_fixed: true
    rust:
      tags: [backend, style, format]
      glob: "*.rs"
      run: rustfmt {staged_files} || true
      stage_fixed: true
    toml:
      tags: [backend, style, format]
      glob: "*.toml"
      run: taplo format {staged_files} || true
      stage_fixed: true

format:
  jobs:
    # Agent edits are not staged, so the pre-commit formatters get the modified and untracked files instead.
    - name: format
      run: >-
        { git diff -z --name-only --diff-filter=d HEAD; git ls-files -z --others --exclude-standard; }
        | lefthook run pre-commit --tag format --files-from-stdin --no-stage-fixed
