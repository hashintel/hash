<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HASH · Entity Map</title>
    <style>
      :root {
        --bg: #0d0d12;
        --panel: rgba(20, 20, 28, 0.78);
        --border: rgba(255, 255, 255, 0.09);
        --text: #e9e9f1;
        --dim: rgba(233, 233, 241, 0.55);
        --accent: #6d8dff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      .panel {
        position: absolute;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 12.5px;
        line-height: 1.55;
        backdrop-filter: blur(10px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }

      #brand {
        top: 16px;
        left: 16px;
        padding: 12px 16px;
      }
      #brand h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      #brand h1::before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6d8dff, #b06dff);
        margin-right: 8px;
      }
      #brand .sub {
        color: var(--dim);
        font-size: 12px;
        margin-top: 2px;
      }
      #hud {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        font-size: 11.5px;
        margin-top: 8px;
      }
      #hud b {
        color: var(--text);
        font-weight: 600;
      }

      #legend {
        bottom: 16px;
        left: 16px;
        max-width: 300px;
      }
      #legend-rows {
        max-height: 38vh;
        overflow-y: auto;
        scrollbar-width: thin;
        margin-right: -6px;
        padding-right: 6px;
      }
      #legend .title {
        font-weight: 650;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      #legend .reset {
        color: var(--accent);
        cursor: pointer;
        font-size: 11px;
        display: none;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 2.5px 6px;
        margin: 0 -6px;
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition:
          opacity 120ms,
          background 120ms;
      }
      .legend-row:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .legend-row.off {
        opacity: 0.32;
      }
      .legend-row .count {
        color: var(--dim);
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: none;
      }

      #hint {
        bottom: 16px;
        right: 16px;
        color: var(--dim);
        font-size: 11.5px;
        text-align: right;
      }

      #alpha {
        display: none;
        left: 50%;
        transform: translateX(-50%);
        bottom: 16px;
        width: 320px;
        text-align: center;
      }
      #alpha .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #alpha input[type="range"] {
        flex: 1;
        accent-color: var(--accent);
      }
      #alpha .ends {
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-size: 10.5px;
        margin-top: 3px;
      }
      #alpha-value {
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        min-width: 52px;
        text-align: right;
      }

      #card {
        top: 16px;
        right: 16px;
        width: 260px;
        display: none;
      }
      #card .type {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 650;
        font-size: 13.5px;
      }
      #card .metrics {
        color: var(--dim);
        margin-top: 6px;
      }
      #card .metrics b {
        color: var(--text);
        font-weight: 600;
      }
      #card .dismiss {
        color: var(--dim);
        font-size: 11px;
        margin-top: 8px;
      }

      #tooltip {
        position: absolute;
        pointer-events: none;
        display: none;
        z-index: 10;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 12px;
        backdrop-filter: blur(10px);
      }
      #tooltip .t-dim {
        color: var(--dim);
        font-size: 11px;
      }

      #loading {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--bg);
        color: var(--text);
        transition: opacity 400ms;
      }
      #loading .logo {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      #loading .logo::before {
        content: "";
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6d8dff, #b06dff);
        margin-right: 10px;
      }
      #loading .bar {
        width: 260px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #loading .bar i {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 2px;
        background: linear-gradient(90deg, #6d8dff, #b06dff);
        transition: width 120ms;
      }
      #loading .status {
        color: var(--dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="brand" class="panel">
      <h1>HASH · Entity Map</h1>
      <div class="sub">every entity in the graph, on one map</div>
      <div id="hud"></div>
    </div>

    <div id="legend" class="panel">
      <div class="title">
        Entity types <span class="reset" id="legend-reset">reset</span>
      </div>
      <div id="legend-rows"></div>
    </div>

    <div id="hint" class="panel">
      scroll to zoom &nbsp;·&nbsp; drag to pan<br />click a node to see its
      connections<br />click a type to focus it<br />links fade in at deep zoom
    </div>

    <div id="alpha" class="panel">
      <div class="row">
        <input
          id="alpha-slider"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0"
        />
        <span id="alpha-value">α 1.00</span>
      </div>
      <div class="ends"><span>semantic</span><span>relational</span></div>
    </div>

    <div id="card" class="panel">
      <div class="type">
        <span class="swatch" id="card-swatch"></span
        ><span id="card-type"></span>
      </div>
      <div class="metrics" id="card-metrics"></div>
      <div class="dismiss">click anywhere else to dismiss</div>
    </div>

    <div id="tooltip"></div>

    <div id="loading">
      <div class="logo">HASH · Entity Map</div>
      <div class="bar"><i id="loading-fill"></i></div>
      <div class="status" id="loading-status">loading…</div>
    </div>

    <script src="https://unpkg.com/deck.gl@9.0.34/dist.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
