# Default engine roster for the layout gate battery.
#
# The engine interface is "a command that reads embeddings/edges and writes
# layout.npz". Placeholders ({python}, {embeddings}, {edges}, {labels},
# {out}, {seed}) are substituted per token after shlex splitting; commands
# run via subprocess without a shell. See atlas_tools/battery/engine_runner.py.
#
# umap_tuned tuning grid: n_neighbors {15, 30, 50} x min_dist {0.05, 0.1,
# 0.25} x metric {cosine}; n_neighbors=30, min_dist=0.1 selected on the
# smoke shapes for the best recall/persistence balance. Both umap baselines
# accept-and-ignore edges (umap_cli embeds the vectors only), so umap_tuned's
# command_no_edges is identical behavior and the noise differential
# trivially (and correctly) passes for it.
version: 1
engines:
  - name: pca2d
    command: "{python} -m atlas_tools.battery.engines.pca_cli --embeddings {embeddings} --out {out} --seed {seed}"
  - name: umap_tuned
    command: "{python} -m atlas_tools.battery.engines.umap_cli --embeddings {embeddings} --edges {edges} --out {out} --seed {seed} --n-neighbors 30 --min-dist 0.1 --metric cosine"
    command_no_edges: "{python} -m atlas_tools.battery.engines.umap_cli --embeddings {embeddings} --out {out} --seed {seed} --n-neighbors 30 --min-dist 0.1 --metric cosine"
  - name: umap_default
    command: "{python} -m atlas_tools.battery.engines.umap_cli --embeddings {embeddings} --out {out} --seed {seed} --n-neighbors 15 --min-dist 0.1 --metric cosine"
