# Schema-v4 vote-ladder panel template (the versioned judges.yaml).
#
# This is a TEMPLATE, not a frozen panel: run `relation qualify` against the
# pilot deck and gold export, record the pruning decision by editing the
# roster, then set `panel.frozen: true` with the documented floor and bump
# `panel.version`. `relation evaluate` refuses the corpus while the panel is
# unfrozen. Routes, names, parameters, and ZDR eligibility follow the
# factorial-pilot roster in config/eval/pilot.yaml (recovered 2026-07-14);
# rung assignments and cost tiers here are the post-pilot proposal.
#
# A (judge, framing) pair is one voter, and a voter votes on a card at most
# once (the cache key is card x judge x framing x rubric). Rungs are
# escalation waves of NEW voters: rung 1 screens every card with five cheap
# voters; a card that is not unanimously proximal/overlay escalates, at most
# twice, until the panel is exhausted. Coincident-leaning cards always run
# the full panel and join the review queue. Every rung must span >= 2 model
# families and >= 2 framings; the loader hard-errors otherwise. `effort`
# pins a judge's conditioning effort (defaults to baseline_effort).
schema_version: 4
mode: ladder
rubric_version: rubric-v1
shell: S1

panel:
  version: 1
  frozen: false
  pruning_floor: null

baseline_effort: minimal
# max_cost_usd, concurrency, and per_provider_concurrency are operational
# knobs: excluded from the request contract, retunable between resumed
# sessions of the same run.
max_cost_usd: null
per_provider_concurrency: 8
request_timeout: PT10M
transient_retries:
  maximum_attempts: 5
  initial_delay: PT2S
  maximum_delay: PT1M
  backoff_multiplier: 2.0
  retry_transport_errors: true
  status_codes: [408, 425, 429, 500, 502, 503, 504, 520, 522, 524]
concurrency:
  initial: 32
  maximum: 128
  ramp: doubling-v1

# The one permitted embedding endpoint (mocked in tests). max_texts caps only
# uncached texts; the by-hash cache makes reruns free.
embedding:
  endpoint_url: https://openrouter.ai/api/v1/embeddings
  model: openai/text-embedding-3-large
  api_key_env: OPENROUTER_API_KEY
  dimension: 3072
  batch_size: 64
  max_texts: 4096
  request_timeout: PT2M

classifier:
  folds: 5
  regularization: 1.0
  max_iterations: 1000
  seed: 0

report:
  coincident_precision_target: 0.98
  confidence_level: 0.95
  calibrated_threshold: 0.5
  calibration_bins: 10

judges:
  # Rung 1: the five-voter screen. Two families, all three framings; a
  # unanimous proximal/overlay verdict here settles the card at five votes.
  - provider_slug: google-vertex
    provider_name: Google
    openrouter_region: global
    model: google/gemini-3.5-flash
    temperature: 0.0
    seed: 42
    rung: 1
    cost_tier: economy
    framings: [F1, F2, F3]
    output_token_limit:
      parameter: max_tokens
      tokens: 4096

  - provider_slug: z-ai
    provider_name: Z.AI
    openrouter_region: global
    model: z-ai/glm-5.2
    temperature: 0.0
    seed: null
    rung: 1
    cost_tier: economy
    framings: [F1, F2]
    output_token_limit:
      parameter: max_tokens
      tokens: 4096

  # Rung 2: first escalation — mid-tier disagreement breakers.
  - provider_slug: amazon-bedrock
    provider_name: Amazon Bedrock
    openrouter_region: global
    model: anthropic/claude-sonnet-5
    temperature: null
    seed: null
    rung: 2
    cost_tier: standard
    framings: [F1, F3]
    output_token_limit:
      parameter: max_tokens
      tokens: 4096

  - provider_slug: azure
    provider_name: Azure
    openrouter_region: global
    model: openai/gpt-5.6-luna
    temperature: null
    seed: 42
    rung: 2
    cost_tier: standard
    framings: [F1, F2]
    output_token_limit:
      parameter: max_completion_tokens
      tokens: 4096

  - provider_slug: digitalocean
    provider_name: DigitalOcean
    openrouter_region: global
    model: deepseek/deepseek-v4-pro
    temperature: 0.0
    seed: null
    rung: 2
    cost_tier: standard
    framings: [F2, F3]
    output_token_limit:
      parameter: max_tokens
      tokens: 4096

  # Rung 3: second and final escalation — the expensive voters that
  # coincident-leaning and still-contested cards always reach.
  - provider_slug: amazon-bedrock
    provider_name: Amazon Bedrock
    openrouter_region: global
    model: anthropic/claude-opus-4.8
    temperature: null
    seed: null
    rung: 3
    cost_tier: premium
    effort: high
    framings: [F1, F3]
    output_token_limit:
      parameter: max_tokens
      tokens: 4096

  - provider_slug: azure
    provider_name: Azure
    openrouter_region: global
    model: openai/gpt-5.6-sol
    temperature: null
    seed: 42
    rung: 3
    cost_tier: premium
    effort: high
    framings: [F1, F2]
    output_token_limit:
      parameter: max_completion_tokens
      tokens: 4096

  - provider_slug: together
    provider_name: Together
    openrouter_region: global
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: null
    seed: null
    rung: 3
    cost_tier: premium
    framings: [F2, F3]
    output_token_limit:
      parameter: max_tokens
      tokens: 4096
