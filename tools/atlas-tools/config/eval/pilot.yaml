# Rubric-v1 factorial pilot judge roster recovered from git commit 16b87bd4b1.
# The ninth slot uses Mercury 2 after Mistral failed the retention requirement
# and Grok 4.5 was unavailable in-region. Routes, names, parameters, and ZDR
# eligibility were resolved from OpenRouter's JSON APIs on 2026-07-14.
schema_version: 3
mode: pilot
rubric_version: rubric-v1

sampling:
  algorithm: stratified-hash-v1
  seed: 42
  non_holdout_count: 144

baseline_effort: minimal
repeat_count: 1
request_timeout: PT10M
transient_retries:
  maximum_attempts: 5
  initial_delay: PT2S
  maximum_delay: PT1M
  backoff_multiplier: 2.0
  retry_transport_errors: true
  status_codes: [408, 425, 429, 500, 502, 503, 504, 520, 522, 524]
concurrency:
  initial: 1
  maximum: 18
  ramp: doubling-v1

judges:
  - provider_slug: amazon-bedrock
    provider_name: Amazon Bedrock
    openrouter_region: global
    model: anthropic/claude-opus-4.8
    temperature: null
    seed: null
    higher_effort: high
    output_token_limit:
      parameter: max_tokens
      tokens: 4096

