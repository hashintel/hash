<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>SALT swipe adjudicator</title>
    <style>
:root {
  color-scheme: dark;
  --color-bg: oklch(0.075 0 0);
  --color-surface-1: oklch(0.12 0.006 260);
  --color-surface-2: oklch(0.17 0.008 260);
  --color-surface-3: oklch(0.22 0.01 260);
  --color-border: oklch(0.31 0.012 260);
  --color-border-strong: oklch(0.43 0.018 260);
  --color-ink: oklch(0.93 0.008 260);
  --color-muted: oklch(0.72 0.014 260);
  --color-faint: oklch(0.58 0.014 260);
  --color-primary: oklch(0.69 0.14 260);
  --color-primary-fill: oklch(0.47 0.14 260);
  --color-focus: oklch(0.76 0.15 260);
  --color-coincident: oklch(0.78 0.13 180);
  --color-proximal: oklch(0.72 0.15 260);
  --color-overlay: oklch(0.8 0.14 80);
  --color-unclear: oklch(0.73 0.14 330);
  --color-danger: oklch(0.68 0.17 25);
  --color-warning: oklch(0.8 0.14 80);
  --color-success: oklch(0.78 0.13 180);
  --font-mono:
    ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo,
    Consolas, monospace;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --radius-xs: 0.125rem;
  --radius-sm: 0.25rem;
  --radius-md: 0.375rem;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --z-sticky: 20;
  --z-overlay: 40;
  --z-modal: 60;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 20rem;
  min-height: 100%;
  background: var(--color-bg);
  font-family: var(--font-mono);
  font-size: 100%;
  font-kerning: normal;
  font-variant-ligatures: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: inherit;
  line-height: 1.55;
  text-rendering: optimizeLegibility;
}

button,
input,
textarea,
select {
  color: inherit;
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 0.125rem solid var(--color-focus);
  outline-offset: 0.125rem;
}

a {
  color: var(--color-primary);
}

code,
kbd,
pre {
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}

kbd {
  display: inline-grid;
  min-width: 1.5rem;
  min-height: 1.5rem;
  place-items: center;
  padding: 0 var(--space-1);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-xs);
  background: var(--color-surface-1);
  color: var(--color-ink);
  font-size: 0.75rem;
  line-height: 1;
}

h1,
h2,
h3,
p {
  margin-block-start: 0;
}

h1,
h2,
h3 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

h1 {
  margin-block-end: var(--space-4);
  font-size: 1.75rem;
  line-height: 1.2;
}

h2 {
  margin-block-end: var(--space-3);
  font-size: 1.125rem;
  line-height: 1.3;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  inset-block-start: var(--space-2);
  inset-inline-start: var(--space-2);
  z-index: var(--z-modal);
  padding: var(--space-2) var(--space-3);
  transform: translateY(-200%);
  border: 1px solid var(--color-focus);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--color-ink);
}

.skip-link:focus {
  transform: translateY(0);
}

.system-label {
  margin-block-end: var(--space-2);
  color: var(--color-primary);
  font-size: 0.75rem;
  font-weight: 700;
}

.button,
.text-button,
.icon-text-button,
.public-header button,
.workspace-tabs button,
.swipe-actions button {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  color: var(--color-ink);
  transition:
    border-color 90ms var(--ease-out),
    background-color 90ms var(--ease-out),
    color 90ms var(--ease-out),
    transform 70ms var(--ease-out);
}

.button {
  min-height: 2.75rem;
  padding: var(--space-2) var(--space-4);
  font-size: 0.875rem;
  font-weight: 700;
}

.button:hover:not(:disabled),
.icon-text-button:hover:not(:disabled),
.swipe-actions button:hover:not(:disabled) {
  border-color: var(--color-border-strong);
  background: var(--color-surface-2);
}

.button:active:not(:disabled),
.icon-text-button:active:not(:disabled),
.swipe-actions button:active:not(:disabled) {
  transform: translateY(1px);
}

.button-primary {
  border-color: var(--color-primary);
  background: var(--color-primary-fill);
  color: var(--color-ink);
}

.button-primary:hover:not(:disabled) {
  border-color: var(--color-focus);
  background: oklch(0.52 0.15 260);
}

.button-quiet,
.text-button {
  border-color: transparent;
  background: transparent;
  color: var(--color-muted);
}

.button-danger {
  border-color: var(--color-danger);
  background: oklch(0.38 0.14 25);
  color: var(--color-ink);
}

.button-danger-quiet {
  border-color: color-mix(in oklch, var(--color-danger) 55%, transparent);
  background: transparent;
  color: var(--color-danger);
}

.button-row,
.home-actions,
.completion-actions,
.form-actions,
.download-stack {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.field {
  display: grid;
  gap: var(--space-2);
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 700;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  color: var(--color-ink);
  font-size: 1rem;
}

input {
  min-height: 2.75rem;
  padding: 0 var(--space-3);
}

textarea {
  padding: var(--space-3);
  line-height: 1.5;
  resize: vertical;
}

input::placeholder,
textarea::placeholder {
  color: var(--color-muted);
  opacity: 1;
}

input:hover,
textarea:hover {
  border-color: var(--color-border-strong);
}

.field-help,
.field-error {
  margin: 0;
  font-size: 0.75rem;
}

.field-help {
  color: var(--color-muted);
}

.field-error {
  color: var(--color-danger);
}

.notice {
  padding: var(--space-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  font-size: 0.875rem;
}

.notice > :last-child {
  margin-block-end: 0;
}

.notice ul {
  margin-block-end: 0;
  padding-inline-start: var(--space-6);
}

.notice-error {
  border-color: color-mix(
    in oklch,
    var(--color-danger) 65%,
    var(--color-border)
  );
}

.notice-error strong,
.notice-error li::marker {
  color: var(--color-danger);
}

.notice-warning {
  border-color: color-mix(
    in oklch,
    var(--color-warning) 55%,
    var(--color-border)
  );
}

.notice-warning strong,
.notice-warning li::marker {
  color: var(--color-warning);
}

.notice-success {
  border-color: color-mix(
    in oklch,
    var(--color-success) 55%,
    var(--color-border)
  );
}

.notice-success strong {
  color: var(--color-success);
}

.boot-state,
.fatal-view {
  display: grid;
  min-height: 100dvh;
  place-content: center;
  padding: var(--space-6);
  text-align: center;
}

.fatal-view p:not(.system-label) {
  max-width: 65ch;
  color: var(--color-muted);
}

.fatal-view .button {
  justify-self: center;
}

.public-header {
  position: sticky;
  inset-block-start: 0;
  z-index: var(--z-sticky);
  display: flex;
  min-height: 3.75rem;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-2) clamp(var(--space-4), 4vw, var(--space-12));
  border-block-end: 1px solid var(--color-border);
  background: var(--color-bg);
}

.public-header button {
  min-height: 2.75rem;
  padding: var(--space-2) var(--space-3);
  border-color: transparent;
  background: transparent;
  color: var(--color-muted);
}

.public-header button:hover,
.public-header button.is-active {
  color: var(--color-ink);
}

.public-header button.is-active {
  border-block-end-color: var(--color-primary);
}

.public-header nav {
  display: flex;
  gap: var(--space-2);
}

.wordmark {
  font-weight: 700;
}

.wordmark span,
.brand-mark {
  color: var(--color-primary);
  font-weight: 800;
}

.home-view,
.builder-view,
.merge-view,
.analysis-view,
.review-view,
.resolve-view {
  width: min(100% - 2rem, 80rem);
  margin-inline: auto;
  padding-block: clamp(var(--space-8), 6vw, var(--space-16));
}

.home-intro {
  max-width: 56rem;
  padding-block: clamp(var(--space-8), 8vw, 7rem);
}

.home-intro h1 {
  max-width: 18ch;
  margin-block-end: var(--space-6);
  font-size: clamp(2.25rem, 6vw, 4.75rem);
  letter-spacing: -0.035em;
  line-height: 1.02;
}

.lede {
  max-width: 65ch;
  margin-block-end: var(--space-8);
  color: var(--color-muted);
  font-size: 1.125rem;
  line-height: 1.65;
}

.home-actions .button-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-4);
}

.capability-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-block: 1px solid var(--color-border);
}

.capability-strip div {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-6) var(--space-4);
}

.capability-strip div + div {
  border-inline-start: 1px solid var(--color-border);
}

.capability-strip strong {
  color: var(--color-primary);
  font-size: 1.125rem;
}

.capability-strip span,
.trust-note p {
  color: var(--color-muted);
  font-size: 0.875rem;
}

.trust-note {
  max-width: 68ch;
  padding-block-start: var(--space-12);
}

.access-view {
  display: grid;
  min-height: calc(100dvh - 3.75rem);
  place-items: center;
  padding: var(--space-6);
}

.access-panel {
  width: min(100%, 42rem);
  padding: clamp(var(--space-6), 5vw, var(--space-12));
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.access-panel > p:not(.system-label) {
  max-width: 65ch;
  color: var(--color-muted);
}

.study-facts,
.result-facts {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  margin-block: var(--space-6);
  border-block: 1px solid var(--color-border);
}

.study-facts div,
.result-facts div {
  display: grid;
  gap: var(--space-1);
  padding: var(--space-3) 0;
}

.study-facts dt,
.result-facts dt,
.session-readouts dt,
.resolve-heading dt {
  color: var(--color-faint);
  font-size: 0.75rem;
}

.study-facts dd,
.result-facts dd,
.session-readouts dd,
.resolve-heading dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.access-form {
  display: grid;
  gap: var(--space-3);
}

.access-form label {
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 700;
}

.access-form input {
  height: 3.5rem;
  color: var(--color-primary);
  font-size: 1.25rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.access-form .button {
  margin-block-start: var(--space-2);
}

.inline-confirm {
  margin-block-start: var(--space-6);
  padding: var(--space-4);
  border: 1px solid var(--color-danger);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
}

.inline-confirm p {
  color: var(--color-muted);
  font-size: 0.875rem;
}

.instrument-bar {
  position: sticky;
  inset-block-start: 0;
  z-index: var(--z-sticky);
  display: grid;
  min-height: 3.5rem;
  grid-template-columns: minmax(12rem, 1fr) auto auto auto;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-4);
  border-block-end: 1px solid var(--color-border);
  background: var(--color-bg);
  font-size: 0.75rem;
}

.instrument-identity {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: var(--space-3);
  overflow: hidden;
  white-space: nowrap;
}

.instrument-identity > :last-child {
  overflow: hidden;
  color: var(--color-muted);
  text-overflow: ellipsis;
}

.bar-divider {
  width: 1px;
  height: 1.5rem;
  background: var(--color-border);
}

.session-readouts {
  display: flex;
  margin: 0;
}

.session-readouts div {
  display: grid;
  min-width: 4.5rem;
  padding-inline: var(--space-3);
  border-inline-start: 1px solid var(--color-border);
}

.session-readouts div.is-warning dd {
  color: var(--color-warning);
}

.workspace-tabs {
  display: flex;
  align-self: stretch;
  align-items: center;
}

.workspace-tabs button {
  align-self: stretch;
  min-height: 2.75rem;
  padding-inline: var(--space-3);
  border: 0;
  border-block-end: 2px solid transparent;
  border-radius: 0;
  background: transparent;
  color: var(--color-muted);
  font-size: 0.75rem;
}

.workspace-tabs button:hover {
  color: var(--color-ink);
}

.workspace-tabs button.is-active {
  border-block-end-color: var(--color-primary);
  color: var(--color-ink);
}

.bar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.text-button,
.icon-text-button {
  min-width: 2.75rem;
  min-height: 2.75rem;
  padding-inline: var(--space-2);
  font-size: 0.75rem;
}

.rubric-dialog {
  width: min(100% - 2rem, 32rem);
  padding: var(--space-6);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-2);
  color: var(--color-ink);
}

.rubric-dialog::backdrop {
  background: oklch(0.03 0 0 / 0.82);
}

.rubric-dialog form {
  display: grid;
  gap: var(--space-3);
}

.rubric-dialog p:not(.system-label) {
  color: var(--color-muted);
}

.rubric-dialog label {
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 700;
}

.label-guide {
  width: min(100% - 2rem, 42rem);
  max-height: min(90dvh, 48rem);
  padding: var(--space-6);
  overflow: auto;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-2);
  color: var(--color-ink);
}

.label-guide::backdrop {
  background: oklch(0.03 0 0 / 0.82);
}

.label-guide-heading {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: var(--space-4);
}

.label-guide > p {
  color: var(--color-muted);
  font-size: 0.875rem;
}

.label-guide dl {
  margin: var(--space-6) 0 0;
  border-block-start: 1px solid var(--color-border);
}

.label-guide dl > div {
  --label-color: var(--color-primary);
  display: grid;
  grid-template-columns: minmax(8rem, 0.45fr) minmax(0, 1fr);
  gap: var(--space-4);
  padding-block: var(--space-4);
  border-block-end: 1px solid var(--color-border);
}

.label-guide dt {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--space-2);
  color: var(--label-color);
}

.label-guide dd {
  margin: 0;
  color: var(--color-muted);
  font-size: 0.875rem;
}

.storage-blocker {
  position: fixed;
  inset: 4.5rem var(--space-4) auto;
  z-index: var(--z-overlay);
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4);
  border: 1px solid var(--color-danger);
  border-radius: var(--radius-sm);
  background: var(--color-surface-2);
}

.storage-blocker strong {
  color: var(--color-danger);
}

.storage-blocker p {
  flex: 1;
  margin: 0;
  color: var(--color-muted);
  font-size: 0.875rem;
}

.swipe-view {
  position: relative;
  display: grid;
  min-height: calc(100dvh - 3.5rem);
  grid-template-rows: auto minmax(32rem, 1fr) auto;
  overflow: hidden;
}

.swipe-mode-banner {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--space-2) var(--space-4);
  padding: var(--space-2) var(--space-4);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.swipe-mode-banner progress {
  width: 100%;
  height: 2px;
  grid-column: 1 / -1;
}

progress {
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: var(--color-surface-3);
  color: var(--color-primary);
  accent-color: var(--color-primary);
}

progress::-webkit-progress-bar {
  background: var(--color-surface-3);
}

progress::-webkit-progress-value {
  background: var(--color-primary);
}

progress::-moz-progress-bar {
  background: var(--color-primary);
}

.decision-zone {
  --label-color: var(--color-primary);
  position: absolute;
  z-index: 2;
  display: flex;
  min-width: 9.5rem;
  min-height: 2.75rem;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid color-mix(in oklch, var(--label-color) 58%, transparent);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--label-color);
  font-size: 0.75rem;
  transition:
    border-color 90ms var(--ease-out),
    box-shadow 90ms var(--ease-out),
    background-color 90ms var(--ease-out),
    transform 70ms var(--ease-out);
}

.decision-zone:hover,
.decision-zone:focus-visible {
  border-color: var(--label-color);
  background: color-mix(in oklch, var(--label-color) 7%, var(--color-bg));
  box-shadow: 0 0 1.25rem
    color-mix(in oklch, var(--label-color) 24%, transparent);
}

.decision-zone:active {
  transform: scale(0.98);
}

.decision-zone kbd {
  border-color: color-mix(in oklch, var(--label-color) 60%, transparent);
  color: var(--label-color);
}

.label-tooltip {
  position: absolute;
  z-index: var(--z-overlay);
  display: grid;
  width: min(20rem, calc(100vw - 2rem));
  gap: var(--space-1);
  padding: var(--space-3);
  visibility: hidden;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface-3);
  box-shadow: 0 0.25rem 0.5rem oklch(0.02 0 0 / 0.7);
  color: var(--color-muted);
  font-size: 0.75rem;
  font-weight: 400;
  line-height: 1.5;
  opacity: 0;
  pointer-events: none;
  text-align: start;
  white-space: normal;
  transition:
    opacity 90ms var(--ease-out),
    visibility 90ms var(--ease-out);
}

.label-tooltip > strong {
  color: var(--label-color);
  font-size: 0.75rem;
}

.decision-zone:hover .label-tooltip,
.decision-zone:focus-visible .label-tooltip,
.label-choice button:hover .label-tooltip,
.label-choice button:focus-visible .label-tooltip {
  visibility: visible;
  opacity: 1;
}

.zone-top .label-tooltip {
  inset-block-start: calc(100% + var(--space-2));
  inset-inline-start: 50%;
  translate: -50% 0;
}

.zone-bottom .label-tooltip {
  inset-block-end: calc(100% + var(--space-2));
  inset-inline-start: 50%;
  translate: -50% 0;
}

.zone-left .label-tooltip {
  inset-block-start: 50%;
  inset-inline-start: calc(100% + var(--space-2));
  translate: 0 -50%;
}

.zone-right .label-tooltip {
  inset-block-start: 50%;
  inset-inline-end: calc(100% + var(--space-2));
  translate: 0 -50%;
}

.zone-top {
  inset-block-start: 4.75rem;
  inset-inline-start: 50%;
  transform: translateX(-50%);
}

.zone-top:active {
  transform: translateX(-50%) scale(0.98);
}

.zone-right {
  inset-block-start: 50%;
  inset-inline-end: var(--space-6);
  transform: translateY(-50%);
}

.zone-right:active {
  transform: translateY(-50%) scale(0.98);
}

.zone-left {
  inset-block-start: 50%;
  inset-inline-start: var(--space-6);
  transform: translateY(-50%);
}

.zone-left:active {
  transform: translateY(-50%) scale(0.98);
}

.zone-bottom {
  inset-block-end: 5.25rem;
  inset-inline-start: 50%;
  transform: translateX(-50%);
}

.zone-bottom:active {
  transform: translateX(-50%) scale(0.98);
}

.label-c {
  --label-color: var(--color-coincident);
}

.label-p {
  --label-color: var(--color-proximal);
}

.label-o {
  --label-color: var(--color-overlay);
}

.label-u {
  --label-color: var(--color-unclear);
}

.relation-stage {
  display: grid;
  width: min(100% - 22rem, 68rem);
  max-width: 68rem;
  align-content: center;
  align-self: stretch;
  justify-self: center;
  gap: var(--space-3);
  padding-block: 5.5rem;
}

.relation-card {
  width: 100%;
  min-height: 18rem;
  max-height: min(66dvh, 44rem);

  touch-action: pan-y;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);

    opacity 100ms var(--ease-out),
    border-color 90ms var(--ease-out);

.relation-card.is-exiting {

}

.relation-card.exit-c {
  --label-color: var(--color-coincident);
  transform: translateY(-1.25rem);
}

.relation-card.exit-p {
  --label-color: var(--color-proximal);
  transform: translateX(1.25rem);
}

.relation-card.exit-o {
  --label-color: var(--color-overlay);
  transform: translateX(-1.25rem);
}

.relation-card.exit-u {
  --label-color: var(--color-unclear);
  transform: translateY(1.25rem);
}

.card-meta {
  position: sticky;
  inset-block-start: 0;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-block-end: 1px solid var(--color-border);
  background: var(--color-surface-1);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.card-meta span:first-child {

  font-weight: 700;
}

.card-meta strong {
  color: var(--color-warning);
  font-weight: 700;
}

.relation-document {

  padding: var(--space-6);
  color: var(--color-ink);
  overflow-wrap: anywhere;
}

.relation-summary {
  max-width: 72ch;
  padding-block-end: var(--space-6);
}

.relation-title-line,
.relation-type-section > header,
.relation-examples > header,
.relation-reference-section > header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
}

.relation-title-line {
  margin-block-end: var(--space-2);
  color: var(--color-primary);
  font-size: 0.75rem;
  font-weight: 700;
}

.relation-title-line code {
  color: var(--color-faint);

}

.relation-summary h1,
.relation-summary h2 {

.relation-summary > p {

.relation-summary-facts {

.relation-summary-facts div {

.relation-summary-facts dt {

.relation-summary-facts dd {

.relation-flow {

.relation-type-section {

.relation-type-section > header,

.relation-type-section h3,

.relation-type-section header > span,

.relation-type-section ul,
.relation-reference-section ul {

  margin: 0;

  list-style: none;
}

.relation-type-section li,
.relation-reference-section li {

}

.relation-type-section li:first-child,
.relation-reference-section li:first-child {

.relation-type-section li:last-child,
.relation-reference-section li:last-child {

.relation-type-section li strong,

.relation-type-section li span,
.relation-reference-section li span {
  color: var(--color-muted);

.relation-type-section > p {

.relation-direction {

.relation-examples {

}

.relation-examples ol {
  display: grid;
  margin: 0;
  padding: 0;
  list-style: none;
}

.relation-examples li {
  display: grid;
  gap: var(--space-1);
  padding-block: var(--space-2);
  border-block-end: 1px solid var(--color-border);
}

.relation-examples li:first-child {

}

.relation-examples li:last-child {

.example-context {

.example-pair {

.example-pair.is-single {

.example-arrow {

}

.relation-reference {

  border-inline-start: 1px solid var(--color-border);

.relation-reference > section + section {

.relation-constraints dl {

  gap: var(--space-1);
  margin: var(--space-3) 0 0;

.relation-constraints dl > div {

.relation-constraints dt {
  color: var(--color-muted);
  font-size: 0.75rem;

.relation-constraints dd {

.relation-document.is-compact {

.relation-document.is-compact .relation-summary h2 {

.note-composer {

.note-heading,
.note-help {

  color: var(--color-muted);

}

.note-heading label {
  color: var(--color-ink);

.note-heading label span {

.note-help .text-button {

.swipe-actions {

  gap: var(--space-2);

  border-block-start: 1px solid var(--color-border);
  background: var(--color-bg);
}

.swipe-actions button {

  min-height: 2.75rem;
  align-items: center;
  gap: var(--space-2);

.swipe-actions button.is-active {

.action-spacer {

.view-heading {

.view-heading > p:not(.system-label) {

.metric-line {

.metric-line > div {

}

.metric-line > div + div {

}

.metric-line span {

}

.metric-line strong {
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
}

.analysis-section,
.form-section {
  margin-block-end: var(--space-8);
  padding: var(--space-6);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.section-heading {

  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  margin-block-end: var(--space-4);
}

.section-heading h2 {

}

.section-heading > span {

}

.pass-progress {

}

.progress-row {

  grid-template-columns: minmax(9rem, 1fr) minmax(12rem, 4fr) auto;

  gap: var(--space-4);

  font-size: 0.875rem;
}

.progress-row progress {
  width: 100%;

}

.progress-row strong {

}

.blind-analysis-lock {

  align-items: center;
  gap: var(--space-6);

  border: 1px solid var(--color-border);

  background: var(--color-surface-1);

.blind-analysis-lock > span {

.blind-analysis-lock h2 {

.blind-analysis-lock p {

.analysis-grid {

.analysis-grid .analysis-section {

.analysis-section table {

}

.analysis-section th,
.analysis-section td {

.analysis-section thead th {

.quota-panel > strong,

.quota-panel progress,

.quota-panel p,

.data-table-wrap {

.distribution {

.distribution span {

.label-sequence {

.review-view {

.missed-list li {

.missed-list .relation-document {

.missed-list p {

}

.label-text {

.completion-view {

.completion-view.embedded {

.builder-step-heading {

.builder-step-heading h2 {

.builder-step-heading > div > p:last-child {

.builder-step-actions {

.pool-summary {

.anchor-distribution dt {
  overflow: hidden;
  color: var(--color-muted);
  font-size: 0.75rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.anchor-distribution dd {
  margin: 0;
  color: var(--label-color);
  font-variant-numeric: tabular-nums;
}

.qualification-workbench {
  display: grid;
  grid-template-columns: minmax(16rem, 0.72fr) minmax(0, 2fr);
  align-items: start;
  gap: var(--space-4);
}

.card-pool-browser,
.qualification-editor {
  min-width: 0;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-bg);
}

.card-pool-browser {
  position: sticky;
  inset-block-start: 5rem;
  padding: var(--space-4);
}

.pool-browser-count {
  margin-block: var(--space-3);
  color: var(--color-faint);
  font-size: 0.75rem;
}

.pool-filter-toggle {
  display: flex;
  min-height: 2.75rem;
  align-items: center;
  gap: var(--space-2);
  margin-block-end: var(--space-2);
  color: var(--color-muted);
  font-size: 0.75rem;
  cursor: pointer;
}

.pool-filter-toggle input {
  width: 1rem;
  min-height: 1rem;
  margin: 0;
  padding: 0;
  accent-color: var(--color-primary);
}

.pool-card-list {
  display: grid;
  max-height: 32rem;
  gap: var(--space-1);
  margin: 0;
  padding: 0;
  overflow-y: auto;
  list-style: none;
}

.pool-card-list button {
  display: grid;
  width: 100%;
  min-height: 3.5rem;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--color-muted);
  text-align: start;
}

.pool-card-list button:hover {
  border-color: var(--color-border);
  background: var(--color-surface-1);
}

.pool-card-list button[aria-current="true"] {
  border-color: var(--color-primary);
  background: color-mix(
    in oklch,
    var(--color-primary) 8%,
    var(--color-surface-1)
  );
}

.pool-card-list button > span {
  display: grid;
  min-width: 0;
}

.pool-card-list strong {
  color: var(--color-ink);
  font-size: 0.75rem;
}

.pool-card-list small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pool-card-list em {
  color: var(--color-primary);
  font-size: 0.6875rem;
  font-style: normal;
}

.pagination-controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: var(--space-2);
  margin-block-start: var(--space-3);
}

.pagination-controls .button {
  min-height: 2.75rem;
  padding-inline: var(--space-2);
}

.pagination-controls .button:last-child {
  justify-self: end;
}

.pagination-controls span {
  color: var(--color-faint);
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
}

.qualification-editor {
  overflow: hidden;
}

.qualification-preview {
  max-height: 34rem;
  padding: 0 var(--space-6) var(--space-6);
  overflow-y: auto;
  border-block-end: 1px solid var(--color-border);
}

.qualification-preview .card-meta {
  position: sticky;
  inset-block-start: 0;
  z-index: 1;
  margin-inline: calc(var(--space-6) * -1);
  padding-inline: var(--space-6);
}

.qualification-form {
  display: grid;
  gap: var(--space-4);
  padding: var(--space-6);
}

.qualification-labels,
.planner-mode-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  border: 0;
}

.qualification-labels legend,
.planner-mode-options legend {
  grid-column: 1 / -1;
  margin-block-end: var(--space-1);
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 700;
}

.qualification-label,
.planner-mode-options label {
  position: relative;
  display: grid;
  min-height: 4.5rem;
  grid-template-columns: auto 1fr;
  align-items: start;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  cursor: pointer;
}

.qualification-label:hover,
.planner-mode-options label:hover {
  border-color: var(--color-border-strong);
}

.qualification-label:has(input:checked) {
  border-color: var(--label-color);
  background: color-mix(
    in oklch,
    var(--label-color) 7%,
    var(--color-surface-1)
  );
}

.planner-mode-options label:has(input:checked) {
  border-color: var(--color-primary);
  background: color-mix(
    in oklch,
    var(--color-primary) 7%,
    var(--color-surface-1)
  );
}

.qualification-label input,
.planner-mode-options input {
  width: 1rem;
  min-height: 1rem;
  margin: 0.2rem 0 0;
  accent-color: var(--label-color, var(--color-primary));
}

.qualification-label span,
.planner-mode-options span {
  display: grid;
  gap: var(--space-1);
}

.qualification-label strong {
  color: var(--label-color);
}

.qualification-label small,
.planner-mode-options small {
  color: var(--color-muted);
  font-size: 0.6875rem;
  font-weight: 400;
  line-height: 1.45;
}

.planning-form {
  display: grid;
  gap: var(--space-6);
}

.planning-form .form-section {
  margin: 0;
  background: var(--color-bg);
}

.planner-input-layout {
  display: grid;
  grid-template-columns: minmax(16rem, 0.8fr) minmax(0, 1.6fr);
  gap: var(--space-6);
}

.planner-number-fields {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
  margin-block-start: var(--space-6);
  padding-block-start: var(--space-4);
  border-block-start: 1px solid var(--color-border);
}

.planner-readout {
  padding: var(--space-6);
  border: 1px solid var(--color-primary);
  border-radius: var(--radius-md);
  background: var(--color-bg);
}

.planner-readout .section-heading > div {
  display: grid;
}

.planner-readout .section-heading h2 {
  margin: 0;
  font-size: 1.25rem;
}

.planner-metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 0;
  border-block: 1px solid var(--color-border);
}

.planner-metrics > div {
  display: grid;
  gap: var(--space-1);
  padding: var(--space-3);
  border-inline-end: 1px solid var(--color-border);
  border-block-end: 1px solid var(--color-border);
}

.planner-metrics > div:nth-child(4n) {
  border-inline-end: 0;
}

.planner-metrics dt {
  color: var(--color-faint);
  font-size: 0.6875rem;
}

.planner-metrics dd {
  margin: 0;
  font-size: 1.125rem;
  font-variant-numeric: tabular-nums;
}

.planner-metrics .planner-metric-wide {
  grid-column: span 2;
}

.planner-metrics .planner-metric-wide dd {
  color: var(--color-primary);
}

.planner-warning {
  max-width: 72ch;
  margin-block: var(--space-4) 0;
  color: var(--color-warning);
  font-size: 0.75rem;
}

.planner-empty-readout {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-6);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  color: var(--color-muted);
}

.planner-empty-readout strong {
  color: var(--color-ink);
}

.review-instrument-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
  margin-block-start: var(--space-4);
}

.review-instrument-grid .form-section {
  margin: 0;
  background: var(--color-bg);
}

.review-primary-value {
  display: block;
  margin-block-end: var(--space-4);
  color: var(--color-primary);
  font-size: 1.5rem;
  font-variant-numeric: tabular-nums;
}

.review-label-counts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 0;
}

.review-label-counts div {
  display: grid;
  gap: var(--space-1);
  padding: var(--space-2);
  border-block-start: 2px solid var(--label-color);
  background: var(--color-surface-1);
}

.review-label-counts div + div {
  border-inline-start: 1px solid var(--color-border);
}

.review-label-counts dt {
  overflow: hidden;
  color: var(--color-muted);
  font-size: 0.6875rem;
  text-overflow: ellipsis;
}

.review-label-counts dd {
  margin: 0;
  color: var(--label-color);
}

.review-provenance dd {
  max-width: 60%;
  overflow-wrap: anywhere;
}

.result-actions {
  justify-content: flex-start;
  margin-block-start: var(--space-6);
}

.builder-files,
.merge-imports {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
  margin-block-end: var(--space-8);
}

.builder-files {
  margin-block-end: var(--space-3);
}

.builder-file-note {
  max-width: 72ch;
  margin: 0 0 var(--space-8);
  color: var(--color-muted);
  font-size: 0.8125rem;
}

.merge-imports {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.drop-zone {
  display: grid;
  min-height: 10rem;
  place-content: center;
  justify-items: center;
  gap: var(--space-2);
  padding: var(--space-6);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
  color: var(--color-muted);
  text-align: center;
  transition:
    border-color 120ms var(--ease-out),
    background-color 120ms var(--ease-out);
}

.drop-zone:hover,
.drop-zone.is-dragging {
  border-color: var(--color-primary);
  background: color-mix(
    in oklch,
    var(--color-primary) 7%,
    var(--color-surface-1)
  );
}

.drop-zone.has-file {
  border-style: solid;
  border-color: color-mix(
    in oklch,
    var(--color-success) 55%,
    var(--color-border)
  );
}

.drop-zone input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.drop-zone strong {
  color: var(--color-ink);
  overflow-wrap: anywhere;
}

.drop-zone span:last-child {
  font-size: 0.75rem;
}

.drop-icon {
  display: grid;
  width: 2.5rem;
  height: 2.5rem;
  place-items: center;
  border: 1px solid var(--color-border);
  border-radius: 50%;
  color: var(--color-primary);
}

.builder-form {
  margin-block-end: var(--space-12);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
}

.form-grid.compact {
  align-content: start;
}

.field-wide {
  grid-column: 1 / -1;
}

.assignment-fields {
  display: grid;
  grid-template-columns: minmax(16rem, 1.5fr) minmax(16rem, 1fr);
  gap: var(--space-6);
}

.field-roster textarea {
  min-height: 14rem;
}

.build-result {
  padding: var(--space-8);
  border: 1px solid var(--color-primary);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.build-result-heading {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: var(--space-4);
}

.build-result-heading h2 {
  font-size: 1.5rem;
}

.build-result-heading code {
  padding: var(--space-2);
  border: 1px solid var(--color-border);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.download-stack {
  margin-block-start: var(--space-6);
}

.result-warning {
  max-width: 75ch;
  margin-block: var(--space-4) 0;
  color: var(--color-warning);
  font-size: 0.75rem;
}

.file-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-block-end: var(--space-4);
}

.file-chips > span {
  display: inline-flex;
  min-height: 2rem;
  align-items: center;
  gap: var(--space-2);
  padding-inline-start: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.file-chips strong {
  max-width: 18rem;
  overflow: hidden;
  color: var(--color-ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-chips button {
  align-self: stretch;
  border: 0;
  border-inline-start: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-muted);
}

.merge-empty {
  display: grid;
  min-height: 24rem;
  place-content: center;
  justify-items: center;
  padding: var(--space-8);
  border: 1px solid var(--color-border);
  color: var(--color-muted);
  text-align: center;
}

.merge-empty > div {
  color: var(--color-primary);
  font-size: 2rem;
}

.merge-empty h2 {
  margin-block: var(--space-4) var(--space-2);
  color: var(--color-ink);
}

.merge-empty p {
  max-width: 60ch;
}

.alpha-panel > strong {
  color: var(--color-primary);
}

.alpha-panel dl {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  margin: 0;
}

.alpha-panel dl div {
  display: flex;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
}

.alpha-panel dt {
  color: var(--color-muted);
}

.alpha-panel dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.resolve-heading {
  display: flex;
  max-width: none;
  align-items: end;
  justify-content: space-between;
  gap: var(--space-6);
}

.resolve-heading dl {
  display: flex;
  margin: 0;
}

.resolve-heading dl div {
  min-width: 6rem;
  padding: var(--space-2) var(--space-4);
  border-inline-start: 1px solid var(--color-border);
}

.resolve-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(20rem, 1fr);
  gap: var(--space-6);
  margin-block-end: var(--space-8);
}

.resolve-card,
.resolve-form {
  min-width: 0;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.resolve-card {
  overflow: hidden;
}

.resolve-card-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-block-end: 1px solid var(--color-border);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.resolve-card-meta code {
  color: var(--color-primary);
}

.resolve-card > .relation-document {
  min-height: 18rem;
}

.evidence-sequence {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4);
  border-block-start: 1px solid var(--color-border);
}

.evidence-sequence > span {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0 var(--space-2);
  padding: var(--space-2);
  border: 1px solid
    color-mix(in oklch, var(--label-color) 45%, var(--color-border));
  color: var(--color-muted);
  font-size: 0.75rem;
}

.evidence-sequence strong {
  grid-row: 1 / 3;
  align-self: center;
  color: var(--label-color);
  font-size: 1.125rem;
}

.evidence-notes {
  padding: var(--space-4);
  border-block-start: 1px solid var(--color-border);
}

.evidence-notes blockquote {
  margin: var(--space-3) 0;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  background: var(--color-bg);
}

.evidence-notes blockquote p {
  margin-block-end: var(--space-2);
}

.evidence-notes cite {
  color: var(--color-muted);
  font-size: 0.75rem;
  font-style: normal;
}

.resolve-form {
  display: grid;
  align-content: start;
  gap: var(--space-4);
  padding: var(--space-6);
}

.label-choice {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-2);
  padding: 0;
  border: 0;
}

.label-choice legend {
  margin-block-end: var(--space-2);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.label-choice button {
  position: relative;
  display: grid;
  min-height: 4rem;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid
    color-mix(in oklch, var(--label-color) 50%, var(--color-border));
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--label-color);
  text-align: start;
}

.label-choice button:hover {
  border-color: var(--label-color);
  background: color-mix(in oklch, var(--label-color) 8%, var(--color-bg));
}

.label-choice .label-tooltip {
  inset-block-end: calc(100% + var(--space-2));
  inset-inline-start: 50%;
  translate: -50% 0;
}

@media (max-width: 75rem) {
  .instrument-bar {
    grid-template-columns: minmax(9rem, 1fr) auto auto;
  }

  .session-readouts {
    display: none;
  }

  .relation-stage {
    width: min(100% - 18rem, 50rem);
  }

  .decision-zone {
    min-width: 7rem;
  }

  .zone-left {
    inset-inline-start: var(--space-4);
  }

  .zone-right {
    inset-inline-end: var(--space-4);
  }
}

@media (max-width: 58rem) {
  .instrument-bar {
    grid-template-columns: 1fr auto;
    gap: var(--space-2);
  }

  .workspace-tabs {
    grid-row: 2;
    grid-column: 1 / -1;
    min-height: 2.75rem;
    border-block-start: 1px solid var(--color-border);
  }

  .workspace-tabs button {
    flex: 1;
  }

  .bar-actions .text-button {
    display: none;
  }

  .swipe-view {
    height: calc(100dvh - 7.125rem);
    min-height: 0;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  .relation-stage {
    width: min(100% - 3rem, 46rem);
    padding-block: calc(var(--space-16) + var(--space-2)) var(--space-16);
  }

  .relation-evidence {
    grid-template-columns: minmax(0, 1fr);
  }

  .relation-examples {
    padding-inline-end: 0;
  }

  .relation-reference {
    padding-block-start: var(--space-4);
    padding-inline-start: 0;
    border-block-start: 1px solid var(--color-border);
    border-inline-start: 0;
  }

  .zone-left,
  .zone-right {
    inset-block-start: auto;
    inset-block-end: 4.75rem;
    transform: none;
  }

  .zone-left {
    inset-inline-start: var(--space-4);
  }

  .zone-right {
    inset-inline-end: var(--space-4);
  }

  .zone-left:active,
  .zone-right:active {
    transform: scale(0.98);
  }

  .zone-left .label-tooltip {
    inset: auto auto calc(100% + var(--space-2)) 0;
    translate: 0;
  }

  .zone-right .label-tooltip {
    inset: auto 0 calc(100% + var(--space-2)) auto;
    translate: 0;
  }

  .zone-bottom {
    inset-block-end: 4.75rem;
  }

  .swipe-actions {
    padding-block-end: max(var(--space-2), env(safe-area-inset-bottom));
  }

  .capability-strip,
  .analysis-grid,
  .builder-import-layout,
  .builder-files,
  .merge-imports,
  .planner-input-layout,
  .qualification-workbench,
  .review-instrument-grid,
  .resolve-layout {
    grid-template-columns: 1fr;
  }

  .capability-strip div + div {
    border-block-start: 1px solid var(--color-border);
    border-inline-start: 0;
  }

  .assignment-fields {
    grid-template-columns: 1fr;
  }

  .card-pool-browser {
    position: static;
  }

  .pool-card-list {
    max-height: 20rem;
  }

  .resolve-heading {
    align-items: start;
    flex-direction: column;
  }
}

@media (max-width: 42rem) {
  .public-header {
    align-items: stretch;
    flex-direction: column;
    padding: var(--space-2) var(--space-4);
  }

  .public-header nav button {
    flex: 1;
  }

  .home-view,
  .builder-view,
  .merge-view,
  .analysis-view,
  .review-view,
  .resolve-view {
    width: min(100% - 1.25rem, 80rem);
    padding-block: var(--space-8);
  }

  .home-intro {
    padding-block: var(--space-12);
  }

  .home-intro h1 {
    font-size: 2.25rem;
  }

  .button-row > .button,
  .home-actions > .button,
  .completion-actions > .button,
  .download-stack > .button {
    width: 100%;
  }

  .study-facts,
  .result-facts,
  .form-grid {
    grid-template-columns: 1fr;
  }

  .builder-step-heading {
    align-items: stretch;
    flex-direction: column;
    gap: var(--space-4);
  }

  .anchor-readout {
    padding-block-start: var(--space-4);
    padding-inline-start: 0;
    border-block-start: 1px solid var(--color-border);
    border-inline-start: 0;
    text-align: start;
  }

  .anchor-distribution,
  .planner-metrics,
  .review-label-counts {
    grid-template-columns: repeat(2, 1fr);
  }

  .anchor-distribution div:nth-child(3),
  .review-label-counts div:nth-child(3) {
    border-inline-start: 0;
  }

  .planner-metrics > div:nth-child(4n) {
    border-inline-end: 1px solid var(--color-border);
  }

  .planner-metrics > div:nth-child(2n) {
    border-inline-end: 0;
  }

  .planner-metrics .planner-metric-wide {
    grid-column: 1 / -1;
  }

  .planner-number-fields,
  .qualification-labels,
  .planner-mode-options {
    grid-template-columns: 1fr;
  }

  .builder-step-actions > .button {
    flex: 1 1 12rem;
  }

  .field-wide {
    grid-column: auto;
  }

  .instrument-identity > :last-child,
  .bar-export-action {
    display: none;
  }

  .instrument-bar {
    padding-inline: var(--space-3);
  }

  .swipe-mode-banner {
    padding-inline: var(--space-3);
  }

  .relation-stage {
    width: calc(100% - 1rem);
  }

  .relation-card {
    min-height: min(15rem, 100%);
    max-height: min(54dvh, 100%);
  }

  .relation-document {
    padding: var(--space-4);
  }

  .relation-summary {
    padding-block-end: var(--space-4);
  }

  .relation-summary h1,
  .relation-summary h2 {
    font-size: 1.25rem;
  }

  .relation-flow {
    grid-template-columns: minmax(0, 1fr);
  }

  .relation-direction {
    display: flex;
    min-height: 2.75rem;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    border-block: 1px solid var(--color-border);
  }

  .relation-direction strong {
    rotate: 90deg;
  }

  .relation-type-section {
    padding-block: var(--space-3);
  }

  .relation-type-section li strong,
  .relation-type-section li span,
  .relation-reference-section li strong,
  .relation-reference-section li span,
  .example-pair,
  .relation-summary > p {
    font-size: 0.875rem;
  }

  .decision-zone {
    min-width: 0;
    min-height: 2.75rem;
    padding-inline: var(--space-2);
  }

  .decision-zone strong {
    font-size: 0.875rem;
  }

  .zone-top {
    inset-block-start: 4.25rem;
  }

  .zone-left,
  .zone-right,
  .zone-bottom {
    inset-block-end: 4.5rem;
  }

  .zone-left {
    inset-inline-start: var(--space-2);
  }

  .zone-right {
    inset-inline-end: var(--space-2);
  }

  .swipe-actions {
    padding-inline: var(--space-2);
  }

  .swipe-actions button {
    min-width: 2.75rem;
    justify-content: center;
    padding-inline: var(--space-2);
  }

  .swipe-actions button span {
    display: none;
  }

  .progress-row {
    grid-template-columns: 1fr auto;
  }

  .progress-row progress {
    grid-row: 2;
    grid-column: 1 / -1;
  }

  .metric-line {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
  }

  .metric-line > div {
    min-width: 0;
  }

  .metric-line > div + div {
    border-inline-start: 0;
  }

  .metric-line > div:nth-child(even) {
    border-inline-start: 1px solid var(--color-border);
  }

  .metric-line > div:nth-child(n + 3) {
    border-block-start: 1px solid var(--color-border);
  }

  .analysis-section,
  .form-section,
  .build-result,
  .resolve-form {
    padding: var(--space-4);
  }

  .section-heading {
    align-items: start;
    flex-direction: column;
    gap: var(--space-1);
  }

  .throughput-note {
    align-items: start;
    flex-direction: column;
    gap: var(--space-2);
  }

  .build-result-heading {
    flex-direction: column;
  }

  .label-choice {
    grid-template-columns: 1fr;
  }

  .label-guide {
    padding: var(--space-4);
  }

  .label-guide dl > div {
    grid-template-columns: 1fr;
    gap: var(--space-2);
  }
}

@media (max-width: 22rem) {
  .decision-zone kbd {
    display: none;
  }
}

@media (pointer: coarse) {
  .decision-zone,
  .swipe-actions button,
  .workspace-tabs button,
  .public-header button {
    min-height: 2.75rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .relation-card.is-exiting {
    transform: none;
  }
}

rritorial entity: Tirapu -> Iñaki Lafuente\n  - government: Boston -> Michelle Wu\n  - government: Chuisnes -> Jacky Jaulneau\n  - government: Équeurdreville-Hainneville -> Bernard Cauvin\n  - cabinet: Duterte Cabinet -> Rodrigo Duterte\n\nSlug: head-of-government","card_hash":"demo-p6-sha256","prescreen":"normal","source_metadata":{"kind":"wikidata-extract","retrieved_at":"Sat, 11 Jul 2026 21:49:16 GMT","severely_truncated":false,"token_count":559,"truncations":[]}},{"relation_id":"DEMO-C1","family_id":"demo-equivalence-1","card_text":"Relation: exact-match mapping\nDescription: maps a source identifier to the one canonical record it denotes\n\nSource types:\n  - identifier (token used to identify one record)\n\nTarget types:\n  - canonical record (authoritative representation of an item)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - stock code: SKU 1001 -> catalog item 1001\n  - country code: ISO alpha-2 US -> United States\n  - record key: A-17 -> canonical record A-17\n\nSlug: exact-match-mapping","card_hash":"demo-c1-sha256","prescreen":"equivalence"},{"relation_id":"DEMO-C2","family_id":"demo-equivalence-2","card_text":"Relation: same canonical identifier\nDescription: two references normalize to the same persistent identity\n\nSource types:\n  - alias (alternate reference to an entity)\n\nTarget types:\n  - canonical entity (single authoritative entity)\n\nConstraints:\n  - symmetric? yes\n  - direction: symmetric\n\nExamples:\n  - entity alias: Alias Q42 -> entity Q42\n  - normalized key: external key -> stored key\n  - database reference: first reference -> same row\n\nSlug: same-canonical-identifier","card_hash":"demo-c2-sha256","prescreen":"equivalence"},{"relation_id":"DEMO-P1","family_id":"demo-part-1","card_text":"Relation: component of\nDescription: subject is a distinct structural component contained by the target\n\nSource types:\n  - component (separable constituent of a larger assembly)\n\nTarget types:\n  - assembly (whole composed of multiple parts)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - hardware: wheel -> bicycle\n  - document: chapter -> book\n  - processor: core -> CPU\n\nSlug: component-of","card_hash":"demo-p1-sha256","prescreen":"normal"},{"relation_id":"DEMO-P2","family_id":"demo-part-2","card_text":"Relation: member of collection\nDescription: subject belongs to a containing collection without being identical to it\n\nSource types:\n  - member (individual item in a collection)\n\nTarget types:\n  - collection (container grouping related members)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - media: track -> album\n  - filesystem: file -> directory\n  - geography: district -> city\n\nSlug: member-of-collection","card_hash":"demo-p2-sha256","prescreen":"normal"},{"relation_id":"DEMO-O1","family_id":"demo-authorship-1","card_text":"Relation: authored by\nDescription: identifies the creator responsible for a written or software work\n\nSource types:\n  - authored work (artifact produced through authorship)\n\nTarget types:\n  - creator (person or group responsible for the work)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - novel: Frankenstein -> Mary Shelley\n  - research: paper -> listed researchers\n  - software: module -> commit signer\n\nSlug: authored-by","card_hash":"demo-o1-sha256","prescreen":"normal"},{"relation_id":"DEMO-O2","family_id":"demo-attribution-2","card_text":"Relation: attributed to\nDescription: links an artifact or statement to the agent credited with it\n\nSource types:\n  - attributed artifact (work, statement, or design carrying a credit)\n\nTarget types:\n  - credited agent (person or organization receiving attribution)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - photograph: image -> studio\n  - quotation: statement -> speaker\n  - building: design -> named architect\n\nSlug: attributed-to","card_hash":"demo-o2-sha256","prescreen":"normal"},{"relation_id":"DEMO-U1","family_id":"demo-ambiguous-1","card_text":"Relation: associated operationally with\nDescription: underspecified operational association whose semantics vary by source\n\nSource types:\n  - operational entity (actor, device, or document in a process)\n\nTarget types:\n  - operational context (organization, platform, or program)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - procurement: contractor -> agency\n  - telemetry: sensor -> platform\n  - reporting: report -> program\n\nSlug: associated-operationally-with","card_hash":"demo-u1-sha256","prescreen":"normal"},{"relation_id":"DEMO-U2","family_id":"demo-ambiguous-2","card_text":"Relation: supports\nDescription: overloaded relation spanning service, physical, and evidentiary support\n\nSource types:\n  - supporting entity (entity described as providing support)\n\nTarget types:\n  - supported entity (entity receiving an unspecified kind of support)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - operations: team -> service\n  - structure: bracket -> shelf\n  - reasoning: evidence -> conclusion\n\nSlug: supports","card_hash":"demo-u2-sha256","prescreen":"normal"},{"relation_id":"DEMO-M1","family_id":"demo-mixed-1","card_text":"Relation: represents\nDescription: links a representation or delegate to a distinct referent\n\nSource types:\n  - representation (symbol, delegate, or record standing for something)\n\nTarget types:\n  - referent (entity being represented)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - interface: icon -> application\n  - government: delegate -> district\n  - logistics: record -> physical shipment\n\nSlug: represents","card_hash":"demo-m1-sha256","prescreen":"normal"},{"relation_id":"DEMO-M2","family_id":"demo-mixed-2","card_text":"Relation: linked to\nDescription: generic link without a stable structural or attribution meaning\n\nSource types:\n  - linked entity (entity carrying a reference or connection)\n\nTarget types:\n  - linked target (destination of the generic connection)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - citation: citation -> source\n  - identity: account -> device\n  - transport: station -> main line\n\nSlug: linked-to","card_hash":"demo-m2-sha256","prescreen":"normal"}],"qualification_cards":[{"relation_id":"QUAL-C1","family_id":"qual-equivalence","card_text":"Relation: identical canonical target\nDescription: both references resolve to one canonical identity\n\nSource types:\n  - alias (alternate identifier for an entity)\n\nTarget types:\n  - canonical entity (authoritative identity record)\n\nConstraints:\n  - symmetric? yes\n  - direction: symmetric\n\nExamples:\n  - entity alias: first alias -> same canonical entity\n  - normalized key: external key -> stored identifier\n  - redirect: first key -> one target\n\nSlug: identical-canonical-target","card_hash":"qual-c1-sha256","prescreen":"equivalence","answer":"C","rationale":"Both sides collapse to the same canonical target, so their geometry is Coincident."},{"relation_id":"QUAL-P1","family_id":"qual-part","card_text":"Relation: structural part of\nDescription: subject is a distinct structural part contained by the target\n\nSource types:\n  - component (separable part of a larger structure)\n\nTarget types:\n  - whole (structure containing the component)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - hardware: keyboard -> laptop\n  - narrative: scene -> film\n  - infrastructure: rack -> data center\n\nSlug: structural-part-of","card_hash":"qual-p1-sha256","prescreen":"normal","answer":"P","rationale":"The first item occupies a contained structural role relative to the second, which is Proximal."},{"relation_id":"QUAL-O1","family_id":"qual-attribution","card_text":"Relation: created by\nDescription: attributes a distinct work to the agent responsible for creating it\n\nSource types:\n  - created work (artifact produced by a creator)\n\nTarget types:\n  - creator (person or group responsible for the work)\n\nConstraints:\n  - symmetric? no\n  - direction: source -> target\n\nExamples:\n  - literature: novel -> author\n  - visual art: mural -> artist\n  - software: patch -> contributor\n\nSlug: created-by","card_hash":"qual-o1-sha256","prescreen":"normal","answer":"O","rationale":"Creation links distinct entities through attribution rather than containment, so it is Overlay."},{"relation_id":"QUAL-U1","family_id":"qual-ambiguous","card_text":"Relation: connected with\nDescription: generic connection lacking one stable semantic interpretation\n\nSource types:\n  - connected entity (entity participating in an unspecified connection)\n\nTarget types:\n  - connection target (entity at the other end of the connection)\n\nConstraints:\n  - symmetric? unknown\n  - direction: not specified\n\nExamples:\n  - policy: initiative -> department\n  - systems: device -> service\n  - events: person -> event\n\nSlug: connected-with","card_hash":"qual-u1-sha256","prescreen":"normal","answer":"U","rationale":"The relation is underspecified across examples, so no stable geometry class is justified."}],"manifest":{"annotator_ids":["DEMO"],"assignments":{"DEMO":["DEMO-C1","DEMO-C2","DEMO-M1","DEMO-M2","DEMO-O1","DEMO-O2","DEMO-P1","DEMO-P2","DEMO-U1","DEMO-U2","P6"]},"loads":{"DEMO":11},"stratum_loads":{"equivalence":{"DEMO":2},"normal":{"DEMO":9}}},"access":[{"annotator_id":"DEMO","code_hash":"d97a8008825d0e5474808d14954bc2bb30433db725a48c873ca7cea96a394045"}]},"demo_code":"1R7T-2T4T"}</script>
