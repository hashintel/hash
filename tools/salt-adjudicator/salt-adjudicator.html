<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>SALT swipe adjudicator</title>
    <style>
:root {
  color-scheme: dark;
  --color-bg: oklch(0.075 0 0);
  --color-surface-1: oklch(0.12 0.006 260);
  --color-surface-2: oklch(0.17 0.008 260);
  --color-surface-3: oklch(0.22 0.01 260);
  --color-border: oklch(0.31 0.012 260);
  --color-border-strong: oklch(0.43 0.018 260);
  --color-ink: oklch(0.93 0.008 260);
  --color-muted: oklch(0.72 0.014 260);
  --color-faint: oklch(0.58 0.014 260);
  --color-primary: oklch(0.69 0.14 260);
  --color-primary-fill: oklch(0.47 0.14 260);
  --color-focus: oklch(0.76 0.15 260);
  --color-coincident: oklch(0.78 0.13 180);
  --color-proximal: oklch(0.72 0.15 260);
  --color-overlay: oklch(0.8 0.14 80);
  --color-unclear: oklch(0.73 0.14 330);
  --color-danger: oklch(0.68 0.17 25);
  --color-warning: oklch(0.8 0.14 80);
  --color-success: oklch(0.78 0.13 180);
  --font-mono:
    ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo,
    Consolas, monospace;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --radius-xs: 0.125rem;
  --radius-sm: 0.25rem;
  --radius-md: 0.375rem;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --z-sticky: 20;
  --z-overlay: 40;
  --z-modal: 60;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 20rem;
  min-height: 100%;
  background: var(--color-bg);
  font-family: var(--font-mono);
  font-size: 100%;
  font-kerning: normal;
  font-variant-ligatures: none;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  background: var(--color-bg);
  color: var(--color-ink);
  font-family: inherit;
  line-height: 1.55;
  text-rendering: optimizeLegibility;
}

button,
input,
textarea,
select {
  color: inherit;
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 0.125rem solid var(--color-focus);
  outline-offset: 0.125rem;
}

a {
  color: var(--color-primary);
}

code,
kbd,
pre {
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}

kbd {
  display: inline-grid;
  min-width: 1.5rem;
  min-height: 1.5rem;
  place-items: center;
  padding: 0 var(--space-1);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-xs);
  background: var(--color-surface-1);
  color: var(--color-ink);
  font-size: 0.75rem;
  line-height: 1;
}

h1,
h2,
h3,
p {
  margin-block-start: 0;
}

h1,
h2,
h3 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

h1 {
  margin-block-end: var(--space-4);
  font-size: 1.75rem;
  line-height: 1.2;
}

h2 {
  margin-block-end: var(--space-3);
  font-size: 1.125rem;
  line-height: 1.3;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  inset-block-start: var(--space-2);
  inset-inline-start: var(--space-2);
  z-index: var(--z-modal);
  padding: var(--space-2) var(--space-3);
  transform: translateY(-200%);
  border: 1px solid var(--color-focus);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--color-ink);
}

.skip-link:focus {
  transform: translateY(0);
}

.system-label {
  margin-block-end: var(--space-2);
  color: var(--color-primary);
  font-size: 0.75rem;
  font-weight: 700;
}

.button,
.text-button,
.icon-text-button,
.public-header button,
.workspace-tabs button,
.swipe-actions button {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  color: var(--color-ink);
  transition:
    border-color 90ms var(--ease-out),
    background-color 90ms var(--ease-out),
    color 90ms var(--ease-out),
    transform 70ms var(--ease-out);
}

.button {
  min-height: 2.75rem;
  padding: var(--space-2) var(--space-4);
  font-size: 0.875rem;
  font-weight: 700;
}

.button:hover:not(:disabled),
.icon-text-button:hover:not(:disabled),
.swipe-actions button:hover:not(:disabled) {
  border-color: var(--color-border-strong);
  background: var(--color-surface-2);
}

.button:active:not(:disabled),
.icon-text-button:active:not(:disabled),
.swipe-actions button:active:not(:disabled) {
  transform: translateY(1px);
}

.button-primary {
  border-color: var(--color-primary);
  background: var(--color-primary-fill);
  color: var(--color-ink);
}

.button-primary:hover:not(:disabled) {
  border-color: var(--color-focus);
  background: oklch(0.52 0.15 260);
}

.button-quiet,
.text-button {
  border-color: transparent;
  background: transparent;
  color: var(--color-muted);
}

.button-danger {
  border-color: var(--color-danger);
  background: oklch(0.38 0.14 25);
  color: var(--color-ink);
}

.button-danger-quiet {
  border-color: color-mix(in oklch, var(--color-danger) 55%, transparent);
  background: transparent;
  color: var(--color-danger);
}

.button-row,
.home-actions,
.completion-actions,
.form-actions,
.download-stack {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}

.field {
  display: grid;
  gap: var(--space-2);
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 700;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  color: var(--color-ink);
  font-size: 1rem;
}

input {
  min-height: 2.75rem;
  padding: 0 var(--space-3);
}

textarea {
  padding: var(--space-3);
  line-height: 1.5;
  resize: vertical;
}

input::placeholder,
textarea::placeholder {
  color: var(--color-muted);
  opacity: 1;
}

input:hover,
textarea:hover {
  border-color: var(--color-border-strong);
}

.field-help,
.field-error {
  margin: 0;
  font-size: 0.75rem;
}

.field-help {
  color: var(--color-muted);
}

.field-error {
  color: var(--color-danger);
}

.notice {
  padding: var(--space-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  font-size: 0.875rem;
}

.notice > :last-child {
  margin-block-end: 0;
}

.notice ul {
  margin-block-end: 0;
  padding-inline-start: var(--space-6);
}

.notice-error {
  border-color: color-mix(
    in oklch,
    var(--color-danger) 65%,
    var(--color-border)
  );
}

.notice-error strong,
.notice-error li::marker {
  color: var(--color-danger);
}

.notice-warning {
  border-color: color-mix(
    in oklch,
    var(--color-warning) 55%,
    var(--color-border)
  );
}

.notice-warning strong,
.notice-warning li::marker {
  color: var(--color-warning);
}

.notice-success {
  border-color: color-mix(
    in oklch,
    var(--color-success) 55%,
    var(--color-border)
  );
}

.notice-success strong {
  color: var(--color-success);
}

.boot-state,
.fatal-view {
  display: grid;
  min-height: 100dvh;
  place-content: center;
  padding: var(--space-6);
  text-align: center;
}

.fatal-view p:not(.system-label) {
  max-width: 65ch;
  color: var(--color-muted);
}

.fatal-view .button {
  justify-self: center;
}

.public-header {
  position: sticky;
  inset-block-start: 0;
  z-index: var(--z-sticky);
  display: flex;
  min-height: 3.75rem;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-2) clamp(var(--space-4), 4vw, var(--space-12));
  border-block-end: 1px solid var(--color-border);
  background: var(--color-bg);
}

.public-header button {
  min-height: 2.75rem;
  padding: var(--space-2) var(--space-3);
  border-color: transparent;
  background: transparent;
  color: var(--color-muted);
}

.public-header button:hover,
.public-header button.is-active {
  color: var(--color-ink);
}

.public-header button.is-active {
  border-block-end-color: var(--color-primary);
}

.public-header nav {
  display: flex;
  gap: var(--space-2);
}

.wordmark {
  font-weight: 700;
}

.wordmark span,
.brand-mark {
  color: var(--color-primary);
  font-weight: 800;
}

.home-view,
.builder-view,
.merge-view,
.analysis-view,
.review-view,
.resolve-view {
  width: min(100% - 2rem, 80rem);
  margin-inline: auto;
  padding-block: clamp(var(--space-8), 6vw, var(--space-16));
}

.home-intro {
  max-width: 56rem;
  padding-block: clamp(var(--space-8), 8vw, 7rem);
}

.home-intro h1 {
  max-width: 18ch;
  margin-block-end: var(--space-6);
  font-size: clamp(2.25rem, 6vw, 4.75rem);
  letter-spacing: -0.035em;
  line-height: 1.02;
}

.lede {
  max-width: 65ch;
  margin-block-end: var(--space-8);
  color: var(--color-muted);
  font-size: 1.125rem;
  line-height: 1.65;
}

.home-actions .button-primary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-4);
}

.capability-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-block: 1px solid var(--color-border);
}

.capability-strip div {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-6) var(--space-4);
}

.capability-strip div + div {
  border-inline-start: 1px solid var(--color-border);
}

.capability-strip strong {
  color: var(--color-primary);
  font-size: 1.125rem;
}

.capability-strip span,
.trust-note p {
  color: var(--color-muted);
  font-size: 0.875rem;
}

.trust-note {
  max-width: 68ch;
  padding-block-start: var(--space-12);
}

.access-view {
  display: grid;
  min-height: calc(100dvh - 3.75rem);
  place-items: center;
  padding: var(--space-6);
}

.access-panel {
  width: min(100%, 42rem);
  padding: clamp(var(--space-6), 5vw, var(--space-12));
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.access-panel > p:not(.system-label) {
  max-width: 65ch;
  color: var(--color-muted);
}

.study-facts,
.result-facts {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  margin-block: var(--space-6);
  border-block: 1px solid var(--color-border);
}

.study-facts div,
.result-facts div {
  display: grid;
  gap: var(--space-1);
  padding: var(--space-3) 0;
}

.study-facts dt,
.result-facts dt,
.session-readouts dt,
.resolve-heading dt {
  color: var(--color-faint);
  font-size: 0.75rem;
}

.study-facts dd,
.result-facts dd,
.session-readouts dd,
.resolve-heading dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.access-form {
  display: grid;
  gap: var(--space-3);
}

.access-form label {
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 700;
}

.access-form input {
  height: 3.5rem;
  color: var(--color-primary);
  font-size: 1.25rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.access-form .button {
  margin-block-start: var(--space-2);
}

.inline-confirm {
  margin-block-start: var(--space-6);
  padding: var(--space-4);
  border: 1px solid var(--color-danger);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
}

.inline-confirm p {
  color: var(--color-muted);
  font-size: 0.875rem;
}

.instrument-bar {
  position: sticky;
  inset-block-start: 0;
  z-index: var(--z-sticky);
  display: grid;
  min-height: 3.5rem;
  grid-template-columns: minmax(12rem, 1fr) auto auto auto;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-4);
  border-block-end: 1px solid var(--color-border);
  background: var(--color-bg);
  font-size: 0.75rem;
}

.instrument-identity {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: var(--space-3);
  overflow: hidden;
  white-space: nowrap;
}

.instrument-identity > :last-child {
  overflow: hidden;
  color: var(--color-muted);
  text-overflow: ellipsis;
}

.bar-divider {
  width: 1px;
  height: 1.5rem;
  background: var(--color-border);
}

.session-readouts {
  display: flex;
  margin: 0;
}

.session-readouts div {
  display: grid;
  min-width: 4.5rem;
  padding-inline: var(--space-3);
  border-inline-start: 1px solid var(--color-border);
}

.session-readouts div.is-warning dd {
  color: var(--color-warning);
}

.workspace-tabs {
  display: flex;
  align-self: stretch;
  align-items: center;
}

.workspace-tabs button {
  align-self: stretch;
  padding-inline: var(--space-3);
  border: 0;
  border-block-end: 2px solid transparent;
  border-radius: 0;
  background: transparent;
  color: var(--color-muted);
  font-size: 0.75rem;
}

.workspace-tabs button:hover {
  color: var(--color-ink);
}

.workspace-tabs button.is-active {
  border-block-end-color: var(--color-primary);
  color: var(--color-ink);
}

.bar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

.text-button,
.icon-text-button {
  min-height: 2.25rem;
  padding-inline: var(--space-2);
  font-size: 0.75rem;
}

.rubric-dialog {
  width: min(100% - 2rem, 32rem);
  padding: var(--space-6);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-2);
  color: var(--color-ink);
}

.rubric-dialog::backdrop {
  background: oklch(0.03 0 0 / 0.82);
}

.rubric-dialog form {
  display: grid;
  gap: var(--space-3);
}

.rubric-dialog p:not(.system-label) {
  color: var(--color-muted);
}

.rubric-dialog label {
  color: var(--color-muted);
  font-size: 0.875rem;
  font-weight: 700;
}

.storage-blocker {
  position: fixed;
  inset: 4.5rem var(--space-4) auto;
  z-index: var(--z-overlay);
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4);
  border: 1px solid var(--color-danger);
  border-radius: var(--radius-sm);
  background: var(--color-surface-2);
}

.storage-blocker strong {
  color: var(--color-danger);
}

.storage-blocker p {
  flex: 1;
  margin: 0;
  color: var(--color-muted);
  font-size: 0.875rem;
}

.swipe-view {
  position: relative;
  display: grid;
  min-height: calc(100dvh - 3.5rem);
  grid-template-rows: auto minmax(32rem, 1fr) auto;
  overflow: hidden;
}

.swipe-mode-banner {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--space-2) var(--space-4);
  padding: var(--space-2) var(--space-4);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.swipe-mode-banner progress {
  width: 100%;
  height: 2px;
  grid-column: 1 / -1;
}

progress {
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: var(--color-surface-3);
  color: var(--color-primary);
  accent-color: var(--color-primary);
}

progress::-webkit-progress-bar {
  background: var(--color-surface-3);
}

progress::-webkit-progress-value {
  background: var(--color-primary);
}

progress::-moz-progress-bar {
  background: var(--color-primary);
}

.decision-zone {
  --label-color: var(--color-primary);
  position: absolute;
  z-index: 2;
  display: flex;
  min-width: 9.5rem;
  min-height: 2.75rem;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid color-mix(in oklch, var(--label-color) 58%, transparent);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--label-color);
  font-size: 0.75rem;
  transition:
    border-color 90ms var(--ease-out),
    box-shadow 90ms var(--ease-out),
    background-color 90ms var(--ease-out),
    transform 70ms var(--ease-out);
}

.decision-zone:hover,
.decision-zone:focus-visible {
  border-color: var(--label-color);
  background: color-mix(in oklch, var(--label-color) 7%, var(--color-bg));
  box-shadow: 0 0 1.25rem
    color-mix(in oklch, var(--label-color) 24%, transparent);
}

.decision-zone:active {
  transform: scale(0.98);
}

.decision-zone kbd {
  border-color: color-mix(in oklch, var(--label-color) 60%, transparent);
  color: var(--label-color);
}

.zone-top {
  inset-block-start: 4.75rem;
  inset-inline-start: 50%;
  transform: translateX(-50%);
}

.zone-top:active {
  transform: translateX(-50%) scale(0.98);
}

.zone-right {
  inset-block-start: 50%;
  inset-inline-end: var(--space-6);
  transform: translateY(-50%);
}

.zone-right:active {
  transform: translateY(-50%) scale(0.98);
}

.zone-left {
  inset-block-start: 50%;
  inset-inline-start: var(--space-6);
  transform: translateY(-50%);
}

.zone-left:active {
  transform: translateY(-50%) scale(0.98);
}

.zone-bottom {
  inset-block-end: 5.25rem;
  inset-inline-start: 50%;
  transform: translateX(-50%);
}

.zone-bottom:active {
  transform: translateX(-50%) scale(0.98);
}

.label-c {
  --label-color: var(--color-coincident);
}

.label-p {
  --label-color: var(--color-proximal);
}

.label-o {
  --label-color: var(--color-overlay);
}

.label-u {
  --label-color: var(--color-unclear);
}

.relation-stage {
  display: grid;
  width: min(100% - 24rem, 54rem);
  max-width: 54rem;
  align-content: center;
  align-self: stretch;
  justify-self: center;
  gap: var(--space-3);
  padding-block: 5.5rem;
}

.relation-card {
  width: 100%;
  min-height: 18rem;
  max-height: min(62dvh, 42rem);
  overflow: auto;
  touch-action: none;
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
  transition:
    transform 115ms var(--ease-out),
    opacity 100ms var(--ease-out),
    border-color 90ms var(--ease-out);
}

.relation-card.is-exiting {
  opacity: 0.16;
  border-color: var(--label-color);
}

.relation-card.exit-c {
  --label-color: var(--color-coincident);
  transform: translateY(-1.25rem);
}

.relation-card.exit-p {
  --label-color: var(--color-proximal);
  transform: translateX(1.25rem);
}

.relation-card.exit-o {
  --label-color: var(--color-overlay);
  transform: translateX(-1.25rem);
}

.relation-card.exit-u {
  --label-color: var(--color-unclear);
  transform: translateY(1.25rem);
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-block-end: 1px solid var(--color-border);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.card-meta span:first-child {
  color: var(--color-primary);
  font-weight: 700;
}

.relation-card pre {
  min-width: 0;
  margin: 0;
  padding: clamp(var(--space-4), 3vw, var(--space-8));
  overflow-wrap: anywhere;
  color: var(--color-ink);
  font-size: 1.0625rem;
  font-weight: 450;
  letter-spacing: 0.01em;
  line-height: 1.62;
  white-space: pre-wrap;
}

.note-composer {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
}

.note-heading,
.note-help {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.note-heading label {
  color: var(--color-ink);
  font-weight: 700;
}

.note-heading label span {
  margin-inline-start: var(--space-2);
  color: var(--color-warning);
  font-weight: 400;
}

.note-composer input {
  min-height: 2.75rem;
}

.note-help .text-button {
  padding: 0;
}

.swipe-actions {
  z-index: 3;
  display: flex;
  min-height: 3.75rem;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border-block-start: 1px solid var(--color-border);
  background: var(--color-bg);
}

.swipe-actions button {
  display: inline-flex;
  min-height: 2.75rem;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  color: var(--color-muted);
}

.swipe-actions button.is-active {
  border-color: var(--color-warning);
  background: color-mix(in oklch, var(--color-warning) 8%, var(--color-bg));
  color: var(--color-warning);
}

.action-spacer {
  flex: 1;
}

.view-heading {
  max-width: 62rem;
  margin-block-end: var(--space-8);
}

.view-heading > p:not(.system-label) {
  max-width: 70ch;
  color: var(--color-muted);
}

.metric-line {
  display: flex;
  flex-wrap: wrap;
  margin-block-end: var(--space-8);
  border-block: 1px solid var(--color-border);
}

.metric-line > div {
  display: grid;
  min-width: 11rem;
  flex: 1;
  gap: var(--space-2);
  padding: var(--space-4);
}

.metric-line > div + div {
  border-inline-start: 1px solid var(--color-border);
}

.metric-line span {
  color: var(--color-muted);
  font-size: 0.75rem;
}

.metric-line strong {
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
}

.analysis-section,
.form-section {
  margin-block-end: var(--space-8);
  padding: var(--space-6);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  margin-block-end: var(--space-4);
}

.section-heading h2 {
  margin: 0;
}

.section-heading > span {
  color: var(--color-muted);
  font-size: 0.75rem;
}

.pass-progress {
  display: grid;
  gap: var(--space-3);
}

.progress-row {
  display: grid;
  grid-template-columns: minmax(9rem, 1fr) minmax(12rem, 4fr) auto;
  align-items: center;
  gap: var(--space-4);
  color: var(--color-muted);
  font-size: 0.875rem;
}

.progress-row progress {
  width: 100%;
  height: 0.375rem;
}

.progress-row strong {
  color: var(--color-ink);
  font-variant-numeric: tabular-nums;
}

.blind-analysis-lock {
  display: flex;
  align-items: center;
  gap: var(--space-6);
  padding: var(--space-8);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.blind-analysis-lock > span {
  color: var(--color-primary);
  font-size: 2rem;
}

.blind-analysis-lock h2 {
  margin-block-end: var(--space-2);
}

.blind-analysis-lock p {
  max-width: 70ch;
  margin: 0;
  color: var(--color-muted);
}

.analysis-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
}

.analysis-grid .analysis-section {
  min-width: 0;
}

.analysis-section table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
  text-align: start;
}

.analysis-section th,
.analysis-section td {
  padding: var(--space-3);
  border-block-end: 1px solid var(--color-border);
  text-align: start;
}

.analysis-section thead th {
  color: var(--color-muted);
  font-size: 0.75rem;
  font-weight: 400;
}

.quota-panel > strong,
.coverage-panel > strong,
.alpha-panel > strong {
  display: block;
  margin-block-end: var(--space-3);
  font-size: 2rem;
  font-variant-numeric: tabular-nums;
}

.quota-panel progress,
.coverage-panel progress {
  width: 100%;
  height: 0.375rem;
}

.quota-panel p,
.coverage-panel p {
  margin-block: var(--space-3) 0;
  color: var(--color-muted);
  font-size: 0.75rem;
}

.data-table-wrap {
  width: 100%;
  margin-block-end: var(--space-4);
  overflow-x: auto;
}

.data-table {
  min-width: 48rem;
}

.distribution {
  display: flex;
  width: 10rem;
  height: 0.375rem;
  overflow: hidden;
  background: var(--color-surface-3);
}

.distribution span {
  width: var(--share);
  background: var(--label-color);
}

.label-sequence {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}

.label-sequence span {
  display: inline-grid;
  width: 1.5rem;
  height: 1.5rem;
  place-items: center;
  border: 1px solid color-mix(in oklch, var(--label-color) 65%, transparent);
  border-radius: var(--radius-xs);
  color: var(--label-color);
  font-size: 0.75rem;
}

.empty-inline {
  display: grid;
  gap: var(--space-1);
  padding: var(--space-6) 0;
  color: var(--color-muted);
}

.empty-inline strong {
  color: var(--color-ink);
}

.throughput-note {
  display: flex;
  align-items: baseline;
  gap: var(--space-4);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.throughput-note strong {
  color: var(--color-warning);
  white-space: nowrap;
}

.review-view {
  max-width: 62rem;
}

.missed-list {
  display: grid;
  gap: var(--space-6);
  padding: 0;
  list-style: none;
}

.missed-list li {
  padding: var(--space-6);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.missed-result {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3) var(--space-6);
  margin-block-end: var(--space-4);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.missed-list pre {
  padding-block: var(--space-4);
  overflow-wrap: anywhere;
  color: var(--color-ink);
  font-size: 1rem;
  line-height: 1.55;
  white-space: pre-wrap;
}

.missed-list p {
  margin: 0;
  color: var(--color-muted);
}

.label-text {
  color: var(--label-color);
}

.completion-view {
  display: grid;
  min-height: calc(100dvh - 3.5rem);
  place-content: center;
  justify-items: center;
  padding: var(--space-8);
  text-align: center;
}

.completion-view.embedded {
  min-height: 28rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.completion-view p:not(.system-label) {
  max-width: 65ch;
  color: var(--color-muted);
}

.completion-signal {
  display: grid;
  width: 3rem;
  height: 3rem;
  margin-block-end: var(--space-6);
  place-items: center;
  border: 1px solid var(--color-success);
  border-radius: 50%;
  color: var(--color-success);
}

.builder-files,
.merge-imports {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
  margin-block-end: var(--space-8);
}

.merge-imports {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.drop-zone {
  display: grid;
  min-height: 10rem;
  place-content: center;
  justify-items: center;
  gap: var(--space-2);
  padding: var(--space-6);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
  color: var(--color-muted);
  text-align: center;
  transition:
    border-color 120ms var(--ease-out),
    background-color 120ms var(--ease-out);
}

.drop-zone:hover,
.drop-zone.is-dragging {
  border-color: var(--color-primary);
  background: color-mix(
    in oklch,
    var(--color-primary) 7%,
    var(--color-surface-1)
  );
}

.drop-zone.has-file {
  border-style: solid;
  border-color: color-mix(
    in oklch,
    var(--color-success) 55%,
    var(--color-border)
  );
}

.drop-zone input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.drop-zone strong {
  color: var(--color-ink);
  overflow-wrap: anywhere;
}

.drop-zone span:last-child {
  font-size: 0.75rem;
}

.drop-icon {
  display: grid;
  width: 2.5rem;
  height: 2.5rem;
  place-items: center;
  border: 1px solid var(--color-border);
  border-radius: 50%;
  color: var(--color-primary);
}

.builder-form {
  margin-block-end: var(--space-12);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
}

.form-grid.compact {
  align-content: start;
}

.field-wide {
  grid-column: 1 / -1;
}

.assignment-fields {
  display: grid;
  grid-template-columns: minmax(16rem, 1.5fr) minmax(16rem, 1fr);
  gap: var(--space-6);
}

.field-roster textarea {
  min-height: 14rem;
}

.build-result {
  padding: var(--space-8);
  border: 1px solid var(--color-primary);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.build-result-heading {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: var(--space-4);
}

.build-result-heading h2 {
  font-size: 1.5rem;
}

.build-result-heading code {
  padding: var(--space-2);
  border: 1px solid var(--color-border);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.download-stack {
  margin-block-start: var(--space-6);
}

.result-warning {
  max-width: 75ch;
  margin-block: var(--space-4) 0;
  color: var(--color-warning);
  font-size: 0.75rem;
}

.file-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-block-end: var(--space-4);
}

.file-chips > span {
  display: inline-flex;
  min-height: 2rem;
  align-items: center;
  gap: var(--space-2);
  padding-inline-start: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-1);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.file-chips strong {
  max-width: 18rem;
  overflow: hidden;
  color: var(--color-ink);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-chips button {
  align-self: stretch;
  border: 0;
  border-inline-start: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-muted);
}

.merge-empty {
  display: grid;
  min-height: 24rem;
  place-content: center;
  justify-items: center;
  padding: var(--space-8);
  border: 1px solid var(--color-border);
  color: var(--color-muted);
  text-align: center;
}

.merge-empty > div {
  color: var(--color-primary);
  font-size: 2rem;
}

.merge-empty h2 {
  margin-block: var(--space-4) var(--space-2);
  color: var(--color-ink);
}

.merge-empty p {
  max-width: 60ch;
}

.alpha-panel > strong {
  color: var(--color-primary);
}

.alpha-panel dl {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  margin: 0;
}

.alpha-panel dl div {
  display: flex;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
}

.alpha-panel dt {
  color: var(--color-muted);
}

.alpha-panel dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.resolve-heading {
  display: flex;
  max-width: none;
  align-items: end;
  justify-content: space-between;
  gap: var(--space-6);
}

.resolve-heading dl {
  display: flex;
  margin: 0;
}

.resolve-heading dl div {
  min-width: 6rem;
  padding: var(--space-2) var(--space-4);
  border-inline-start: 1px solid var(--color-border);
}

.resolve-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(20rem, 1fr);
  gap: var(--space-6);
  margin-block-end: var(--space-8);
}

.resolve-card,
.resolve-form {
  min-width: 0;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-1);
}

.resolve-card {
  overflow: hidden;
}

.resolve-card-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-block-end: 1px solid var(--color-border);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.resolve-card-meta code {
  color: var(--color-primary);
}

.resolve-card > pre {
  min-height: 18rem;
  margin: 0;
  padding: var(--space-6);
  overflow-wrap: anywhere;
  font-size: 1rem;
  line-height: 1.6;
  white-space: pre-wrap;
}

.evidence-sequence {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4);
  border-block-start: 1px solid var(--color-border);
}

.evidence-sequence > span {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0 var(--space-2);
  padding: var(--space-2);
  border: 1px solid
    color-mix(in oklch, var(--label-color) 45%, var(--color-border));
  color: var(--color-muted);
  font-size: 0.75rem;
}

.evidence-sequence strong {
  grid-row: 1 / 3;
  align-self: center;
  color: var(--label-color);
  font-size: 1.125rem;
}

.evidence-notes {
  padding: var(--space-4);
  border-block-start: 1px solid var(--color-border);
}

.evidence-notes blockquote {
  margin: var(--space-3) 0;
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  background: var(--color-bg);
}

.evidence-notes blockquote p {
  margin-block-end: var(--space-2);
}

.evidence-notes cite {
  color: var(--color-muted);
  font-size: 0.75rem;
  font-style: normal;
}

.resolve-form {
  display: grid;
  align-content: start;
  gap: var(--space-4);
  padding: var(--space-6);
}

.label-choice {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-2);
  padding: 0;
  border: 0;
}

.label-choice legend {
  margin-block-end: var(--space-2);
  color: var(--color-muted);
  font-size: 0.75rem;
}

.label-choice button {
  display: grid;
  min-height: 4rem;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3);
  border: 1px solid
    color-mix(in oklch, var(--label-color) 50%, var(--color-border));
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--label-color);
  text-align: start;
}

.label-choice button:hover {
  border-color: var(--label-color);
  background: color-mix(in oklch, var(--label-color) 8%, var(--color-bg));
}

@media (max-width: 75rem) {
  .instrument-bar {
    grid-template-columns: minmax(9rem, 1fr) auto auto;
  }

  .session-readouts {
    display: none;
  }

  .relation-stage {
    width: min(100% - 18rem, 50rem);
  }

  .decision-zone {
    min-width: 7rem;
  }

  .zone-left {
    inset-inline-start: var(--space-4);
  }

  .zone-right {
    inset-inline-end: var(--space-4);
  }
}

@media (max-width: 58rem) {
  .instrument-bar {
    grid-template-columns: 1fr auto;
    gap: var(--space-2);
  }

  .workspace-tabs {
    grid-row: 2;
    grid-column: 1 / -1;
    min-height: 2.75rem;
    border-block-start: 1px solid var(--color-border);
  }

  .workspace-tabs button {
    flex: 1;
  }

  .bar-actions .text-button {
    display: none;
  }

  .swipe-view {
    min-height: calc(100dvh - 6.25rem);
  }

  .relation-stage {
    width: min(100% - 3rem, 46rem);
    padding-block: 7rem;
  }

  .zone-left,
  .zone-right {
    inset-block-start: auto;
    inset-block-end: 4.75rem;
    transform: none;
  }

  .zone-left {
    inset-inline-start: var(--space-4);
  }

  .zone-right {
    inset-inline-end: var(--space-4);
  }

  .zone-left:active,
  .zone-right:active {
    transform: scale(0.98);
  }

  .zone-bottom {
    inset-block-end: 4.75rem;
  }

  .swipe-actions {
    padding-block-end: max(var(--space-2), env(safe-area-inset-bottom));
  }

  .capability-strip,
  .analysis-grid,
  .builder-files,
  .merge-imports,
  .resolve-layout {
    grid-template-columns: 1fr;
  }

  .capability-strip div + div {
    border-block-start: 1px solid var(--color-border);
    border-inline-start: 0;
  }

  .assignment-fields {
    grid-template-columns: 1fr;
  }

  .resolve-heading {
    align-items: start;
    flex-direction: column;
  }
}

@media (max-width: 42rem) {
  .public-header {
    align-items: stretch;
    flex-direction: column;
    padding: var(--space-2) var(--space-4);
  }

  .public-header nav button {
    flex: 1;
  }

  .home-view,
  .builder-view,
  .merge-view,
  .analysis-view,
  .review-view,
  .resolve-view {
    width: min(100% - 1.25rem, 80rem);
    padding-block: var(--space-8);
  }

  .home-intro {
    padding-block: var(--space-12);
  }

  .home-intro h1 {
    font-size: 2.25rem;
  }

  .button-row > .button,
  .home-actions > .button,
  .completion-actions > .button,
  .download-stack > .button {
    width: 100%;
  }

  .study-facts,
  .result-facts,
  .form-grid {
    grid-template-columns: 1fr;
  }

  .field-wide {
    grid-column: auto;
  }

  .instrument-identity > :last-child,
  .bar-actions .icon-text-button:last-child {
    display: none;
  }

  .instrument-bar {
    padding-inline: var(--space-3);
  }

  .swipe-mode-banner {
    padding-inline: var(--space-3);
  }

  .relation-stage {
    width: calc(100% - 1rem);
    padding-block: 5.5rem 8rem;
  }

  .relation-card {
    min-height: 15rem;
    max-height: 54dvh;
  }

  .relation-card pre {
    padding: var(--space-4);
    font-size: 1rem;
  }

  .decision-zone {
    min-width: 0;
    min-height: 2.75rem;
    padding-inline: var(--space-2);
  }

  .decision-zone strong {
    font-size: 0.6875rem;
  }

  .zone-top {
    inset-block-start: 4.25rem;
  }

  .zone-left,
  .zone-right,
  .zone-bottom {
    inset-block-end: 4.5rem;
  }

  .zone-left {
    inset-inline-start: var(--space-2);
  }

  .zone-right {
    inset-inline-end: var(--space-2);
  }

  .swipe-actions {
    padding-inline: var(--space-2);
  }

  .swipe-actions button {
    min-width: 2.75rem;
    justify-content: center;
    padding-inline: var(--space-2);
  }

  .swipe-actions button span {
    display: none;
  }

  .progress-row {
    grid-template-columns: 1fr auto;
  }

  .progress-row progress {
    grid-row: 2;
    grid-column: 1 / -1;
  }

  .metric-line {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
  }

  .metric-line > div {
    min-width: 0;
  }

  .metric-line > div + div {
    border-inline-start: 0;
  }

  .metric-line > div:nth-child(even) {
    border-inline-start: 1px solid var(--color-border);
  }

  .metric-line > div:nth-child(n + 3) {
    border-block-start: 1px solid var(--color-border);
  }

  .analysis-section,
  .form-section,
  .build-result,
  .resolve-form {
    padding: var(--space-4);
  }

  .section-heading {
    align-items: start;
    flex-direction: column;
    gap: var(--space-1);
  }

  .throughput-note {
    align-items: start;
    flex-direction: column;
    gap: var(--space-2);
  }

  .build-result-heading {
    flex-direction: column;
  }

  .label-choice {
    grid-template-columns: 1fr;
  }
}

    <script>
(() => {
"use strict";

const SCHEMA_VERSION = "salt-study-v1";
const SWIPE_SCHEMA_VERSION = "salt-swipes-v1";
const ADJUDICATION_SCHEMA_VERSION = "salt-adjudications-v1";

const LABELS = Object.freeze(["C", "P", "O", "U"]);

const LABEL_DETAILS = Object.freeze({
  C: { name: "Coincident", direction: "up", arrow: "↑" },
  P: { name: "Proximal", direction: "right", arrow: "→" },
  O: { name: "Overlay", direction: "left", arrow: "←" },
  U: { name: "Unclear", direction: "down", arrow: "↓" },
});

const CROCKFORD = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const ANNOTATOR_ID_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/u;

class SaltValidationError extends Error {
  constructor(message, issues = []) {
    super(message);
    this.name = "SaltValidationError";
    this.issues = issues;
  }
}

const isRecord = (value) =>
  value !== null && typeof value === "object" && !Array.isArray(value);

const requireString = (record, key, lineNumber, issues) => {
  const value = record[key];
  if (typeof value !== "string" || value.trim() === "") {
    issues.push(`Line ${lineNumber}: "${key}" must be a non-empty string.`);
    return "";
  }
  return value.trim();
};

const isLabel = (value) => LABELS.includes(value);

const normalizeCard = (record, lineNumber, qualification, issues) => {
  if (!isRecord(record)) {
    issues.push(`Line ${lineNumber}: expected a JSON object.`);
    return null;
  }

  const relationId = requireString(record, "relation_id", lineNumber, issues);
  const familyId = requireString(record, "family_id", lineNumber, issues);
  const cardText = requireString(record, "card_text", lineNumber, issues);
  const cardHash = requireString(record, "card_hash", lineNumber, issues);
  const prescreen = record.prescreen;

  if (prescreen !== "equivalence" && prescreen !== "normal") {
    issues.push(
      `Line ${lineNumber}: "prescreen" must be "equivalence" or "normal".`,
    );
  }

  const card = {
    relation_id: relationId,
    family_id: familyId,
    card_text: cardText,
    card_hash: cardHash,
    prescreen,
  };

  if (qualification) {
    const answer = record.answer ?? record.gold_label;
    const rationale = record.rationale;
    if (!isLabel(answer)) {
      issues.push(
        `Line ${lineNumber}: qualification "answer" must be C/P/O/U.`,
      );
    }
    if (typeof rationale !== "string" || rationale.trim() === "") {
      issues.push(
        `Line ${lineNumber}: qualification "rationale" must be a non-empty string.`,
      );
    }
    return {
      ...card,
      answer,
      rationale: typeof rationale === "string" ? rationale.trim() : "",
    };
  }

  return card;
};

const parseCardsJsonl = (text, { qualification = false } = {}) => {
  const issues = [];
  const cards = [];
  const relationIds = new Set();
  const cardHashes = new Set();

  text.split(/\r?\n/u).forEach((line, lineIndex) => {
    if (line.trim() === "") {
      return;
    }

    let parsed;
    try {
      parsed = JSON.parse(line);
    } catch (error) {
      issues.push(
        `Line ${lineIndex + 1}: invalid JSON (${error instanceof Error ? error.message : String(error)}).`,
      );
      return;
    }

    const card = normalizeCard(parsed, lineIndex + 1, qualification, issues);
    if (!card) {
      return;
    }

    if (relationIds.has(card.relation_id)) {
      issues.push(
        `Line ${lineIndex + 1}: duplicate relation_id "${card.relation_id}".`,
      );
    }
    if (cardHashes.has(card.card_hash)) {
      issues.push(
        `Line ${lineIndex + 1}: duplicate card_hash "${card.card_hash}".`,
      );
    }
    relationIds.add(card.relation_id);
    cardHashes.add(card.card_hash);
    cards.push(card);
  });

  if (cards.length === 0) {
    issues.push("The file contains no cards.");
  }
  if (issues.length > 0) {
    throw new SaltValidationError("Card import failed.", issues);
  }
  return cards;
};

const cardsToJsonl = (cards) =>
  `${cards.map((card) => JSON.stringify(card)).join("\n")}\n`;

const parseRoster = (text) => {
  const ids = text
    .split(/\r?\n|,/u)
    .map((value) => value.trim())
    .filter(Boolean);
  const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);

  if (ids.length === 0) {
    throw new SaltValidationError("Add at least one annotator ID.");
  }
  if (duplicates.length > 0) {
    throw new SaltValidationError(
      `Annotator IDs must be unique: ${[...new Set(duplicates)].join(", ")}.`,
    );
  }
  const invalidIds = ids.filter(
    (annotatorId) => !ANNOTATOR_ID_PATTERN.test(annotatorId),
  );
  if (invalidIds.length > 0) {
    throw new SaltValidationError(
      `Annotator IDs may contain only letters, numbers, periods, underscores, and hyphens (maximum 64 characters): ${invalidIds.join(", ")}.`,
    );
  }
  return ids;
};

const stableStringify = (value) => {
  if (value === null || typeof value !== "object") {
    return JSON.stringify(value);
  }
  if (Array.isArray(value)) {
    return `[${value.map((entry) => stableStringify(entry)).join(",")}]`;
  }
  return `{${Object.keys(value)
    .sort()
    .map((key) => `${JSON.stringify(key)}:${stableStringify(value[key])}`)
    .join(",")}}`;
};

const rotateRight = (value, amount) =>
  (value >>> amount) | (value << (32 - amount));

const SHA256_CONSTANTS = Object.freeze([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1,
  0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3,
  0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786,
  0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147,
  0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13,
  0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b,
  0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a,
  0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
  0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
]);

const sha256Hex = (value) => {
  const bytes = new TextEncoder().encode(value);
  const paddedLength = Math.ceil((bytes.length + 9) / 64) * 64;
  const padded = new Uint8Array(paddedLength);
  padded.set(bytes);
  padded[bytes.length] = 0x80;

  const paddedView = new DataView(padded.buffer);
  const bitLength = bytes.length * 8;
  paddedView.setUint32(paddedLength - 8, Math.floor(bitLength / 2 ** 32));
  paddedView.setUint32(paddedLength - 4, bitLength >>> 0);

  const hash = [
    0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c,
    0x1f83d9ab, 0x5be0cd19,
  ];
  const words = new Uint32Array(64);

  for (let offset = 0; offset < paddedLength; offset += 64) {
    for (let wordIndex = 0; wordIndex < 16; wordIndex += 1) {
      words[wordIndex] = paddedView.getUint32(offset + wordIndex * 4);
    }
    for (let wordIndex = 16; wordIndex < 64; wordIndex += 1) {
      const word15 = words[wordIndex - 15];
      const word2 = words[wordIndex - 2];
      const sigma0 =
        rotateRight(word15, 7) ^ rotateRight(word15, 18) ^ (word15 >>> 3);
      const sigma1 =
        rotateRight(word2, 17) ^ rotateRight(word2, 19) ^ (word2 >>> 10);
      words[wordIndex] =
        (words[wordIndex - 16] + sigma0 + words[wordIndex - 7] + sigma1) >>> 0;
    }

    let [a, b, c, d, e, f, g, h] = hash;
    for (let round = 0; round < 64; round += 1) {
      const choice = (e & f) ^ (~e & g);
      const majority = (a & b) ^ (a & c) ^ (b & c);
      const bigSigma0 =
        rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
      const bigSigma1 =
        rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
      const first =
        (h + bigSigma1 + choice + SHA256_CONSTANTS[round] + words[round]) >>> 0;
      const second = (bigSigma0 + majority) >>> 0;
      h = g;
      g = f;
      f = e;
      e = (d + first) >>> 0;
      d = c;
      c = b;
      b = a;
      a = (first + second) >>> 0;
    }

    hash[0] = (hash[0] + a) >>> 0;
    hash[1] = (hash[1] + b) >>> 0;
    hash[2] = (hash[2] + c) >>> 0;
    hash[3] = (hash[3] + d) >>> 0;
    hash[4] = (hash[4] + e) >>> 0;
    hash[5] = (hash[5] + f) >>> 0;
    hash[6] = (hash[6] + g) >>> 0;
    hash[7] = (hash[7] + h) >>> 0;
  }

  return hash.map((part) => part.toString(16).padStart(8, "0")).join("");
};

const deriveSeed = (seed, ...parts) =>
  Number.parseInt(
    sha256Hex([String(seed), ...parts.map(String)].join("\u001f")).slice(0, 8),
    16,
  ) >>> 0;

const createRandom = (seed) => {
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6d2b79f5) >>> 0;
    let value = state;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 2 ** 32;
  };
};

const shuffled = (values, seed) => {
  const result = [...values];
  const random = createRandom(seed);
  for (let index = result.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(random() * (index + 1));
    [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
  }
  return result;
};

const shuffleCardText = (cardText, seed) => {
  const [heading, ...exampleLines] = cardText.split(/\r?\n/u);
  const examples = exampleLines.filter((line) => line.trim() !== "");
  if (examples.length < 2) {
    return cardText;
  }
  return [heading, ...shuffled(examples, seed)].join("\n");
};

const compareAssignmentCandidates = (
  left,
  right,
  totalLoads,
  stratumLoads,
  tieBreakers,
) =>
  totalLoads.get(left) - totalLoads.get(right) ||
  stratumLoads.get(left) - stratumLoads.get(right) ||
  tieBreakers.get(left) - tieBreakers.get(right) ||
  left.localeCompare(right);

const generateAssignments = ({
  cards,
  annotatorIds,
  coverageTarget,
  sliceSize,
  seed,
}) => {
  if (!Number.isInteger(coverageTarget) || coverageTarget < 1) {
    throw new SaltValidationError(
      "Coverage target must be a positive integer.",
    );
  }
  if (coverageTarget > annotatorIds.length) {
    throw new SaltValidationError(
      `Coverage ${coverageTarget} requires at least ${coverageTarget} annotators.`,
    );
  }
  if (!Number.isInteger(sliceSize) || sliceSize < 1) {
    throw new SaltValidationError("Slice cap must be a positive integer.");
  }

  const minimumLargestSlice = Math.ceil(
    (cards.length * coverageTarget) / annotatorIds.length,
  );
  if (minimumLargestSlice > sliceSize) {
    throw new SaltValidationError(
      `The slice cap is too small. This study needs at least ${minimumLargestSlice} cards per annotator for ${coverageTarget}× coverage.`,
    );
  }

  const assignments = new Map(
    annotatorIds.map((annotatorId) => [annotatorId, []]),
  );
  const totalLoads = new Map(
    annotatorIds.map((annotatorId) => [annotatorId, 0]),
  );
  const stratumLoadsByName = new Map();

  for (const stratum of ["equivalence", "normal"]) {
    const cardsInStratum = shuffled(
      cards.filter((card) => card.prescreen === stratum),
      deriveSeed(seed, "assignment-card-order", stratum),
    );
    const stratumLoads = new Map(
      annotatorIds.map((annotatorId) => [annotatorId, 0]),
    );
    stratumLoadsByName.set(stratum, stratumLoads);

    for (const card of cardsInStratum) {
      const selected = new Set();
      for (let copy = 0; copy < coverageTarget; copy += 1) {
        const tieBreakers = new Map(
          annotatorIds.map((annotatorId) => [
            annotatorId,
            deriveSeed(
              seed,
              "assignment-tie",
              stratum,
              card.relation_id,
              copy,
              annotatorId,
            ),
          ]),
        );
        const candidates = annotatorIds
          .filter(
            (annotatorId) =>
              !selected.has(annotatorId) &&
              totalLoads.get(annotatorId) < sliceSize,
          )
          .sort((left, right) =>
            compareAssignmentCandidates(
              left,
              right,
              totalLoads,
              stratumLoads,
              tieBreakers,
            ),
          );
        const chosen = candidates[0];
        if (!chosen) {
          throw new SaltValidationError(
            `Unable to assign ${card.relation_id} within the configured slice cap.`,
          );
        }
        assignments.get(chosen).push(card.relation_id);
        totalLoads.set(chosen, totalLoads.get(chosen) + 1);
        stratumLoads.set(chosen, stratumLoads.get(chosen) + 1);
        selected.add(chosen);
      }
    }
  }

  return {
    assignments: Object.fromEntries(
      annotatorIds.map((annotatorId) => [
        annotatorId,
        [...assignments.get(annotatorId)].sort(),
      ]),
    ),
    loads: Object.fromEntries(totalLoads),
    stratum_loads: Object.fromEntries(
      [...stratumLoadsByName].map(([stratum, loads]) => [
        stratum,
        Object.fromEntries(loads),
      ]),
    ),
  };
};

const normalizeAccessCode = (value) =>
  value
    .toUpperCase()
    .replace(/[^0-9A-Z]/gu, "")
    .replace(/[ILOU]/gu, "");

const codeChecksum = (body) => {
  let total = 0;
  for (const character of body) {
    total = (total * 33 + CROCKFORD.indexOf(character)) % CROCKFORD.length;
  }
  return CROCKFORD[total];
};

const createAccessCode = (studySeed, annotatorId) => {
  const random = createRandom(
    deriveSeed(studySeed, "annotator-access-code", annotatorId),
  );
  let body = "";
  for (let index = 0; index < 7; index += 1) {
    body += CROCKFORD[Math.floor(random() * CROCKFORD.length)];
  }
  const compact = `${body}${codeChecksum(body)}`;
  return `${compact.slice(0, 4)}-${compact.slice(4)}`;
};

const isAccessCodeWellFormed = (value) => {
  const compact = normalizeAccessCode(value);
  if (compact.length !== 8) {
    return false;
  }
  return codeChecksum(compact.slice(0, 7)) === compact.at(-1);
};

const accessCodeHash = (studyId, code) =>
  sha256Hex(`${studyId}\u001f${normalizeAccessCode(code)}`);

const createStudy = ({
  cards,
  qualificationCards = [],
  annotatorIds,
  seed,
  coverageTarget = 2,
  sliceSize = 150,
  rubricVersion = "v0.3",
  coincidentTarget = 300,
  title = "SALT geometry adjudication",
}) => {
  if (!Array.isArray(cards) || cards.length === 0) {
    throw new SaltValidationError(
      "A study needs at least one production card.",
    );
  }
  if (!Array.isArray(annotatorIds) || annotatorIds.length === 0) {
    throw new SaltValidationError("A study needs at least one annotator.");
  }
  if (new Set(annotatorIds).size !== annotatorIds.length) {
    throw new SaltValidationError("Annotator IDs must be unique.");
  }
  if (
    annotatorIds.some(
      (annotatorId) =>
        typeof annotatorId !== "string" ||
        !ANNOTATOR_ID_PATTERN.test(annotatorId),
    )
  ) {
    throw new SaltValidationError(
      "Annotator IDs may contain only letters, numbers, periods, underscores, and hyphens (maximum 64 characters).",
    );
  }
  if (typeof rubricVersion !== "string" || rubricVersion.trim() === "") {
    throw new SaltValidationError("Rubric version is required.");
  }
  if (!Number.isInteger(coincidentTarget) || coincidentTarget < 1) {
    throw new SaltValidationError(
      "The Coincident quota target must be a positive integer.",
    );
  }

  const normalizedSeed = String(seed).trim();
  if (normalizedSeed === "") {
    throw new SaltValidationError("A study seed is required.");
  }
  const deckHash = sha256Hex(stableStringify(cards));
  const assignmentResult = generateAssignments({
    cards,
    annotatorIds,
    coverageTarget,
    sliceSize,
    seed: normalizedSeed,
  });
  const studyId = `salt-${sha256Hex(
    stableStringify({
      deckHash,
      seed: normalizedSeed,
      coverageTarget,
      sliceSize,
      assignments: assignmentResult.assignments,
    }),
  ).slice(0, 12)}`;

  const codeSheet = annotatorIds.map((annotatorId) => {
    const code = createAccessCode(normalizedSeed, annotatorId);
    return {
      annotator_id: annotatorId,
      code,
      assigned_cards: assignmentResult.loads[annotatorId],
    };
  });

  const study = {
    schema_version: SCHEMA_VERSION,
    kind: "study",
    study_id: studyId,
    title: title.trim() || "SALT geometry adjudication",
    deck_hash: deckHash,
    seed: normalizedSeed,
    rubric_version: rubricVersion.trim(),
    coverage_target: coverageTarget,
    slice_size: sliceSize,
    coincident_target: coincidentTarget,
    required_production_passes: 1,
    cards,
    qualification_cards: qualificationCards,
    manifest: {
      annotator_ids: annotatorIds,
      assignments: assignmentResult.assignments,
      loads: assignmentResult.loads,
      stratum_loads: assignmentResult.stratum_loads,
    },
    access: codeSheet.map(({ annotator_id: annotatorId, code }) => ({
      annotator_id: annotatorId,
      code_hash: accessCodeHash(studyId, code),
    })),
  };

  return { study, codeSheet };
};

const resolveAnnotatorCode = (study, code) => {
  if (!isAccessCodeWellFormed(code)) {
    return null;
  }
  const hash = accessCodeHash(study.study_id, code);
  return (
    study.access.find((entry) => entry.code_hash === hash)?.annotator_id ?? null
  );
};

const deckSeedFor = (study, annotatorId, pass) =>
  deriveSeed(study.seed, "production-deck", annotatorId, pass);

const exampleSeedFor = (study, annotatorId, pass, card) =>
  deriveSeed(study.seed, "card-examples", annotatorId, pass, card.card_hash);

const qualificationSeedFor = (study, annotatorId) =>
  deriveSeed(study.seed, "qualification-deck", annotatorId);

const projectSwipes = (events) => {
  const retractions = new Map(
    events
      .filter((event) => event.event_type === "retraction")
      .map((event) => [event.swipe_id, event.ts]),
  );

  return events
    .filter((event) => event.event_type === "swipe")
    .map((event) => ({
      ...event.swipe,
      retracted: retractions.has(event.swipe.swipe_id),
      ...(retractions.has(event.swipe.swipe_id)
        ? { retracted_at: retractions.get(event.swipe.swipe_id) }
        : {}),
    }));
};

const activeSwipes = (eventsOrSwipes) => {
  const swipes = eventsOrSwipes.some((entry) => entry.event_type)
    ? projectSwipes(eventsOrSwipes)
    : eventsOrSwipes;
  return swipes.filter((swipe) => !swipe.retracted);
};

const relationHasLocalDisagreement = (
  events,
  relationId,
  annotatorId,
) => {
  const labels = activeSwipes(events)
    .filter(
      (swipe) =>
        !swipe.qualification &&
        swipe.relation_id === relationId &&
        swipe.annotator_id === annotatorId,
    )
    .map((swipe) => swipe.label);
  return labels.includes("U") || new Set(labels).size > 1;
};

const getProductionDeck = ({
  study,
  annotatorId,
  pass,
  events = [],
}) => {
  const assignedIds = new Set(study.manifest.assignments[annotatorId] ?? []);
  const completedIds = new Set(
    activeSwipes(events)
      .filter(
        (swipe) =>
          !swipe.qualification &&
          swipe.annotator_id === annotatorId &&
          swipe.pass === pass,
      )
      .map((swipe) => swipe.relation_id),
  );
  const ordered = shuffled(
    study.cards.filter(
      (card) =>
        assignedIds.has(card.relation_id) &&
        (pass < 4 ||
          relationHasLocalDisagreement(events, card.relation_id, annotatorId)),
    ),
    deckSeedFor(study, annotatorId, pass),
  );
  return ordered.filter((card) => !completedIds.has(card.relation_id));
};

const getQualificationDeck = ({ study, annotatorId, events = [] }) => {
  const completedIds = new Set(
    activeSwipes(events)
      .filter(
        (swipe) => swipe.qualification && swipe.annotator_id === annotatorId,
      )
      .map((swipe) => swipe.relation_id),
  );
  return shuffled(
    study.qualification_cards,
    qualificationSeedFor(study, annotatorId),
  ).filter((card) => !completedIds.has(card.relation_id));
};

const nextIncompletePass = (study, annotatorId, events) => {
  const assignedCount = study.manifest.assignments[annotatorId]?.length ?? 0;
  if (assignedCount === 0) {
    return 1;
  }
  for (let pass = 1; pass < 10_000; pass += 1) {
    const count = activeSwipes(events).filter(
      (swipe) =>
        !swipe.qualification &&
        swipe.annotator_id === annotatorId &&
        swipe.pass === pass,
    ).length;
    if (pass >= 4) {
      const targetedCount = study.cards.filter((card) =>
        relationHasLocalDisagreement(events, card.relation_id, annotatorId),
      ).length;
      if (count < targetedCount) {
        return pass;
      }
    } else if (count < assignedCount) {
      return pass;
    }
  }
  return 1;
};

const nextMonotoneTimestamp = (
  lastTimestampMs = 0,
  now = Date.now(),
) => {
  const timestampMs = Math.max(now, lastTimestampMs + 1);
  return {
    timestampMs,
    iso: new Date(timestampMs).toISOString(),
  };
};

class DecisionTimer {
  constructor(now = () => performance.now()) {
    this.now = now;
    this.startedAt = null;
    this.pausedAt = null;
    this.pausedDuration = 0;
  }

  start() {
    this.startedAt = this.now();
    this.pausedAt = null;
    this.pausedDuration = 0;
  }

  pause() {
    if (this.startedAt !== null && this.pausedAt === null) {
      this.pausedAt = this.now();
    }
  }

  resume() {
    if (this.pausedAt !== null) {
      this.pausedDuration += this.now() - this.pausedAt;
      this.pausedAt = null;
    }
  }

  elapsed() {
    if (this.startedAt === null) {
      return 0;
    }
    const end = this.pausedAt ?? this.now();
    return Math.max(0, Math.round(end - this.startedAt - this.pausedDuration));
  }
}

const createSwipeEvent = ({
  study,
  annotatorId,
  card,
  pass,
  label,
  latencyMs,
  flagged,
  note,
  rubricVersion,
  qualification,
  sessionId,
  sequence,
  timestamp,
}) => {
  if (!isLabel(label)) {
    throw new SaltValidationError(`Unknown label "${label}".`);
  }
  const swipeId = [
    study.study_id,
    annotatorId,
    qualification ? "q" : pass,
    card.relation_id,
    sequence,
    timestamp.timestampMs,
  ].join(":");
  return {
    event_type: "swipe",
    swipe: {
      schema_version: SWIPE_SCHEMA_VERSION,
      swipe_id: swipeId,
      session_id: sessionId,
      study_id: study.study_id,
      deck_hash: study.deck_hash,
      annotator_id: annotatorId,
      relation_id: card.relation_id,
      family_id: card.family_id,
      card_hash: card.card_hash,
      prescreen: card.prescreen,
      pass,
      label,
      latency_ms: Math.max(0, Math.round(latencyMs)),
      flagged: Boolean(flagged),
      note: note?.trim() || null,
      qualification: Boolean(qualification),
      rubric_version: rubricVersion,
      shuffle_seed: qualification
        ? qualificationSeedFor(study, annotatorId)
        : deckSeedFor(study, annotatorId, pass),
      ts: timestamp.iso,
    },
  };
};

const latestUndoableSwipe = (events, sessionId) => {
  const projected = projectSwipes(events);
  for (let index = projected.length - 1; index >= 0; index -= 1) {
    const swipe = projected[index];
    if (swipe.session_id === sessionId && !swipe.retracted) {
      return swipe;
    }
  }
  return null;
};

const swipesToJsonl = (events) => {
  const swipes = projectSwipes(events);
  return swipes.length === 0
    ? ""
    : `${swipes.map((swipe) => JSON.stringify(swipe)).join("\n")}\n`;
};

const parseSwipesJsonl = (text, sourceName = "swipes.jsonl") => {
  const issues = [];
  const swipes = [];
  text.split(/\r?\n/u).forEach((line, lineIndex) => {
    if (line.trim() === "") {
      return;
    }
    let record;
    try {
      record = JSON.parse(line);
    } catch (error) {
      issues.push(
        `${sourceName}:${lineIndex + 1}: invalid JSON (${error instanceof Error ? error.message : String(error)}).`,
      );
      return;
    }
    const prefix = `${sourceName}:${lineIndex + 1}`;
    if (!isRecord(record)) {
      issues.push(`${prefix}: expected an object.`);
      return;
    }
    for (const field of [
      "swipe_id",
      "study_id",
      "deck_hash",
      "annotator_id",
      "relation_id",
      "family_id",
      "card_hash",
      "rubric_version",
      "ts",
    ]) {
      if (typeof record[field] !== "string" || record[field] === "") {
        issues.push(`${prefix}: missing "${field}".`);
      }
    }
    if (!isLabel(record.label)) {
      issues.push(`${prefix}: label must be C/P/O/U.`);
    }
    if (record.prescreen !== "equivalence" && record.prescreen !== "normal") {
      issues.push(`${prefix}: prescreen must be "equivalence" or "normal".`);
    }
    if (!Number.isInteger(record.pass) || record.pass < 0) {
      issues.push(`${prefix}: pass must be a non-negative integer.`);
    }
    if (
      typeof record.latency_ms !== "number" ||
      !Number.isFinite(record.latency_ms) ||
      record.latency_ms < 0
    ) {
      issues.push(`${prefix}: latency_ms must be a non-negative number.`);
    }
    if (!Number.isInteger(record.shuffle_seed) || record.shuffle_seed < 0) {
      issues.push(`${prefix}: shuffle_seed must be a non-negative integer.`);
    }
    if (typeof record.ts === "string" && Number.isNaN(Date.parse(record.ts))) {
      issues.push(`${prefix}: ts must be a valid date-time string.`);
    }
    if (
      record.retracted !== undefined &&
      typeof record.retracted !== "boolean"
    ) {
      issues.push(`${prefix}: retracted must be a boolean when present.`);
    }
    if (
      record.qualification !== undefined &&
      typeof record.qualification !== "boolean"
    ) {
      issues.push(`${prefix}: qualification must be a boolean when present.`);
    }
    swipes.push({
      ...record,
      source_file: sourceName,
      retracted: Boolean(record.retracted),
      qualification: Boolean(record.qualification),
    });
  });
  if (issues.length > 0) {
    throw new SaltValidationError(`Could not load ${sourceName}.`, issues);
  }
  return swipes;
};

const latestVotesByAnnotator = (swipes) => {
  const latest = new Map();
  for (const swipe of swipes
    .filter((entry) => !entry.retracted && !entry.qualification)
    .sort(
      (left, right) =>
        left.pass - right.pass ||
        Date.parse(left.ts) - Date.parse(right.ts) ||
        String(left.swipe_id).localeCompare(String(right.swipe_id)),
    )) {
    latest.set(`${swipe.relation_id}\u001f${swipe.annotator_id}`, swipe);
  }
  return [...latest.values()];
};

const labelCounts = (labels) =>
  Object.fromEntries(
    LABELS.map((label) => [
      label,
      labels.filter((candidate) => candidate === label).length,
    ]),
  );

const shannonEntropy = (labels) => {
  if (labels.length === 0) {
    return 0;
  }
  const counts = labelCounts(labels);
  return LABELS.reduce((total, label) => {
    const probability = counts[label] / labels.length;
    return probability === 0
      ? total
      : total - probability * Math.log2(probability);
  }, 0);
};

const majorityLabel = (labels) => {
  if (labels.length === 0) {
    return null;
  }
  const counts = labelCounts(labels);
  const largest = Math.max(...Object.values(counts));
  const winners = LABELS.filter((label) => counts[label] === largest);
  return winners.length === 1 ? winners[0] : null;
};

const relationSummaries = (swipes, cards) => {
  const cardById = new Map(cards.map((card) => [card.relation_id, card]));
  const relationIds = new Set([
    ...cards.map((card) => card.relation_id),
    ...swipes.map((swipe) => swipe.relation_id),
  ]);
  return [...relationIds]
    .map((relationId) => {
      const relationSwipes = swipes
        .filter(
          (swipe) =>
            !swipe.retracted &&
            !swipe.qualification &&
            swipe.relation_id === relationId,
        )
        .sort(
          (left, right) =>
            left.annotator_id.localeCompare(right.annotator_id) ||
            left.pass - right.pass,
        );
      const labels = relationSwipes.map((swipe) => swipe.label);
      return {
        relation_id: relationId,
        card: cardById.get(relationId) ?? null,
        swipes: relationSwipes,
        labels,
        counts: labelCounts(labels),
        entropy: shannonEntropy(labels),
        majority: majorityLabel(labels),
        unanimous: labels.length > 0 && new Set(labels).size === 1,
        notes: relationSwipes
          .filter((swipe) => swipe.note)
          .map((swipe) => ({
            annotator_id: swipe.annotator_id,
            pass: swipe.pass,
            note: swipe.note,
          })),
      };
    })
    .sort(
      (left, right) =>
        right.entropy - left.entropy ||
        left.relation_id.localeCompare(right.relation_id),
    );
};

const nominalKrippendorffAlpha = (units) => {
  let observedDisagreement = 0;
  let coincidenceCount = 0;
  const marginals = new Map();

  for (const rawValues of units) {
    const values = rawValues.filter(
      (value) => value !== null && value !== undefined,
    );
    if (values.length < 2) {
      continue;
    }
    coincidenceCount += values.length;
    for (const value of values) {
      marginals.set(value, (marginals.get(value) ?? 0) + 1);
    }
    let disagreeingOrderedPairs = 0;
    for (let left = 0; left < values.length; left += 1) {
      for (let right = 0; right < values.length; right += 1) {
        if (left !== right && values[left] !== values[right]) {
          disagreeingOrderedPairs += 1;
        }
      }
    }
    observedDisagreement += disagreeingOrderedPairs / (values.length - 1);
  }

  if (coincidenceCount < 2) {
    return null;
  }
  const observed = observedDisagreement / coincidenceCount;
  const sameCategoryPairs = [...marginals.values()].reduce(
    (total, count) => total + count * (count - 1),
    0,
  );
  const expected =
    1 -
    sameCategoryPairs / (coincidenceCount * Math.max(1, coincidenceCount - 1));
  if (expected === 0) {
    return observed === 0 ? 1 : null;
  }
  return 1 - observed / expected;
};

const agreementMatrix = (swipes) => {
  const latest = latestVotesByAnnotator(swipes);
  const annotatorIds = [
    ...new Set(latest.map((swipe) => swipe.annotator_id)),
  ].sort();
  const relationIds = [
    ...new Set(latest.map((swipe) => swipe.relation_id)),
  ].sort();
  const byPair = new Map(
    latest.map((swipe) => [
      `${swipe.relation_id}\u001f${swipe.annotator_id}`,
      swipe.label,
    ]),
  );
  return {
    annotatorIds,
    relationIds,
    units: relationIds.map((relationId) =>
      annotatorIds.map(
        (annotatorId) =>
          byPair.get(`${relationId}\u001f${annotatorId}`) ?? null,
      ),
    ),
  };
};

const agreementStatistics = (swipes) => {
  const matrix = agreementMatrix(swipes);
  return {
    ...matrix,
    overall: nominalKrippendorffAlpha(matrix.units),
    by_class: Object.fromEntries(
      LABELS.map((label) => [
        label,
        nominalKrippendorffAlpha(
          matrix.units.map((unit) =>
            unit.map((value) =>
              value === null ? null : value === label ? label : "other",
            ),
          ),
        ),
      ]),
    ),
  };
};

const parseAdjudicationsJsonl = (
  text,
  sourceName = "adjudications.jsonl",
) => {
  const issues = [];
  const adjudications = [];
  text.split(/\r?\n/u).forEach((line, lineIndex) => {
    if (line.trim() === "") {
      return;
    }
    try {
      const record = JSON.parse(line);
      if (!isRecord(record) || !isLabel(record.label)) {
        issues.push(`${sourceName}:${lineIndex + 1}: invalid adjudication.`);
        return;
      }
      if (
        typeof record.relation_id !== "string" ||
        typeof record.rationale !== "string" ||
        record.rationale.trim() === ""
      ) {
        issues.push(
          `${sourceName}:${lineIndex + 1}: relation_id and rationale are required.`,
        );
        return;
      }
      adjudications.push(record);
    } catch (error) {
      issues.push(
        `${sourceName}:${lineIndex + 1}: invalid JSON (${error instanceof Error ? error.message : String(error)}).`,
      );
    }
  });
  if (issues.length > 0) {
    throw new SaltValidationError(`Could not load ${sourceName}.`, issues);
  }
  return adjudications;
};

const perAnnotatorGoldAgreement = (swipes, adjudications) => {
  const gold = new Map(
    adjudications.map((record) => [record.relation_id, record.label]),
  );
  const latest = latestVotesByAnnotator(swipes).filter((swipe) =>
    gold.has(swipe.relation_id),
  );
  const grouped = new Map();
  for (const swipe of latest) {
    const current = grouped.get(swipe.annotator_id) ?? {
      annotator_id: swipe.annotator_id,
      matching: 0,
      total: 0,
    };
    current.total += 1;
    current.matching += Number(swipe.label === gold.get(swipe.relation_id));
    grouped.set(swipe.annotator_id, current);
  }
  return [...grouped.values()]
    .map((entry) => ({
      ...entry,
      agreement: entry.total === 0 ? null : entry.matching / entry.total,
    }))
    .sort((left, right) => left.annotator_id.localeCompare(right.annotator_id));
};

const escapeMarkdownCell = (value) =>
  String(value ?? "")
    .replaceAll("|", "\\|")

const edgeCaseMarkdown = (summaries, adjudications = []) => {
  const adjudicationById = new Map(
    adjudications.map((record) => [record.relation_id, record]),
  );
  const lines = [
    "# SALT relation edge cases",
    "",
    "| Relation | Entropy | Labels | Notes | Adjudication | Rationale |",
    "| --- | ---: | --- | --- | --- | --- |",
  ];
  for (const summary of summaries.filter(
    (entry) => entry.entropy > 0 || entry.labels.includes("U"),
  )) {
    const adjudication = adjudicationById.get(summary.relation_id);
    const labelSequence = summary.swipes
      .map((swipe) => `${swipe.annotator_id}/p${swipe.pass}:${swipe.label}`)
      .join(", ");
    const notes = summary.notes
      .map((note) => `${note.annotator_id}/p${note.pass}: ${note.note}`)
      .join("; ");
    lines.push(
      `| ${escapeMarkdownCell(summary.relation_id)} | ${summary.entropy.toFixed(
        3,
      )} | ${escapeMarkdownCell(labelSequence)} | ${escapeMarkdownCell(
        notes || "—",
      )} | ${adjudication?.label ?? "—"} | ${escapeMarkdownCell(
        adjudication?.rationale ?? "—",
      )} |`,
    );
  }
  return `${lines.join("\n")}\n`;
};

const summarizeCoverage = (study, swipes) => {
  const latest = latestVotesByAnnotator(swipes);
  const coveredByRelation = new Map();
  for (const swipe of latest) {
    const annotators = coveredByRelation.get(swipe.relation_id) ?? new Set();
    annotators.add(swipe.annotator_id);
    coveredByRelation.set(swipe.relation_id, annotators);
  }
  const rows = study.cards.map((card) => ({
    relation_id: card.relation_id,
    expected: study.coverage_target,
    observed: coveredByRelation.get(card.relation_id)?.size ?? 0,
  }));
  return {
    rows,
    complete: rows.filter((row) => row.observed >= row.expected).length,
    total: rows.length,
  };
};

const formatPercent = (value, digits = 0) =>
